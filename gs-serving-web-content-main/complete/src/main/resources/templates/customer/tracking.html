<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/customer_layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Theo dõi đơn hàng - Premium Delivery</title>
    <!-- Leaflet Core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" th:href="@{/css/map-premium.css}" />
</head>
<body>

    <main>
        <div class="container mt-5 mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <div class="card-header bg-white p-4 border-0">
                            <div class="d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center">
                                    <a href="/customer/orders" class="btn btn-outline-secondary btn-sm rounded-circle me-3">
                                        <i class="bi bi-arrow-left"></i>
                                    </a>
                                    <div>
                                        <h4 class="fw-bold mb-0">Theo dõi đơn hàng #<span th:text="${order.id}">000</span></h4>
                                        <span class="text-muted small">Nhà hàng: <span th:text="${order.restaurant.restaurantName}">The Coffee House</span></span>
                                    </div>
                                </div>
                                <div class="text-end">
                                    <span class="badge bg-primary rounded-pill px-3 py-2 mb-1" id="orderPhaseBadge" th:text="${order.status}">ĐANG GIAO</span>
                                    <div id="driverNameLabel" class="small fw-bold text-muted" th:text="${order.driver != null ? order.driver.user.fullName : 'Đang tìm tài xế...'}">Tài xế</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="card-body p-0 position-relative">
                            <div id="map-container" style="height: 550px;">
                                <div id="tracking-map" style="width: 100%; height: 100%;">
                                    <div class="d-flex h-100 align-items-center justify-content-center bg-light text-muted">
                                        <div class="text-center">
                                            <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
                                            <p class="small mb-0">Đang khởi tạo bản đồ...</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <button class="btn btn-white rounded-circle shadow position-absolute top-0 end-0 m-3" 
                                        style="z-index: 1000; width: 45px; height: 45px; border: 1px solid #ddd;" 
                                        onclick="MapTracker.focusOnDriver()" title="Định vị tài xế">
                                    <i class="bi bi-crosshair text-primary"></i>
                                </button>

                                <div class="map-overlay-card d-flex align-items-center justify-content-between">
                                    <div>
                                        <div class="text-muted small">Thời gian dự kiến</div>
                                        <h5 class="fw-bold mb-0 text-primary" id="etaLabel" 
                                            th:text="${order.estimatedTimeOfArrival != null ? #temporals.format(order.estimatedTimeOfArrival, 'HH:mm') : '--:--'}">--:--</h5>
                                    </div>
                                    <div class="vr mx-3"></div>
                                    <div>
                                        <div class="text-muted small">Khoảng cách</div>
                                        <h5 class="fw-bold mb-0" th:text="${order.distance != null ? order.distance + ' km' : '--'}">0 km</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts bản đồ -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <script th:src="@{/js/map-tracking.js}"></script>
        <script th:src="@{/js/websocket-manager.js}"></script>
        <script th:src="@{/js/tracking-service.js}"></script>

        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function() {
                // Chỉ lấy các giá trị số đơn giản, không lấy cả đối tượng Order phức tạp
                const orderId = /*[[${order.id}]]*/ 0;
                let rLat = parseFloat(/*[[${order.restaurantLat}]]*/);
                let rLng = parseFloat(/*[[${order.restaurantLng}]]*/);
                let cLat = parseFloat(/*[[${order.deliveryLat}]]*/);
                let cLng = parseFloat(/*[[${order.deliveryLng}]]*/);
                
                const mapId = 'tracking-map';
                const container = document.getElementById(mapId);

                // NẾU LÀ ĐƠN HÀNG CŨ (CHƯA CÓ TỌA ĐỘ) -> DÙNG TỌA ĐỘ GIẢ (ĐH PHENIKAA) ĐỂ TEST BẢN ĐỒ
                if (isNaN(rLat) || isNaN(cLat)) {
                    console.warn("⚠️ Đơn hàng này chưa có tọa độ thật. Đang dùng tọa độ ảo để test.");
                    rLat = 20.962622; rLng = 105.740172;
                    cLat = 20.968500; cLng = 105.745050;
                }

                try {
                    if (typeof MapTracker === 'undefined') throw new Error("MapTracker not found");

                    // Khởi tạo Map
                    MapTracker.init(mapId, (rLat + cLat)/2, (rLng + cLng)/2);
                    MapTracker.initCustomerMap(rLat, rLng, cLat, cLng);

                    window.ORDER_COORDS = { rLat, rLng, cLat, cLng };
                    window.ORDER_ID = orderId;

                    const token = localStorage.getItem('jwt_token');
                    if (window.ORDER_ID && token) {
                        TrackingService.init(window.ORDER_ID, token);
                    }
                } catch (e) {
                    console.error("Map error:", e);
                    container.innerHTML = '<div class="p-4 text-center text-danger">Lỗi nạp bản đồ. Vui lòng F5.</div>';
                }
            });
        </script>
    </main>

</body>
</html>
