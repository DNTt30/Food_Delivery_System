<!DOCTYPE html>
<html th:replace="~{layouts/dashboard_layout :: layout(~{::title}, 'restaurant', ~{::main})}">
<head>
    <title>Đánh giá – Nhà hàng</title>
</head>
<body>
<main>
<div th:replace="~{fragments/header :: dashboard_header('restaurant')}"></div>

<style>
    .review-card { border-radius:14px;border:none;transition:box-shadow .2s,transform .2s; }
    .review-card:hover { box-shadow:0 6px 20px rgba(0,0,0,.09)!important;transform:translateY(-2px); }
    .star-display { font-size:1.1rem; }
    .avg-score { font-size:4rem;font-weight:800;line-height:1;color:#f59e0b; }
    .avg-label { font-size:.85rem;color:#9ca3af; }
    .bar-row { display:flex;align-items:center;gap:10px;margin-bottom:6px; }
    .bar-fill { height:8px;border-radius:4px;background:linear-gradient(90deg,#f59e0b,#fbbf24); }
    .bar-bg   { flex:1;height:8px;border-radius:4px;background:#f3f4f6;overflow:hidden; }
    .customer-avatar { width:36px;height:36px;border-radius:50%;
                       background:linear-gradient(135deg,#667eea,#764ba2);
                       color:#fff;font-weight:700;font-size:.9rem;
                       display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .review-comment { font-size:.9rem;color:#374151;line-height:1.6; }
    .review-date { font-size:.75rem;color:#9ca3af; }
    .filter-btn { border-radius:20px;font-size:.82rem;padding:5px 16px; }
    .filter-btn.active { background:#212529!important;color:#fff!important;border-color:#212529!important; }
</style>


<!-- Loading -->
<div id="loading" class="text-center py-5">
    <div class="spinner-border text-warning" role="status"></div>
    <p class="text-muted mt-2">Đang tải đánh giá...</p>
</div>

<!-- Summary + Chart -->
<div id="reviewContent" class="d-none">
    <!-- Statistics Cards Row -->
    <div class="row g-4 mb-4">
        <!-- Đánh giá trung bình -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4 text-center h-100" style="border-radius:14px; background: linear-gradient(135deg, #fffcf0 0%, #fff 100%); border-left: 5px solid #ffc107;">
                <div class="avg-score" id="avgScore">—</div>
                <div id="avgStars" class="star-display my-2">☆☆☆☆☆</div>
                <div class="avg-label text-muted">Đánh giá trung bình</div>
            </div>
        </div>
        <!-- Tổng đánh giá -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4 text-center h-100" style="border-radius:14px; background: linear-gradient(135deg, #f0f7ff 0%, #fff 100%); border-left: 5px solid #0d6efd;">
                <div class="display-5 fw-bold text-primary mt-2" id="statTotalReviews">0</div>
                <div class="text-muted small fw-semibold mt-3">Tổng Đánh Giá</div>
            </div>
        </div>
        <!-- Chưa phản hồi -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4 text-center h-100" style="border-radius:14px; background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); border-left: 5px solid #dc3545;">
                <div class="display-5 fw-bold text-danger mt-2" id="statUnrepliedReviews">0</div>
                <div class="text-muted small fw-semibold mt-3">Chưa Phản Hồi</div>
            </div>
        </div>
        <!-- Có Ảnh -->
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4 text-center h-100" style="border-radius:14px; background: linear-gradient(135deg, #f0fff4 0%, #fff 100%); border-left: 5px solid #198754;">
                <div class="display-5 fw-bold text-success mt-2" id="statReviewsWithImages">0</div>
                <div class="text-muted small fw-semibold mt-3">Đánh Giá Có Ảnh</div>
            </div>
        </div>
    </div>

    <!-- Rating Breakdown -->
    <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius:14px;">
        <h6 class="fw-bold mb-3 text-muted" style="font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;">Phân bố đánh giá</h6>
        <div id="ratingBars">
            <!-- filled by JS -->
        </div>
    </div>

    <!-- Filter by stars -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex gap-2 flex-wrap align-items-center">
            <span class="text-muted small fw-semibold me-1">Lọc:</span>
            <button class="btn btn-outline-secondary filter-btn active" data-stars="0" onclick="filterReviews(0, this)">Tất cả</button>
            <button class="btn btn-outline-warning filter-btn" data-stars="5" onclick="filterReviews(5, this)">⭐⭐⭐⭐⭐ 5 sao</button>
            <button class="btn btn-outline-success filter-btn" data-stars="4" onclick="filterReviews(4, this)">⭐⭐⭐⭐ 4 sao</button>
            <button class="btn btn-outline-info filter-btn" data-stars="3" onclick="filterReviews(3, this)">⭐⭐⭐ 3 sao</button>
            <button class="btn btn-outline-danger filter-btn" data-stars="2" onclick="filterReviews(2, this)">⭐⭐ ≤2 sao</button>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <select class="form-select form-select-sm" id="sortSelect" onchange="loadReviews()" style="width: auto;">
                <option value="newest">Mới Nhất</option>
                <option value="rating">Đánh Giá Cao Nhất</option>
            </select>
            <select class="form-select form-select-sm" id="pageSizeSelect" onchange="changePageSize(this)" style="width: auto;">
                <option value="6">6 đánh giá/trang</option>
                <option value="12">12 đánh giá/trang</option>
                <option value="24">24 đánh giá/trang</option>
            </select>
            <button class="btn btn-light border rounded-pill px-3 shadow-sm btn-sm" onclick="loadReviews()" title="Cập nhật">
                <i class="bi bi-arrow-clockwise"></i> Làm mới
            </button>
        </div>
    </div>

    <!-- Reviews List -->
    <div id="reviewList" class="row g-3"></div>

    <!-- Pagination Navigation -->
    <nav id="paginationNav" class="mt-4 d-flex justify-content-center"></nav>

    <div id="emptyFilter" class="text-center py-4 d-none">
        <div style="font-size:3rem">🔍</div>
        <p class="text-muted mt-2">Không có đánh giá nào với bộ lọc này</p>
    </div>
</div>

<!-- Empty State (no reviews at all) -->
<div id="emptyState" class="text-center py-5 d-none">
    <div style="font-size:4rem">⭐</div>
    <h5 class="fw-bold mt-2">Chưa có đánh giá nào</h5>
    <p class="text-muted">Các đánh giá của khách hàng sẽ hiển thị ở đây sau khi họ hoàn thành đơn hàng</p>
</div>

<script>
const token = localStorage.getItem('jwt_token');
let allReviews = [];
let filteredReviews = [];
let currentPage = 0;
let pageSize = 6; // Mặc định hiển thị 6 reviews/trang

function stars(rating, big) {
    const r = Math.round(rating || 0);
    const sz = big ? '1.3rem' : '1rem';
    return '⭐'.repeat(r) + '☆'.repeat(Math.max(0,5-r));
}

function fmtDate(s) {
    if (!s) return '';
    const d = Array.isArray(s) ? new Date(s[0],s[1]-1,s[2],s[3]||0,s[4]||0) : new Date(s);
    return d.toLocaleDateString('vi-VN', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

async function loadReviews() {
    document.getElementById('loading').classList.remove('d-none');
    document.getElementById('reviewContent').classList.add('d-none');
    document.getElementById('emptyState').classList.add('d-none');

    try {
        const sort = document.getElementById('sortSelect').value;
        // Lấy tất cả reviews từ API (size=1000) để phục vụ lọc sao và phân trang client-side mượt mà
        const res = await fetch('/api/restaurant/reviews?page=0&size=1000&sort=' + sort, { 
            headers: { 'Authorization':'Bearer '+token } 
        });
        if (res.status === 401 || res.status === 403) { window.location.href='/common/auth'; return; }
        const data = await res.json();
        allReviews = data.reviews || [];
        document.getElementById('loading').classList.add('d-none');

        if (!allReviews.length) { document.getElementById('emptyState').classList.remove('d-none'); return; }

        // Avg score
        const avg = data.avgRating || 0;
        document.getElementById('avgScore').textContent   = avg.toFixed(1);
        document.getElementById('avgStars').textContent   = stars(avg, true);

        // Load statistics cards & rating distribution
        await loadStatistics();

        document.getElementById('reviewContent').classList.remove('d-none');
        
        // Reset về tab "Tất cả" khi load mới hoặc giữ nguyên tab active hiện tại
        const activeFilterBtn = document.querySelector('.filter-btn.active');
        const starsVal = activeFilterBtn ? parseInt(activeFilterBtn.getAttribute('data-stars')) : 0;
        filterReviews(starsVal, activeFilterBtn || document.querySelector('.filter-btn'));
    } catch (e) {
        document.getElementById('loading').innerHTML = '<div class="text-danger text-center py-4">Lỗi kết nối</div>';
    }
}

async function loadStatistics() {
    try {
        const res = await fetch('/api/restaurant/reviews/statistics', { 
            headers: { 'Authorization': 'Bearer ' + token } 
        });
        if (res.ok) {
            const data = await res.json();
            document.getElementById('statTotalReviews').textContent = data.totalReviews || 0;
            document.getElementById('statUnrepliedReviews').textContent = data.unrepliedReviews || 0;
            document.getElementById('statReviewsWithImages').textContent = data.reviewsWithImages || 0;
            
            // Render phân bố sao
            renderRatingBars(data.ratingDistribution, data.totalReviews || 0);
        }
    } catch (e) {
        console.error("Lỗi khi tải thống kê:", e);
    }
}

function renderRatingBars(distribution, total) {
    const bars = document.getElementById('ratingBars');
    bars.innerHTML = '';
    
    const distMap = {};
    if (distribution && Array.isArray(distribution)) {
        distribution.forEach(row => {
            distMap[row[0]] = row[1];
        });
    }
    
    for (let s = 5; s >= 1; s--) {
        const cnt = distMap[s] || 0;
        const pct = total ? Math.round(cnt / total * 100) : 0;
        bars.insertAdjacentHTML('beforeend', `
        <div class="bar-row">
            <span style="width:32px;text-align:right;font-size:.8rem;font-weight:600;color:#6b7280;">${s}★</span>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span style="width:30px;font-size:.8rem;color:#9ca3af;">${cnt}</span>
        </div>`);
    }
}

function filterReviews(stars, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    filteredReviews = stars === 0 ? allReviews :
                      stars === 2 ? allReviews.filter(r => r.rating <= 2) :
                      allReviews.filter(r => r.rating === stars);
                      
    currentPage = 0;
    renderReviewsPage();
}

function changePageSize(select) {
    pageSize = parseInt(select.value);
    currentPage = 0;
    renderReviewsPage();
}

function changePage(page) {
    currentPage = page;
    renderReviewsPage();
}

function renderReviewsPage() {
    const list  = document.getElementById('reviewList');
    const empty = document.getElementById('emptyFilter');
    list.innerHTML = '';
    
    if (!filteredReviews.length) { 
        empty.classList.remove('d-none'); 
        document.getElementById('paginationNav').innerHTML = '';
        return; 
    }
    empty.classList.add('d-none');

    // Phân trang client-side
    const start = currentPage * pageSize;
    const end = Math.min(start + pageSize, filteredReviews.length);
    const pageReviews = filteredReviews.slice(start, end);

    pageReviews.forEach(r => {
        const initial = (r.customerName || 'K').charAt(0).toUpperCase();
        const starColor = r.rating >= 4 ? '#f59e0b' : r.rating === 3 ? '#84cc16' : '#ef4444';
        const escReply = r.restaurantReply ? esc(r.restaurantReply).replace(/'/g, "\\'") : '';

        list.insertAdjacentHTML('beforeend', `
        <div class="col-md-6 col-xl-4">
        <div class="card review-card shadow-sm h-100">
            <div class="card-body p-4">
                <div class="d-flex gap-3 mb-3">
                    <div class="customer-avatar">${initial}</div>
                    <div class="flex-grow-1">
                        <div class="fw-semibold" style="font-size:.9rem;">${esc(r.customerName || 'Khách')}</div>
                        <div class="review-date"><i class="bi bi-receipt me-1"></i>Đơn #${r.orderId} • ${fmtDate(r.createdAt)}</div>
                    </div>
                </div>
                <div class="mb-2" style="color:${starColor};font-size:1.15rem;">
                    ${'★'.repeat(r.rating || 0)}${'☆'.repeat(5 - (r.rating||0))}
                    <span class="ms-1 text-muted small">(${r.rating}/5)</span>
                </div>
                ${r.comment
                    ? `<p class="review-comment mb-2">"${esc(r.comment)}"</p>`
                    : `<p class="review-comment text-muted mb-2 fst-italic">Khách hàng không để lại bình luận</p>`}
                
                ${r.imageUrl ? `
                <div class="mb-3">
                    <a href="${r.imageUrl}" target="_blank" title="Cầm để xem ảnh">
                        <img src="${r.imageUrl}" class="img-thumbnail" style="max-height: 120px; width: auto; cursor: zoom-in;">
                    </a>
                </div>` : ''}

                ${r.restaurantReply ? `
                <div id="replyDisplay-${r.id}" class="bg-light p-3 rounded mt-2 border" style="border-color: #e2e8f0 !important;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <p class="mb-0 text-muted" style="font-size: 0.8rem;"><strong>Phản hồi từ quán của bạn:</strong></p>
                        <button class="btn btn-link btn-sm p-0 text-primary text-decoration-none" onclick="editReplyForm(${r.id}, '${escReply}')" style="font-size: 0.75rem;"><i class="bi bi-pencil me-1"></i>Sửa</button>
                    </div>
                    <p class="mb-1 fst-italic text-secondary" style="font-size: 0.85rem;">${esc(r.restaurantReply)}</p>
                    <span class="text-muted" style="font-size: 0.75rem;">${fmtDate(r.repliedAt)}</span>
                </div>
                <div id="form-container-${r.id}" class="d-none mt-2">
                    <textarea id="replyInput-${r.id}" class="form-control mb-2 text-sm" rows="2" placeholder="Nhập câu trả lời gửi đến khách..." style="font-size: 0.85rem;"></textarea>
                    <div class="text-end">
                        <button class="btn btn-secondary btn-sm me-1" onclick="hideReplyForm(${r.id})" style="font-size: 0.8rem;">Hủy bỏ</button>
                        <button class="btn btn-success btn-sm fw-bold" onclick="submitReply(${r.id})" style="font-size: 0.8rem;">Cập nhật</button>
                    </div>
                </div>` : `
                <div id="replyBox-${r.id}" class="mt-2">
                    <button id="replyBtn-${r.id}" class="btn btn-outline-primary btn-sm" onclick="showReplyForm(${r.id})" style="font-size: 0.8rem;"><i class="bi bi-chat-dots me-1"></i> Phản hồi</button>
                    <div id="form-container-${r.id}" class="d-none mt-2">
                        <textarea id="replyInput-${r.id}" class="form-control mb-2 text-sm" rows="2" placeholder="Nhập câu trả lời gửi đến khách..." style="font-size: 0.85rem;"></textarea>
                        <div class="text-end">
                            <button class="btn btn-secondary btn-sm me-1" onclick="hideReplyForm(${r.id})" style="font-size: 0.8rem;">Hủy bỏ</button>
                            <button class="btn btn-success btn-sm fw-bold" onclick="submitReply(${r.id})" style="font-size: 0.8rem;">Gửi phản hồi</button>
                        </div>
                    </div>
                </div>`}
            </div>
        </div>
        </div>`);
    });

    renderPagination();
}

function renderPagination() {
    const navContainer = document.getElementById('paginationNav');
    const totalPages = Math.ceil(filteredReviews.length / pageSize);
    
    if (totalPages <= 1) {
        navContainer.innerHTML = '';
        return;
    }
    
    let html = '<ul class="pagination pagination-warning mb-0 gap-1">';
    
    // Nút trước
    if (currentPage > 0) {
        html += `<li class="page-item"><button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="changePage(${currentPage - 1})">← Trước</button></li>`;
    } else {
        html += `<li class="page-item disabled"><button class="btn btn-outline-secondary btn-sm rounded-pill px-3" disabled>← Trước</button></li>`;
    }
    
    // Danh sách số trang
    for (let i = 0; i < totalPages; i++) {
        const isActive = i === currentPage ? 'btn-warning text-white' : 'btn-outline-secondary';
        html += `<li class="page-item"><button class="btn ${isActive} btn-sm rounded-pill px-3" onclick="changePage(${i})">${i + 1}</button></li>`;
    }
    
    // Nút sau
    if (currentPage < totalPages - 1) {
        html += `<li class="page-item"><button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="changePage(${currentPage + 1})">Sau →</button></li>`;
    } else {
        html += `<li class="page-item disabled"><button class="btn btn-outline-secondary btn-sm rounded-pill px-3" disabled>Sau →</button></li>`;
    }
    
    html += '</ul>';
    navContainer.innerHTML = html;
}

loadReviews();

// Reply form actions
function editReplyForm(id, oldText) {
    document.getElementById('replyDisplay-' + id).classList.add('d-none');
    document.getElementById('form-container-' + id).classList.remove('d-none');
    document.getElementById('replyInput-' + id).value = oldText;
}

function showReplyForm(id) {
    document.getElementById('replyBtn-' + id).classList.add('d-none');
    document.getElementById('form-container-' + id).classList.remove('d-none');
}

function hideReplyForm(id) {
    document.getElementById('form-container-' + id).classList.add('d-none');
    const displayEl = document.getElementById('replyDisplay-' + id);
    if (displayEl) {
        displayEl.classList.remove('d-none');
    } else {
        document.getElementById('replyBtn-' + id).classList.remove('d-none');
    }
}

async function submitReply(id) {
    const input = document.getElementById('replyInput-' + id);
    const text = input.value.trim();
    if (!text) return alert("Nội dung phản hồi không được rỗng!");

    try {
        const res = await fetch('/api/restaurant/reviews/' + id + '/reply', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ reply: text })
        });

        if (res.ok) {
            loadReviews(); // Tải lại danh sách để cập nhật view
        } else {
            const data = await res.json();
            alert(data.error || "Lỗi khi kết nối gửi dữ liệu đến API.");
        }
    } catch (err) {
        console.error("Error Reply:", err);
        alert("Lỗi kết nối.");
    }
}
</script>

</main>
</body>
</html>
