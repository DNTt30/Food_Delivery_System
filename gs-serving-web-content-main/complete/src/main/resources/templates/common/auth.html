<!DOCTYPE html>
<html th:replace="~{layouts/main_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Đăng nhập & Đăng ký - Antigravity Food</title>
</head>
<body>
<main>
    <div class="container py-5 mt-lg-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 overflow-hidden">
                    <div class="card-header bg-white p-0 border-0">
                        <ul class="nav nav-pills nav-fill bg-light p-2 m-3 rounded-pill" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-pill fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button">Đăng nhập</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-pill fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button">Đăng ký</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body p-4 p-md-5 pt-2">
                        <div class="tab-content" id="authTabsContent">
                            <!-- Login Pane -->
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                                <div class="text-center mb-4">
                                    <h4 class="fw-bold">Chào mừng trở lại</h4>
                                    <p class="text-muted small">Nhập thông tin để tiếp tục</p>
                                </div>
                                <div id="loginError" class="alert alert-danger d-none rounded-3 small py-2" role="alert"></div>
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Tên đăng nhập</label>
                                        <input type="text" class="form-control" id="loginUsername" placeholder="Ví dụ: customer, restaurant" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Mật khẩu</label>
                                        <input type="password" class="form-control" id="loginPassword" placeholder="********" required>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 py-3 fw-bold shadow-sm">Đăng nhập</button>
                                </form>
                            </div>

                            <!-- Register Pane -->
                            <div class="tab-pane fade" id="register-pane" role="tabpanel">
                                <div class="text-center mb-4">
                                    <h4 class="fw-bold">Tạo tài khoản mới</h4>
                                    <p class="text-muted small">Bắt đầu hành trình ẩm thực của bạn</p>
                                </div>
                                <div id="registerError" class="alert alert-danger d-none rounded-3 small py-2" role="alert"></div>
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Họ và Tên</label>
                                        <input type="text" class="form-control" id="regFullName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Email</label>
                                        <input type="email" class="form-control" id="regEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Vai trò</label>
                                        <select class="form-select" id="regRole" required>
                                            <option value="CUSTOMER">Khách hàng</option>
                                            <option value="RESTAURANT">Chủ nhà hàng</option>
                                            <option value="DRIVER">Tài xế</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Tên đăng nhập</label>
                                        <input type="text" class="form-control" id="regUsername" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold small text-muted text-uppercase">Mật khẩu</label>
                                        <input type="password" class="form-control" id="regPassword" required>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 py-3 fw-bold shadow-sm">Đăng ký tài khoản</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Handle URL params for direct register tab
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('register')) {
            document.getElementById('register-tab').click();
        }

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginError');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('jwt_token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.role);
                    
                    // Redirect based on role
                    if (data.role === 'CUSTOMER') window.location.href = "/customer/home";
                    else if (data.role === 'RESTAURANT') window.location.href = "/restaurant/dashboard";
                    else if (data.role === 'DRIVER') window.location.href = "/driver/dashboard";
                } else {
                    errorBox.textContent = data.error || 'Sai thông tin đăng nhập!';
                    errorBox.classList.remove('d-none');
                }
            } catch (err) {
                errorBox.textContent = 'Lỗi kết nối máy chủ!';
                errorBox.classList.remove('d-none');
            }
        });

        // Register Logic
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                fullName: document.getElementById('regFullName').value,
                email: document.getElementById('regEmail').value,
                username: document.getElementById('regUsername').value,
                password: document.getElementById('regPassword').value,
                role: document.getElementById('regRole').value
            };
            const errorBox = document.getElementById('registerError');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Đăng ký thành công! Hãy đăng nhập.');
                    document.getElementById('login-tab').click();
                } else {
                    errorBox.textContent = data.error || 'Đăng ký thất bại!';
                    errorBox.classList.remove('d-none');
                }
            } catch (err) {
                errorBox.textContent = 'Lỗi kết nối máy chủ!';
                errorBox.classList.remove('d-none');
            }
        });
    </script>
</main>
</body>
</html>
