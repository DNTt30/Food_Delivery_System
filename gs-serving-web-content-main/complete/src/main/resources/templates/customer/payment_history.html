<!DOCTYPE html>
<html th:replace="~{layouts/customer_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Lịch sử giao dịch - Food Delivery</title>
</head>
<body>
<main>

<div class="container mb-5" style="max-width: 800px;">

    <div class="d-flex align-items-center gap-3 mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-credit-card text-danger me-2"></i>Lịch sử giao dịch</h4>
    </div>

    <!-- Filter tabs -->
    <div class="d-flex gap-2 mb-4 overflow-auto">
        <button class="btn btn-dark btn-sm rounded-pill px-3 tab-btn active" data-status="ALL" onclick="filterPayments('ALL', this)">Tất cả</button>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="COMPLETED" onclick="filterPayments('COMPLETED', this)">Thành công</button>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="PENDING" onclick="filterPayments('PENDING', this)">Đang xử lý</button>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="FAILED" onclick="filterPayments('FAILED', this)">Thất bại</button>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="REFUNDED" onclick="filterPayments('REFUNDED', this)">Đã hoàn tiền</button>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-danger"></div>
        <p class="text-muted mt-2">Đang tải lịch sử giao dịch...</p>
    </div>

    <!-- Payments List -->
    <div id="paymentList" class="d-none"></div>

    <!-- Empty -->
    <div id="emptyState" class="text-center py-5 d-none">
        <div style="font-size:4rem">💳</div>
        <h5 class="fw-bold mt-2">Chưa có giao dịch nào</h5>
        <p class="text-muted">Hãy đặt món ngay hôm nay!</p>
        <a href="/customer/home" class="btn btn-danger rounded-pill px-4 mt-2">Đặt món ngay</a>
    </div>
</div>

<style>
.tab-btn.active { background: #212529 !important; color: white !important; border-color: #212529 !important; }
.transaction-row { transition: background-color 0.2s; cursor: default; }
.transaction-row:hover { background-color: #f8f9fa; }
.status-COMPLETED { background: #dcfce7; color: #166534; }
.status-PENDING { background: #fef3c7; color: #92400e; }
.status-FAILED { background: #fee2e2; color: #991b1b; }
.status-REFUNDED { background: #dbeafe; color: #1e40af; }
</style>

<script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/common/auth';

    let allPayments = [];

    const STATUS_LABELS = {
        COMPLETED: 'Thành công',
        PENDING: 'Đang xử lý',
        FAILED: 'Thất bại',
        REFUNDED: 'Đã hoàn tiền'
    };

    const PAYMENT_METHOD_LABELS = {
        VNPAY: 'VNPAY',
        MOMO: 'Ví MoMo',
        COD: 'Tiền mặt',
        CASH: 'Tiền mặt',
        CASH_ON_DELIVERY: 'Tiền mặt'
    };

    function formatVND(n) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n || 0); }
    function formatDate(dt) {
        if (!dt) return '';
        const d = new Date(dt);
        return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadPayments();
    });

    async function loadPayments() {
        try {
            const res = await fetch('/api/customer/payments', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.status === 401) { window.location.href = '/common/auth'; return; }
            allPayments = await res.json();
            document.getElementById('loading').classList.add('d-none');
            renderPayments(allPayments);
        } catch {
            document.getElementById('loading').innerHTML = '<div class="text-center text-danger"><i class="bi bi-wifi-off fs-1 d-block mb-2"></i>Lỗi kết nối</div>';
        }
    }

    function filterPayments(status, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtered = status === 'ALL' ? allPayments : allPayments.filter(p => p.paymentStatus === status);
        renderPayments(filtered);
    }

    function renderPayments(payments) {
        const el = document.getElementById('paymentList');
        const empty = document.getElementById('emptyState');
        if (!payments.length) {
            el.classList.add('d-none');
            empty.classList.remove('d-none');
            return;
        }
        empty.classList.add('d-none');
        el.classList.remove('d-none');
        
        let html = '<div class="list-group list-group-flush bg-white rounded-4 shadow-sm overflow-hidden">';
        
        payments.forEach(p => {
            let iconHtml = '';
            let amountPrefix = '- ';
            let amountColor = 'text-dark';
            let titlePrefix = 'Thanh toán';
            
            if (p.paymentStatus === 'REFUNDED') {
                amountPrefix = '+ ';
                amountColor = 'text-success';
                titlePrefix = 'Hoàn tiền';
                iconHtml = '<div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;"><i class="bi bi-arrow-down-left text-success fs-5"></i></div>';
            } else if (p.paymentMethod === 'VNPAY') {
                iconHtml = '<div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;"><i class="bi bi-bank2 text-primary fs-5"></i></div>';
            } else if (p.paymentMethod === 'MOMO' || p.paymentMethod === 'MOMO_E_WALLET') {
                iconHtml = '<div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px; background-color: #fee2e2;"><i class="bi bi-wallet2 text-danger fs-5"></i></div>';
            } else {
                iconHtml = '<div class="rounded-circle bg-secondary bg-opacity-10 d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;"><i class="bi bi-cash-stack text-secondary fs-5"></i></div>';
            }

            html += `
            <div class="list-group-item p-3 border-bottom d-flex align-items-center gap-3 transaction-row border-0" style="border-bottom: 1px solid #f1f5f9 !important;">
                ${iconHtml}
                <div class="flex-grow-1 min-w-0">
                    <div class="d-flex justify-content-between align-items-start mb-1 gap-2">
                        <h6 class="fw-bold mb-0 text-truncate" style="font-size: 0.95rem;">${titlePrefix}: ${p.restaurantName || 'Hệ thống'}</h6>
                        <span class="fw-bold ${amountColor} flex-shrink-0" style="font-size: 0.95rem;">${amountPrefix}${formatVND(p.amount)}</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted" style="font-size: 0.8rem;">${formatDate(p.transactionDate || p.orderTime)}</small>
                        <span class="badge rounded-pill status-${p.paymentStatus} fw-normal" style="font-size: 0.7rem; padding: 0.4em 0.7em;">${STATUS_LABELS[p.paymentStatus] || p.paymentStatus}</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-1">
                        <small class="text-muted" style="font-size: 0.75rem;"><i class="bi bi-receipt me-1"></i>Đơn #${p.orderId}</small>
                        <small class="text-muted" style="font-size: 0.75rem;"><i class="bi bi-credit-card-2-front me-1"></i>${PAYMENT_METHOD_LABELS[p.paymentMethod] || p.paymentMethod}</small>
                    </div>
                </div>
            </div>`;
        });
        
        html += '</div>';
        el.innerHTML = html;
    }
</script>

</main>
</body>
</html>
