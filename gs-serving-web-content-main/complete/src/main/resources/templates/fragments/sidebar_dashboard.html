<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar(role)" class="bg-dark text-white p-3 vh-100 position-fixed"
    style="width: 250px; left: 0; top: 0; z-index: 1000; overflow-y: auto;">
    <div class="text-center mb-3 mt-2">
        <h4 class="text-warning fw-bold"><i class="bi bi-bicycle"></i> Food Portal</h4>
        <p class="text-muted small mb-0 text-uppercase" th:text="${role}">Role</p>
    </div>

    <!-- ╔══════════════════════════════════════════════════════╗ -->
    <!-- ║  NOTIFICATION PANEL — Dark Sidebar Edition           ║ -->
    <!-- ╚══════════════════════════════════════════════════════╝ -->
    <style th:if="${role != 'admin'}">
        /* ── Wrapper ─────────────────────────────────────────── */
        #sidebarNotifWrapper {
            position: relative;
            margin-bottom: 8px;
        }

        /* ── Trigger button (full width, dark style) ────────── */
        #sidebarNotifBtn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s, border-color .15s;
            color: #f9fafb;
            text-align: left;
        }

        #sidebarNotifBtn:hover {
            background: rgba(255, 255, 255, .14);
            border-color: rgba(255, 255, 255, .25);
        }

        #sidebarNotifBtn .sn-icon {
            font-size: 1.1rem;
            color: #fbbf24;
            flex-shrink: 0;
            position: relative;
        }

        #sidebarNotifBtn .sn-label {
            font-size: .82rem;
            font-weight: 600;
            color: #e5e7eb;
            flex: 1;
        }

        #sidebarNotifBtn .sn-badge {
            background: #ef4444;
            color: #fff;
            font-size: .65rem;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            padding: 0 5px;
            display: none;
            align-items: center;
            justify-content: center;
            animation: snBadgePop .2s ease-out;
        }

        @keyframes snBadgePop {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        #sidebarNotifBtn .sn-chevron {
            font-size: .65rem;
            color: #9ca3af;
            transition: transform .2s;
        }

        #sidebarNotifWrapper.open #sidebarNotifBtn .sn-chevron {
            transform: rotate(180deg);
        }

        /* ── Dropdown — opens to the RIGHT of sidebar ─────────── */
        #sidebarNotifDropdown {
            display: none;
            position: fixed;
            top: auto;
            left: 258px;
            /* sidebar width 250px + gap 8px */
            width: 360px;
            max-height: 520px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .22), 0 4px 16px rgba(0, 0, 0, .1);
            border: 1px solid #f3f4f6;
            z-index: 2100;
            overflow: hidden;
            animation: snDropSlide .2s ease-out;
        }

        @keyframes snDropSlide {
            from {
                opacity: 0;
                transform: translateX(-10px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        #sidebarNotifWrapper.open #sidebarNotifDropdown {
            display: block;
        }

        /* ── Dropdown header ─────────────────────────────────── */
        .sn-dhead {
            padding: 14px 16px 10px;
            background: linear-gradient(135deg, #fffbeb, #fff);
            border-bottom: 1px solid #f3f4f6;
        }

        .sn-dhead-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .sn-dtitle {
            font-size: .9rem;
            font-weight: 700;
            color: #111827;
        }

        .sn-mark-all {
            font-size: .72rem;
            color: #ef4444;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .sn-mark-all:hover {
            opacity: .7;
        }

        /* ── Tabs ───────────────────────────────────────────── */
        .sn-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .sn-tab {
            padding: 3px 11px;
            border-radius: 20px;
            font-size: .7rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            background: #f3f4f6;
            color: #6b7280;
            transition: all .14s;
        }

        .sn-tab.active {
            background: #f59e0b;
            color: #fff;
        }

        /* ── List ───────────────────────────────────────────── */
        #sidebarNotifList {
            max-height: 340px;
            overflow-y: auto;
        }

        #sidebarNotifList::-webkit-scrollbar {
            width: 4px;
        }

        #sidebarNotifList::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }

        /* ── Item ───────────────────────────────────────────── */
        .sn-item {
            display: flex;
            gap: 11px;
            padding: 11px 16px;
            border-bottom: 1px solid #f9fafb;
            cursor: pointer;
            transition: background .12s;
            position: relative;
        }

        .sn-item:hover {
            background: #fffbeb;
        }

        .sn-item.unread {
            background: #fff9f0;
        }

        .sn-item.unread::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .sn-iicon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .sn-ibody {
            flex: 1;
            min-width: 0;
        }

        .sn-ititle {
            font-size: .8rem;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sn-imsg {
            font-size: .72rem;
            color: #6b7280;
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .sn-itime {
            font-size: .63rem;
            color: #9ca3af;
            margin-top: 3px;
        }

        /* ── Skeleton ───────────────────────────────────────── */
        .sn-skel-item {
            display: flex;
            gap: 11px;
            padding: 11px 16px;
            border-bottom: 1px solid #f9fafb;
        }

        .sn-skel {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: snSkelShimmer 1.2s infinite;
            border-radius: 6px;
        }

        @keyframes snSkelShimmer {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        /* ── Empty ──────────────────────────────────────────── */
        .sn-empty {
            text-align: center;
            padding: 30px 16px;
            color: #9ca3af;
            font-size: .8rem;
        }

        .sn-empty-icon {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 8px;
        }

        /* ── Footer ─────────────────────────────────────────── */
        .sn-dfooter {
            padding: 8px 16px;
            border-top: 1px solid #f3f4f6;
            text-align: center;
            font-size: .72rem;
            color: #6b7280;
        }

        /* ── Toast ──────────────────────────────────────────── */
        .sn-toast {
            position: fixed;
            bottom: 22px;
            right: 22px;
            width: 300px;
            background: #fff;
            border-radius: 13px;
            box-shadow: 0 10px 36px rgba(0, 0, 0, .18);
            border-left: 4px solid #f59e0b;
            padding: 12px 14px;
            z-index: 9999;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            cursor: pointer;
            animation: snToastIn .28s ease-out;
        }

        @keyframes snToastIn {
            from {
                opacity: 0;
                transform: translateX(36px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        .sn-toast-title {
            font-size: .8rem;
            font-weight: 700;
            color: #111827;
        }

        .sn-toast-msg {
            font-size: .72rem;
            color: #6b7280;
            margin-top: 2px;
        }
    </style>

    <div id="sidebarNotifWrapper" th:if="${role != 'admin'}">
        <!-- Trigger Button -->
        <button id="sidebarNotifBtn" onclick="SidebarNotif.toggle()" type="button">
            <span class="sn-icon">

            </span>
            <span class="sn-label">Thông báo</span>

            <i class="bi bi-chevron-right sn-chevron"></i>

        <!-- Dropdown (to the RIGHT) -->
        <div id="sidebarNotifDropdown">
            <!-- Header -->
            <div class="sn-dhead">
                <div class="sn-dhead-top">
                    <span class="sn-dtitle">🔔 Thông báo</span>
                    <button class="sn-mark-all" onclick="SidebarNotif.markAllRead()">

                <div class="sn-tabs">

                    <button class="sn-tab" onclick="SidebarNotif.setFilter('REVIEW',this)">Đánh giá</button>
                    <button class="sn-tab" onclick="SidebarNotif.setFilter('SYSTEM',this)">Hệ thống</button>

            </div>

            <!-- List -->
            <div id="sidebarNotifList">
                <!-- Skeleton -->
                <div id="sidebarNotifSkeleton">
                    <div class="sn-skel-item">
                        <div class="sn-skel" style="width:38px;height:38px;border-radius:10px;flex-shrink:0;"></div>
                        <div style="flex:1;">
                            <div class="sn-skel" style="width:55%;height:11px;margin-bottom:5px;"></div>
                            <div class="sn-skel" style="width:85%;height:9px;"></div>
                        </div>
                    </div>
                    <div class="sn-skel-item">
                        <div class="sn-skel" style="width:38px;height:38px;border-radius:10px;flex-shrink:0;"></div>
                        <div style="flex:1;">
                            <div class="sn-skel" style="width:65%;height:11px;margin-bottom:5px;"></div>
                            <div class="sn-skel" style="width:80%;height:9px;"></div>
                        </div>
                    </div>
                </div>
                <div id="sidebarNotifItems"></div>
            </div>

            <div class="sn-dfooter" id="sidebarNotifFooter">Đang tải...</div>
        </div>
    </div>
    <!-- ═══════════════ END NOTIFICATION PANEL ═══════════════ -->

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const path = window.location.pathname;
            document.querySelectorAll('.sidebar-link').forEach(function (link) {
                const href = link.getAttribute('href');
                const isActive = href === path || (href !== '/admin/dashboard' && href !== '/driver/dashboard' && href !== '/restaurant/dashboard' && path.startsWith(href));
                if (isActive || href === path) {
                    link.classList.add('active');
                    if (path.startsWith('/restaurant')) {
                        link.classList.add('bg-warning', 'text-dark');
                        link.classList.remove('text-white');
                    } else if (path.startsWith('/admin')) {
                        link.classList.add('bg-danger');
                    } else {
                        link.classList.add('bg-primary');
                    }
                }
            });
        });
    </script>

    <!-- ╔════════════════════════════════════════════════════════╗ -->
    <!-- ║  SidebarNotif — self-contained notification engine     ║ -->
    <!-- ╚════════════════════════════════════════════════════════╝ -->
    <script>
        (function () {
            'use strict';

            const TOKEN = () => localStorage.getItem('jwt_token') || '';
            const POLL_MS = 5000;

            let _all = [];
            let _filter = 'ALL';
            let _isOpen = false;
            let _pollTimer = null;
            let _prevCount = 0;
            let _toastQ = [];
            let _toastBusy = false;

            // Type → filter group
            const GROUP = {
                ORDER_CREATED: 'ORDER', ORDER_ACCEPTED: 'ORDER', ORDER_PREPARING: 'ORDER',
                DRIVER_ASSIGNED: 'ORDER', ORDER_DELIVERING: 'ORDER',
                ORDER_COMPLETED: 'ORDER', ORDER_CANCELLED: 'ORDER',
                PAYMENT_SUCCESS: 'ORDER', PAYMENT_FAILED: 'ORDER',
                NEW_REVIEW: 'REVIEW', NEW_PROMOTION: 'SYSTEM', SYSTEM_ALERT: 'SYSTEM'
            };

            // Type → icon background
            const ICONBG = {
                ORDER_CREATED: '#eff6ff', ORDER_ACCEPTED: '#f0fdf4',
                ORDER_PREPARING: '#eff6ff', DRIVER_ASSIGNED: '#f0fdf4',
                ORDER_DELIVERING: '#f0fdf4', ORDER_COMPLETED: '#f0fdf4',
                ORDER_CANCELLED: '#fef2f2', PAYMENT_SUCCESS: '#f0fdf4',
                PAYMENT_FAILED: '#fef2f2', NEW_REVIEW: '#fffbeb',
                NEW_PROMOTION: '#f0f9ff', SYSTEM_ALERT: '#fffbeb'
            };

            const EMOJI = {
                ORDER_CREATED: '🍔', ORDER_ACCEPTED: '✅', ORDER_PREPARING: '👨‍🍳',
                DRIVER_ASSIGNED: '🛵', ORDER_DELIVERING: '🛵', ORDER_COMPLETED: '🎉',
                ORDER_CANCELLED: '❌', PAYMENT_SUCCESS: '💳', PAYMENT_FAILED: '⚠️',
                NEW_REVIEW: '⭐', NEW_PROMOTION: '🎁', SYSTEM_ALERT: '🔔'
            };

            // ── DOM helpers ──────────────────────────────────────────
            const $wrapper = () => document.getElementById('sidebarNotifWrapper');
            const $dropdown = () => document.getElementById('sidebarNotifDropdown');
            const $items = () => document.getElementById('sidebarNotifItems');
            const $skel = () => document.getElementById('sidebarNotifSkeleton');
            const $badge = () => document.getElementById('sidebarNotifBadge');
            const $bell = () => document.getElementById('sidebarBellIcon');
            const $footer = () => document.getElementById('sidebarNotifFooter');

            // ── Position dropdown vertically next to trigger btn ─────
            function _positionDropdown() {
                const btn = document.getElementById('sidebarNotifBtn');
                if (!btn) return;
                const rect = btn.getBoundingClientRect();
                const dd = $dropdown();
                if (!dd) return;
                // Place dropdown top at same Y as button, max so it doesn't overflow bottom
                const maxTop = window.innerHeight - 530;
                dd.style.top = Math.min(rect.top, Math.max(60, maxTop)) + 'px';
            }

            // ════════════════════════════════════════════════════════
            // PUBLIC API
            // ════════════════════════════════════════════════════════
            window.SidebarNotif = {
                toggle() {
                    _isOpen = !_isOpen;
                    const w = $wrapper();
                    if (!w) return;
                    if (_isOpen) {
                        w.classList.add('open');
                        _positionDropdown();
                        _renderList();
                        if (_prevCount > 0) _markAllSilent();
                    } else {
                        w.classList.remove('open');
                    }
                },

                close() {
                    _isOpen = false;
                    const w = $wrapper();
                    if (w) w.classList.remove('open');
                },

                setFilter(f, btn) {
                    _filter = f;
                    document.querySelectorAll('.sn-tab').forEach(b => b.classList.remove('active'));
                    if (btn) btn.classList.add('active');
                    _renderList();
                },

                markAllRead() {
                    _markAllSilent();
                    _all.forEach(n => n.read = true);
                    _renderList();
                    _updateBadge(0);
                }
            };

            // ════════════════════════════════════════════════════════
            // FETCH + POLL
            // ════════════════════════════════════════════════════════
            async function _fetch() {
                if (!TOKEN()) return;
                try {
                    const res = await fetch('/api/notifications', {
                        headers: { Authorization: 'Bearer ' + TOKEN() }
                    });
                    if (!res.ok) return;
                    const data = await res.json();

                    // Detect new unread for toast
                    const news = data.filter(n => !n.read && !_all.find(o => o.id === n.id));
                    news.forEach(n => _queueToast(n));

                    _all = data;
                    const unread = data.filter(n => !n.read).length;

                    if ($skel()) $skel().style.display = 'none';
                    if (_isOpen) _renderList();
                    _updateBadge(unread);
                    _updateFooter(data.length, unread);
                    _prevCount = unread;
                } catch (e) { /* silent */ }
            }

            function _start() { _fetch(); _pollTimer = setInterval(_fetch, POLL_MS); }
            function _stop() { clearInterval(_pollTimer); }

            // ════════════════════════════════════════════════════════
            // RENDER
            // ════════════════════════════════════════════════════════
            function _renderList() {
                const el = $items();
                if (!el) return;
                const visible = _filter === 'ALL'
                    ? _all : _all.filter(n => GROUP[n.type] === _filter);
                if (visible.length === 0) {
                    el.innerHTML = `<div class="sn-empty">
                    <span class="sn-empty-icon">🔕</span>Chưa có thông báo nào
                </div>`;
                    return;
                }
                el.innerHTML = visible.map(_itemHTML).join('');
            }

            function _itemHTML(n) {
                const bg = ICONBG[n.type] || '#f9fafb';
                const unread = n.read ? '' : 'unread';
                const url = n.actionUrl || '#';
                const icon = n.icon || 'bi-bell';
                const color = n.color || 'text-secondary';
                return `<div class="sn-item ${unread}" onclick="SidebarNotif_click(${n.id},'${_esc(url)}')" role="button">
                <div class="sn-iicon" style="background:${bg};">
                    <i class="bi ${_esc(icon)} ${_esc(color)}"></i>
                </div>
                <div class="sn-ibody">
                    <div class="sn-ititle">${_esc(n.title || '')}</div>
                    <div class="sn-imsg">${_esc(n.message || '')}</div>
                    <div class="sn-itime">${_esc(n.timeAgo || '')}</div>
                </div>
            </div>`;
            }

            // ════════════════════════════════════════════════════════
            // MARK READ
            // ════════════════════════════════════════════════════════
            window.SidebarNotif_click = function (id, url) {
                const n = _all.find(x => x.id === id);
                if (n && !n.read) {
                    n.read = true;
                    fetch('/api/notifications/' + id + '/read', {
                        method: 'PUT', headers: { Authorization: 'Bearer ' + TOKEN() }
                    }).catch(() => { });
                    _updateBadge(_all.filter(x => !x.read).length);
                    _renderList();
                }
                if (url && url !== '#' && url !== 'null') window.location.href = url;
            };

            function _markAllSilent() {
                fetch('/api/notifications/read-all', {
                    method: 'PUT', headers: { Authorization: 'Bearer ' + TOKEN() }
                }).catch(() => { });
            }

            // ════════════════════════════════════════════════════════
            // BADGE
            // ════════════════════════════════════════════════════════
            function _updateBadge(count) {
                const b = $badge();
                if (!b) return;
                if (count > 0) {
                    b.textContent = count > 99 ? '99+' : count;
                    b.style.display = 'flex';
                    b.style.animation = 'none';
                    void b.offsetWidth;
                    b.style.animation = 'snBadgePop .2s ease-out';
                } else {
                    b.style.display = 'none';
                }
            }

            function _updateFooter(total, unread) {
                const el = $footer();
                if (!el) return;
                el.innerHTML = unread > 0
                    ? `<span style="color:#ef4444;font-weight:600;">${unread} chưa đọc</span> / ${total} thông báo`
                    : `${total} thông báo · Đã đọc tất cả ✓`;
            }

            // ════════════════════════════════════════════════════════
            // TOAST
            // ════════════════════════════════════════════════════════
            function _queueToast(n) { _toastQ.push(n); if (!_toastBusy) _nextToast(); }

            function _nextToast() {
                if (!_toastQ.length) { _toastBusy = false; return; }
                _toastBusy = true;
                const n = _toastQ.shift();
                const t = document.createElement('div');
                t.className = 'sn-toast';
                t.onclick = () => { t.remove(); if (n.actionUrl && n.actionUrl !== '#') window.location.href = n.actionUrl; };
                t.innerHTML = `<div style="font-size:1.3rem;">${EMOJI[n.type] || '🔔'}</div>
                <div><div class="sn-toast-title">${_esc(n.title || '')}</div>
                <div class="sn-toast-msg">${_esc(n.message || '')}</div></div>`;
                document.body.appendChild(t);
                setTimeout(() => {
                    t.style.transition = 'opacity .3s,transform .3s';
                    t.style.opacity = '0'; t.style.transform = 'translateX(36px)';
                    setTimeout(() => { t.remove(); _nextToast(); }, 320);
                }, 4000);
            }

            // ════════════════════════════════════════════════════════
            // UTILS
            // ════════════════════════════════════════════════════════
            function _esc(s) {
                return (s || '').toString()
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            // Close on outside click
            document.addEventListener('click', function (e) {
                const w = document.getElementById('sidebarNotifWrapper');
                if (w && !w.contains(e.target)) SidebarNotif.close();
            });

            // Init
            if (TOKEN()) _start();
            window.addEventListener('storage', e => {
                if (e.key === 'jwt_token' && e.newValue) _start();
                if (e.key === 'jwt_token' && !e.newValue) _stop();
            });

        })();
    </script>
</div>

</html>
