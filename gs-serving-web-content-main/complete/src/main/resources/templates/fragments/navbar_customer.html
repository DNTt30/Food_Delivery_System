            opacity: 0.9;
        }

        .navbar-brand .brand-logo {
            width: 40px;

        }

        .nav-badge {

        .user-profile-btn {

        }

        .dropdown-item-premium {
            border-radius: 10px;

            transition: all 0.2s;
        }

        .dropdown-item-premium:hover {
            background: #fef2f2;
            color: var(--nav-accent);
        }
    </style>
    <div class="container">
        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="/customer/home">
            <div class="brand-logo">
                <i class="bi bi-lightning-fill text-white"></i>
            </div>
            <span class="fw-bold text-dark fs-5">Food<span style="color: var(--nav-accent);">Delivery</span></span>
        </a>

        <!-- Hamburger -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCustomer">
            <i class="bi bi-list fs-3"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarCustomer">
            <!-- Search Bar -->
            <div class="mx-auto my-3 my-lg-0 nav-search-wrapper d-flex align-items-center">
                <i class="bi bi-search text-muted ms-2 small"></i>
                <input type="text" id="navSearchInput" 
                       class="form-control border-0 bg-transparent shadow-none small" 
                       placeholder="Bạn muốn ăn gì?"
                       onkeydown="if(event.key==='Enter')navSearch()">
                <button class="btn btn-sm text-white px-3 fw-bold" 
                        style="background: var(--nav-accent); border-radius: 8px;" 
                        onclick="navSearch()">Tìm</button>
            </div>

            <!-- Action Buttons -->
            <ul class="navbar-nav ms-auto align-items-center gap-3">
                <li class="nav-item">

                <li class="nav-item">
                    <a class="nav-action-btn text-decoration-none" href="javascript:void(0)" onclick="goToCart(event)">

                        <span id="cartBadge" class="nav-badge d-none">0</span>
                    </a>
                </li>

                <li class="nav-item">
                    <div th:replace="~{fragments/notification_bell :: bell}"></div>
                </li>

                <!-- User Profile -->
                <li class="nav-item dropdown">
                    <a class="nav-link user-profile-btn d-flex align-items-center gap-2" href="#" data-bs-toggle="dropdown">
                        <div id="navAvatarCircle" class="avatar-ring">U</div>
                        <span class="fw-bold text-dark small d-none d-lg-block" id="navUserName">Khách</span>
                        <i class="bi bi-chevron-down text-muted small d-none d-lg-block"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-premium shadow">
                        <li class="px-3 py-2 mb-1">

                        <li><hr class="dropdown-divider"></li>

                            <button class="dropdown-item dropdown-item-premium text-danger fw-bold" 
                                    onclick="localStorage.clear(); window.location.href='/';">

</nav>

<script>
(function () {
    function updateCartBadge() {
        let total = 0;
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('fd_cart_')) {
                try { total += Object.values(JSON.parse(localStorage.getItem(k)) || {}).reduce((s, it) => s + (it.quantity || 0), 0); } catch {}
            }
        }
        const badge = document.getElementById('cartBadge');
        if (!badge) return;
        if (total > 0) { 
            badge.textContent = total > 99 ? '99+' : total; 
            badge.classList.remove('d-none'); 
        } else {
            badge.classList.add('d-none');
        }
    }

    function applyUserInfo(username) {
        if (!username) return;
        const initial = username.charAt(0).toUpperCase();
        const avatar = document.getElementById('navAvatarCircle');
        const nameLabel = document.getElementById('navUserName');
        const dropName = document.getElementById('navDropdownName');
        if (avatar) avatar.textContent = initial;
        if (nameLabel) nameLabel.textContent = username;
        if (dropName) dropName.textContent = username;
    }

    function updateNavUser() {
        const token = localStorage.getItem('jwt_token');
        const username = localStorage.getItem('username');
        if (username) {
            applyUserInfo(username);
        } else if (token) {
            fetch('/api/profile/me', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    if (d) {
                        const name = d.fullName || d.username;
                        localStorage.setItem('username', name);
                        applyUserInfo(name);
                    }
                }).catch(() => {});
        }
    }

    window.navSearch = function () {
        const q = document.getElementById('navSearchInput')?.value.trim();
        if (q) window.location.href = '/customer/home?search=' + encodeURIComponent(q);
    };

    window.goToCart = function (e) {
        e?.preventDefault();
        let found = null;
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('fd_cart_')) {
                try {
                    const c = JSON.parse(localStorage.getItem(k));
                    if (Object.values(c || {}).some(it => (it.quantity || 0) > 0)) { found = k; break; }
                } catch {}
            }
        }
        window.location.href = found ? '/customer/cart?restaurantId=' + found.replace('fd_cart_', '') : '/customer/home';
    };

    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        updateNavUser();
        
        // Change navbar on scroll
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('customerNavbar');
            if (window.scrollY > 20) {
                nav.style.padding = '8px 0';
                nav.style.boxShadow = '0 10px 30px rgba(0,0,0,0.05)';
            } else {
                nav.style.padding = '12px 0';
                nav.style.boxShadow = 'none';
            }
        });
    });
    window.addEventListener('storage', updateCartBadge);
})();
</script>

</html>
