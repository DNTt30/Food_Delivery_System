<!DOCTYPE html>
<html th:replace="~{layouts/dashboard_layout :: layout(~{::title}, 'admin', ~{::main})}">
<head>
    <title>Admin - Quản lý Đối tác</title>
</head>
<body>
<main>
<div th:replace="~{fragments/header :: dashboard_header('admin')}"></div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-0"><i class="bi bi-people-fill me-2 text-danger"></i>Quản lý Đối tác</h4>
        <small class="text-muted">Quản lý người dùng và nhà hàng trong hệ thống</small>
    </div>
    <button class="btn btn-outline-secondary rounded-pill px-3" onclick="loadAll()">
        <i class="bi bi-arrow-clockwise me-1"></i>Làm mới
    </button>
</div>

<!-- Tabs -->
<div class="d-flex gap-2 mb-4">
    <button class="btn btn-danger btn-sm rounded-pill px-4 tab-btn active" data-tab="users" onclick="switchTab('users', this)">
        <i class="bi bi-people me-1"></i>Người dùng
    </button>
    <button class="btn btn-outline-secondary btn-sm rounded-pill px-4 tab-btn" data-tab="restaurants" onclick="switchTab('restaurants', this)">
        <i class="bi bi-shop me-1"></i>Nhà hàng
    </button>
</div>

<!-- Loading -->
<div id="loading" class="text-center py-5">
    <div class="spinner-border text-danger"></div>
    <p class="text-muted mt-2">Đang tải...</p>
</div>

<!-- Users Panel -->
<div id="usersPanel" class="d-none">
    <!-- Search -->
    <div class="input-group mb-3" style="max-width:320px;">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
        <input type="text" id="userSearch" class="form-control border-start-0" placeholder="Tìm người dùng..." oninput="filterUsers(this.value)">
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle rounded-4 overflow-hidden shadow-sm">
            <thead class="table-light">
                <tr>
                    <th>ID</th><th>Tên đăng nhập</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th class="text-end">Hành động</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Restaurants Panel -->
<div id="restaurantsPanel" class="d-none">
    <!-- Filter -->
    <div class="d-flex gap-2 mb-3 flex-wrap">
        <div class="input-group" style="max-width:280px;">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="restSearch" class="form-control border-start-0" placeholder="Tìm nhà hàng..." oninput="filterRestaurants(this.value)">
        </div>
        <select class="form-select" style="max-width:180px;" onchange="filterRestStatus(this.value)">
            <option value="all">Tất cả trạng thái</option>
            <option value="open">Đang mở</option>
            <option value="closed">Đóng cửa</option>
        </select>
    </div>
    <div id="restaurantCards" class="row g-3"></div>
</div>

<!-- Empty State -->
<div id="emptyState" class="text-center py-5 d-none">
    <div style="font-size:3rem">📋</div>
    <h6 class="fw-bold mt-2">Không có dữ liệu</h6>
</div>


<!-- Confirm Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0">
                <h6 class="modal-title fw-bold" id="confirmTitle">Xác nhận</h6>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-0">
                <p class="text-muted small" id="confirmMsg"></p>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button class="btn btn-light btn-sm rounded-pill px-3" data-bs-dismiss="modal">Hủy</button>
                <button class="btn btn-danger btn-sm rounded-pill px-3" id="confirmBtn">Xác nhận</button>
            </div>
        </div>
    </div>
</div>

<style>
.tab-btn.active { background: #dc3545 !important; color: white !important; border-color: #dc3545 !important; }
.rest-card { border-radius: 14px !important; transition: box-shadow 0.2s; }
.rest-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1) !important; }
</style>

<script>
    const token = localStorage.getItem('jwt_token');
    let allUsers = [], allRestaurants = [];
    let currentTab = 'users';
    let restFilter = 'all';
    let confirmModal, confirmAction;

    document.addEventListener('DOMContentLoaded', () => {
        confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
        document.getElementById('confirmBtn').onclick = () => { confirmModal.hide(); confirmAction && confirmAction(); };
        loadAll();
    });

    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('active');
            b.className = b.className.replace('btn-danger', 'btn-outline-secondary');
        });
        btn.classList.add('active');
        btn.className = btn.className.replace('btn-outline-secondary', 'btn-danger');
        document.getElementById('usersPanel').classList.toggle('d-none', tab !== 'users');
        document.getElementById('restaurantsPanel').classList.toggle('d-none', tab !== 'restaurants');
    }

    async function loadAll() {
        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('usersPanel').classList.add('d-none');
        document.getElementById('restaurantsPanel').classList.add('d-none');
        try {
            const [uRes, rRes] = await Promise.all([
                fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } }),
                fetch('/api/admin/restaurants', { headers: { 'Authorization': 'Bearer ' + token } })
            ]);
            if (uRes.status === 401 || uRes.status === 403) { window.location.href = '/common/auth'; return; }
            allUsers = uRes.ok ? await uRes.json() : [];
            allRestaurants = rRes.ok ? await rRes.json() : [];
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('usersPanel').classList.toggle('d-none', currentTab !== 'users');
            document.getElementById('restaurantsPanel').classList.toggle('d-none', currentTab !== 'restaurants');
            renderUsers(allUsers);
            renderRestaurants(allRestaurants);
        } catch {
            document.getElementById('loading').innerHTML =
                '<div class="text-center text-danger py-4"><i class="bi bi-wifi-off fs-1 d-block mb-2"></i>Lỗi kết nối</div>';
        }
    }

    // ─── USERS ─────────────────────────────────────────
    function filterUsers(q) {
        const filtered = q
            ? allUsers.filter(u => u.username.toLowerCase().includes(q.toLowerCase()) ||
                (u.email && u.email.toLowerCase().includes(q.toLowerCase())))
            : allUsers;
        renderUsers(filtered);
    }

    const ROLE_BADGES = {
        ROLE_CUSTOMER: '<span class="badge bg-primary-subtle text-primary border border-primary">Khách hàng</span>',
        ROLE_RESTAURANT: '<span class="badge bg-warning-subtle text-warning border border-warning">Nhà hàng</span>',
        ROLE_DRIVER: '<span class="badge bg-success-subtle text-success border border-success">Tài xế</span>',
        ROLE_ADMIN: '<span class="badge bg-danger-subtle text-danger border border-danger">Admin</span>'
    };

    function renderUsers(users) {
        const tbody = document.getElementById('userTableBody');
        if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Không có người dùng</td></tr>';
            return;
        }
        tbody.innerHTML = users.map(u => {
            const roleBadge = ROLE_BADGES[u.role] || `<span class="badge bg-secondary">${u.role || 'N/A'}</span>`;
            const statusBadge = u.enabled
                ? '<span class="badge bg-success-subtle text-success border border-success small">Hoạt động</span>'
                : '<span class="badge bg-danger-subtle text-danger border border-danger small">Đã khóa</span>';
            const toggleLabel = u.enabled ? 'Khóa TK' : 'Mở khóa';
            const toggleClass = u.enabled ? 'btn-outline-warning' : 'btn-outline-success';
            const isAdmin = u.role === 'ROLE_ADMIN';
            return `<tr>
                <td class="text-muted small">#${u.id}</td>
                <td class="fw-semibold">${u.username}</td>
                <td class="text-muted small">${u.email || '—'}</td>
                <td>${roleBadge}</td>
                <td>${statusBadge}</td>
                <td class="text-end">
                    ${!isAdmin ? `
                    <button class="btn btn-sm ${toggleClass} rounded-pill px-2 me-1" onclick="toggleUser(${u.id}, ${u.enabled}, '${u.username}')">${toggleLabel}</button>
                    <button class="btn btn-sm btn-outline-danger rounded-pill px-2" onclick="deleteUser(${u.id}, '${u.username}')"><i class="bi bi-trash3"></i></button>
                    ` : '<span class="text-muted small">—</span>'}
                </td>
            </tr>`;
        }).join('');
    }

    function toggleUser(id, currentEnabled, username) {
        confirmAction = async () => {
            try {
                const res = await fetch(`/api/admin/users/${id}/toggle-status`, {
                    method: 'PUT', headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) { showToast(`Đã ${currentEnabled ? 'khóa' : 'mở khóa'} tài khoản ${username}`, 'success'); loadAll(); }
                else showToast('Lỗi cập nhật!', 'danger');
            } catch { showToast('Lỗi kết nối!', 'danger'); }
        };
        document.getElementById('confirmTitle').textContent = currentEnabled ? 'Khóa tài khoản' : 'Mở khóa tài khoản';
        document.getElementById('confirmMsg').textContent = `${currentEnabled ? 'Khóa' : 'Mở khóa'} tài khoản "${username}"?`;
        document.getElementById('confirmBtn').className = `btn ${currentEnabled ? 'btn-warning' : 'btn-success'} btn-sm rounded-pill px-3`;
        document.getElementById('confirmBtn').textContent = 'Xác nhận';
        confirmModal.show();
    }

    function deleteUser(id, username) {
        confirmAction = async () => {
            try {
                const res = await fetch(`/api/admin/users/${id}`, {
                    method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) { showToast(`Đã xóa tài khoản ${username}`, 'success'); loadAll(); }
                else showToast('Không thể xóa!', 'danger');
            } catch { showToast('Lỗi kết nối!', 'danger'); }
        };
        document.getElementById('confirmTitle').textContent = 'Xóa tài khoản';
        document.getElementById('confirmMsg').textContent = `Xóa vĩnh viễn tài khoản "${username}"? Hành động này không thể hoàn tác!`;
        document.getElementById('confirmBtn').className = 'btn btn-danger btn-sm rounded-pill px-3';
        document.getElementById('confirmBtn').textContent = 'Xóa ngay';
        confirmModal.show();
    }

    // ─── RESTAURANTS ────────────────────────────────────
    function filterRestaurants(q) {
        applyRestFilters(q, restFilter);
    }
    function filterRestStatus(v) {
        restFilter = v;
        applyRestFilters(document.getElementById('restSearch').value, v);
    }
    function applyRestFilters(q, status) {
        let items = allRestaurants;
        if (q) items = items.filter(r => r.restaurantName.toLowerCase().includes(q.toLowerCase()));
        if (status === 'open') items = items.filter(r => r.open);
        else if (status === 'closed') items = items.filter(r => !r.open);
        renderRestaurants(items);
    }

    function renderRestaurants(restaurants) {
        const el = document.getElementById('restaurantCards');
        if (!restaurants.length) {
            el.innerHTML = '<div class="col-12 text-center text-muted py-4">Không có nhà hàng nào</div>';
            return;
        }
        el.innerHTML = restaurants.map(r => {
            const openBadge = r.open
                ? '<span class="badge bg-success-subtle text-success border border-success">Đang mở</span>'
                : '<span class="badge bg-danger-subtle text-danger border border-danger">Đóng cửa</span>';
            const img = r.bannerUrl || r.imageUrl || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300&h=100&fit=crop';
            const ownerEnabled = r.ownerEnabled !== false;

            return `<div class="col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm rest-card h-100 overflow-hidden">
                    <div class="position-relative" style="height:100px;overflow:hidden;">
                        <img src="${img}" class="w-100 h-100" style="object-fit:cover;"
                             onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300&h=100&fit=crop'">
                        <div class="position-absolute top-0 end-0 m-2">${openBadge}</div>
                    </div>
                    <div class="card-body p-3">
                        <h6 class="fw-bold mb-1 text-truncate">${r.restaurantName}</h6>
                        <p class="text-muted small mb-1 text-truncate"><i class="bi bi-geo-alt me-1"></i>${r.address || 'Chưa có địa chỉ'}</p>
                        <p class="text-muted small mb-2"><i class="bi bi-person me-1"></i>${r.ownerUsername || 'Chưa có chủ'}</p>
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <div class="d-flex gap-1">
                                ${!ownerEnabled ? `
                                <button class="btn btn-sm btn-success rounded-pill px-2 fw-semibold" onclick="approveRestaurant(${r.id}, '${r.restaurantName.replace(/'/g,"&#39;")}')">
                                    <i class="bi bi-check-lg me-1"></i>Duyệt
                                </button>` : ''}
                                <button class="btn btn-sm ${r.open ? 'btn-outline-warning' : 'btn-outline-success'} rounded-pill px-2"
                                        onclick="toggleRestaurant(${r.id}, ${r.open}, '${r.restaurantName.replace(/'/g,"&#39;")}')">
                                    ${r.open ? '<i class="bi bi-lock"></i>' : '<i class="bi bi-unlock"></i>'}
                                </button>
                            </div>
                            ${r.averageRating ? `<span class="text-warning small fw-semibold"><i class="bi bi-star-fill"></i> ${r.averageRating.toFixed(1)}</span>` : ''}
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    async function approveRestaurant(id, name) {
        if (!confirm(`Duyệt và kích hoạt nhà hàng "${name}"?`)) return;
        try {
            const res = await fetch(`/api/admin/restaurants/${id}/approve`, {
                method: 'PUT', headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) { showToast(`Đã duyệt nhà hàng ${name}`, 'success'); loadAll(); }
            else showToast('Lỗi duyệt nhà hàng!', 'danger');
        } catch { showToast('Lỗi kết nối!', 'danger'); }
    }

    async function toggleRestaurant(id, currentOpen, name) {
        if (!confirm(`${currentOpen ? 'Đóng cửa' : 'Mở cửa'} nhà hàng "${name}"?`)) return;
        try {
            const res = await fetch(`/api/admin/restaurants/${id}/toggle-open`, {
                method: 'PUT', headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) { showToast(`Đã ${currentOpen ? 'đóng' : 'mở'} nhà hàng ${name}`, 'success'); loadAll(); }
            else showToast('Lỗi cập nhật!', 'danger');
        } catch { showToast('Lỗi kết nối!', 'danger'); }
    }

    function showToast(msg, type) {
        const t = document.createElement('div');
        t.className = `position-fixed top-0 end-0 m-3 toast align-items-center text-bg-${type} border-0 show`;
        t.style.zIndex = 9999;
        t.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div></div>`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    loadAll();
</script>
</main>
</body>
</html>
