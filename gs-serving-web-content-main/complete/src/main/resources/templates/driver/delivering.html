<!DOCTYPE html>
<html th:replace="~{layouts/driver_mobile_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Đơn hàng hiện tại - Driver</title>
</head>
<body>
<main>
    <div class="mb-3 d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0">🛵 Chuyến giao hiện tại</h5>
        <button class="btn btn-sm btn-light border rounded-pill" onclick="loadActiveDeliveries()">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-success spinner-border-sm" role="status"></div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-5 d-none">
        <div style="font-size: 3.5rem">📦</div>
        <h6 class="fw-bold mt-2">Bạn không có đơn nào đang giao</h6>
        <p class="text-muted small">Hãy quay lại tab "Nhận đơn" để tìm chuyến mới.</p>
        <a href="/driver/new_orders" class="btn btn-primary rounded-pill px-4 mt-2">Nhận đơn mới</a>
    </div>

    <!-- Active Orders List -->
    <div id="activeOrders"></div>

    <script th:inline="javascript">
        const token = localStorage.getItem('jwt_token');

        async function loadActiveDeliveries() {
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('emptyState').classList.add('d-none');
            document.getElementById('activeOrders').innerHTML = '';

            try {
                const res = await fetch('/api/driver/my-deliveries', { 
                    headers: { 'Authorization': 'Bearer ' + token } 
                });
                if (!res.ok) throw new Error();
                const orders = await res.json();
                document.getElementById('loading').classList.add('d-none');

                if (!orders || orders.length === 0) {
                    document.getElementById('emptyState').classList.remove('d-none');
                    return;
                }

                renderActiveOrders(orders);
            } catch {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('activeOrders').innerHTML = '<div class="alert alert-danger">Lỗi kết nối</div>';
            }
        }

        function renderActiveOrders(orders) {
            const list = document.getElementById('activeOrders');
            list.innerHTML = orders.map(o => {
                return `
                <div class="active-delivery-container mb-4">
                    <!-- Step 1: Pickup -->
                    <div class="mobile-card shadow-sm border-start border-4 border-warning mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-warning bg-opacity-10 text-warning px-2 py-1">1. LẤY HÀNG</span>
                            <span class="small text-muted">Đơn #${o.id}</span>
                        </div>
                        <h6 class="fw-bold mb-1">${o.restaurantName}</h6>
                        <p class="small text-muted mb-3"><i class="bi bi-geo-alt me-1"></i>${o.restaurantAddress}</p>
                        
                        <div class="d-flex gap-2">
                            <a href="tel:${o.restaurantPhone || ''}" class="btn btn-sm btn-outline-warning flex-fill rounded-pill">
                                <i class="bi bi-telephone me-1"></i>Gọi quán
                            </a>
                            <button class="btn btn-sm btn-outline-primary flex-fill rounded-pill" onclick="openOrderChat(${o.id}, 'RESTAURANT', 'Nhà hàng')">
                                <i class="bi bi-chat-dots me-1"></i>Chat quán
                            </button>
                        </div>
                    </div>

                    <!-- Step 2: Dropoff -->
                    <div class="mobile-card shadow-sm border-start border-4 border-primary mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-primary bg-opacity-10 text-primary px-2 py-1">2. GIAO HÀNG</span>
                        </div>
                        <h6 class="fw-bold mb-1">${o.customerName}</h6>
                        <p class="small text-muted mb-2"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${o.deliveryAddress}</p>
                        <div class="bg-light rounded-3 p-2 mb-3 small">
                            <i class="bi bi-box-seam me-1 text-muted"></i>${o.items ? o.items.join(', ') : '—'}
                        </div>
                        
                        <div class="d-flex gap-2">
                            <a href="tel:${o.customerPhone || ''}" class="btn btn-sm btn-outline-primary flex-fill rounded-pill">
                                <i class="bi bi-telephone me-1"></i>Gọi khách
                            </a>
                            <button class="btn btn-sm btn-outline-primary flex-fill rounded-pill" onclick="openOrderChat(${o.id}, 'CUSTOMER', 'Khách hàng')">
                                <i class="bi bi-chat-dots me-1"></i>Chat khách
                            </button>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <button class="btn btn-success w-100 rounded-pill py-3 fw-bold shadow-lg mb-2" onclick="completeDelivery(${o.id})">
                        <i class="bi bi-check-circle-fill me-1"></i> XÁC NHẬN GIAO THÀNH CÔNG
                    </button>
                    <div class="text-center small text-muted">Xác nhận sau khi đã giao tận tay khách hàng</div>
                </div>
                <hr class="my-4 opacity-10">
                `;
            }).join('');

            // Subscription for chat notifications
            const ids = orders.map(o => o.id);
            if (typeof window._refreshDriverChatSubs === 'function') {
                window._refreshDriverChatSubs(ids);
            }
        }

        async function completeDelivery(id) {
            if (!confirm(`Xác nhận đã giao xong đơn hàng #${id}?`)) return;
            try {
                const res = await fetch(`/api/driver/orders/${id}/complete`, { 
                    method: 'PUT', 
                    headers: { 'Authorization': 'Bearer ' + token } 
                });
                if (res.ok) {
                    alert('Giao hàng thành công! Đã cộng thu nhập vào ví.');
                    loadActiveDeliveries();
                } else {
                    const d = await res.json();
                    alert(d.error || 'Lỗi cập nhật');
                }
            } catch { alert('Lỗi kết nối'); }
        }

        window.openOrderChat = function(orderId, targetRole, label) {
            if (typeof window.openShopeeChat === 'function') {
                window.openShopeeChat(orderId, targetRole, label);
            } else {
                alert("Chat Component chưa sẵn sàng");
            }
        };

        loadActiveDeliveries();
        setInterval(loadActiveDeliveries, 30000);
    </script>
    
    <div th:replace="~{fragments/chat_widget :: chatWidget}"></div>
    <script>window.MY_ROLE = 'DRIVER';</script>
</main>
</body>
</html>
