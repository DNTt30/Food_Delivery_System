<!DOCTYPE html>
<html th:replace="~{layouts/customer_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Customer - Giỏ hàng</title>
</head>
<body>
<main>
    <div class="container py-4" style="max-width: 900px;">
        <h3 class="fw-bold mb-4">Giỏ hàng của bạn</h3>
        
        <div class="row g-4">
            <!-- Danh sách món -->
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body p-0">
                        <!-- Món 1 -->
                        <div class="d-flex align-items-center p-3 border-bottom">
                            <img src="https://via.placeholder.com/80" class="rounded-3 me-3" style="width: 80px; height: 80px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="fw-bold mb-1">Cơm Sườn Ninh Kiều</h6>
                                <p class="text-muted small mb-0">Tùy chọn: Thêm trứng</p>
                            </div>
                            <div class="text-end ms-3">
                                <div class="fw-bold text-danger mb-2">40.000 đ</div>
                                <div class="input-group input-group-sm" style="width: 100px;">
                                    <button class="btn btn-outline-secondary">-</button>
                                    <input type="text" class="form-control text-center" value="1" readonly>
                                    <button class="btn btn-outline-secondary">+</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Món 2 -->
                        <div class="d-flex align-items-center p-3">
                            <img src="https://via.placeholder.com/80" class="rounded-3 me-3" style="width: 80px; height: 80px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <h6 class="fw-bold mb-1">Trà Sữa Trân Châu</h6>
                                <p class="text-muted small mb-0">Size L, Đá 50%, Đường 50%</p>
                            </div>
                            <div class="text-end ms-3">
                                <div class="fw-bold text-danger mb-2">35.000 đ</div>
                                <div class="input-group input-group-sm" style="width: 100px;">
                                    <button class="btn btn-outline-secondary">-</button>
                                    <input type="text" class="form-control text-center" value="2" readonly>
                                    <button class="btn btn-outline-secondary">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Hóa đơn -->
            <div class="col-md-4">
                <div class="card shadow-sm sticky-top" style="top: 80px;">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3 border-bottom pb-2">Tổng quan đơn hàng</h5>
                        
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Tổng tiền món</span>
                            <span>110.000 đ</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Phí giao hàng</span>
                            <span>15.000 đ</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                            <span class="text-muted">Khuyến mãi</span>
                            <span class="text-success">- 10.000 đ</span>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold fs-5">Thanh toán</span>
                            <span class="fw-bold fs-5 text-danger">115.000 đ</span>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Địa chỉ giao hàng</label>
                            <textarea class="form-control text-muted" rows="2" readonly>123 Đường Trần Phú, Quận Ninh Kiều, TP. Cần Thơ</textarea>
                            <a href="#" class="small text-danger text-decoration-none d-inline-block mt-1">Thay đổi</a>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Phương thức thanh toán</label>
                            <select class="form-select text-muted">
                                <option>Tiền mặt khi nhận hàng (COD)</option>
                                <option>Ví Momo</option>
                                <option>Thẻ ngân hàng</option>
                            </select>
                        </div>
                        
                        <button class="btn btn-danger w-100 py-2 fw-bold" onclick="alert('Tính năng đang phát triển!')">Đặt hàng ngay</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
