<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/customer_layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Theo dõi đơn hàng - Premium Delivery</title>
    <!-- Leaflet Core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" th:href="@{/css/map-premium.css}" />
</head>
<body>

    <main>
        <div class="container mt-5 mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <div class="card-header bg-white p-4 border-0">
                            <div class="d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center">
                                    <a href="/customer/orders" class="btn btn-outline-secondary btn-sm rounded-circle me-3">
                                        <i class="bi bi-arrow-left"></i>
                                    </a>
                                    <div>
                                        <h4 class="fw-bold mb-0">Theo dõi đơn hàng #<span th:text="${order.id}">000</span></h4>
                                        <span class="text-muted small">Nhà hàng: <span th:text="${order.restaurant.restaurantName}">The Coffee House</span></span>
                                    </div>
                                </div>
                                <div class="text-end">
                                    <span class="badge bg-primary rounded-pill px-3 py-2 mb-1" id="orderPhaseBadge" th:text="${order.status}">ĐANG GIAO</span>
                                    <div id="driverNameLabel" class="small fw-bold text-muted" th:text="${order.driver != null ? order.driver.user.fullName : 'Đang tìm tài xế...'}">Tài xế</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Progress Tracking Bar -->
                        <div class="px-5 pt-3 pb-5 bg-white border-bottom">
                            <div class="position-relative mt-4 mb-2">
                                <div class="progress" style="height: 4px;">
                                    <div class="progress-bar bg-primary" role="progressbar" 
                                         th:style="'width: ' + (${order.status.name() == 'PENDING'} ? '0%' : (${order.status.name() == 'PREPARING'} ? '33%' : (${order.status.name() == 'DELIVERING'} ? '66%' : '100%')))">
                                    </div>
                                </div>
                                <button type="button" class="position-absolute top-0 start-0 translate-middle btn btn-sm rounded-pill text-white shadow-sm" 
                                        th:classappend="${order.status.name() == 'PENDING' || order.status.name() == 'PREPARING' || order.status.name() == 'DELIVERING' || order.status.name() == 'COMPLETED'} ? 'btn-primary' : 'btn-secondary'"
                                        style="width: 2.5rem; height: 2.5rem; border: 2px solid white;">
                                    <i class="bi bi-clock-history"></i>
                                </button>
                                <div class="position-absolute top-100 start-0 translate-middle mt-2 small fw-bold"
                                     th:classappend="${order.status.name() == 'PENDING'} ? 'text-primary' : 'text-muted'" style="white-space: nowrap;">Chờ xác nhận</div>
                                
                                <button type="button" class="position-absolute top-0 translate-middle btn btn-sm rounded-pill text-white shadow-sm" 
                                        th:classappend="${order.status.name() == 'PREPARING' || order.status.name() == 'DELIVERING' || order.status.name() == 'COMPLETED'} ? 'btn-primary' : 'bg-light text-muted'"
                                        style="width: 2.5rem; height: 2.5rem; border: 2px solid white; left: 33%;">
                                    <i class="bi bi-shop"></i>
                                </button>
                                <div class="position-absolute top-100 translate-middle mt-2 small fw-bold"
                                     th:classappend="${order.status.name() == 'PREPARING'} ? 'text-primary' : 'text-muted'" style="left: 33%; white-space: nowrap;">Chuẩn bị</div>

                                <button type="button" class="position-absolute top-0 translate-middle btn btn-sm rounded-pill text-white shadow-sm" 
                                        th:classappend="${order.status.name() == 'DELIVERING' || order.status.name() == 'COMPLETED'} ? 'btn-primary' : 'bg-light text-muted'"
                                        style="width: 2.5rem; height: 2.5rem; border: 2px solid white; left: 66%;">
                                    <i class="bi bi-bicycle"></i>
                                </button>
                                <div class="position-absolute top-100 translate-middle mt-2 small fw-bold"
                                     th:classappend="${order.status.name() == 'DELIVERING'} ? 'text-primary' : 'text-muted'" style="left: 66%; white-space: nowrap;">Đang giao</div>

                                <button type="button" class="position-absolute top-0 start-100 translate-middle btn btn-sm rounded-pill text-white shadow-sm" 
                                        th:classappend="${order.status.name() == 'COMPLETED'} ? 'btn-success' : 'bg-light text-muted'"
                                        style="width: 2.5rem; height: 2.5rem; border: 2px solid white;">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                                <div class="position-absolute top-100 start-100 translate-middle mt-2 small fw-bold"
                                     th:classappend="${order.status.name() == 'COMPLETED'} ? 'text-success' : 'text-muted'" style="white-space: nowrap;">Hoàn tất</div>
                            </div>
                        </div>
                        
                        <div class="card-body p-0 position-relative">
                            <div id="map-container" style="height: 550px;">
                                <div id="tracking-map" style="width: 100%; height: 100%;">
                                    <div class="d-flex h-100 align-items-center justify-content-center bg-light text-muted">
                                        <div class="text-center">
                                            <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
                                            <p class="small mb-0">Đang khởi tạo bản đồ...</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <button class="btn btn-white rounded-circle shadow position-absolute top-0 end-0 m-3" 
                                        style="z-index: 1000; width: 45px; height: 45px; border: 1px solid #ddd;" 
                                        onclick="MapTracker.focusOnDriver()" title="Định vị tài xế">
                                    <i class="bi bi-crosshair text-primary"></i>
                                </button>

                                <div class="map-overlay-card d-flex align-items-center justify-content-between">
                                    <div>
                                        <div class="text-muted small">Thời gian dự kiến</div>
                                        <h5 class="fw-bold mb-0 text-primary" id="etaLabel" 
                                            th:text="${order.estimatedTimeOfArrival != null ? #temporals.format(order.estimatedTimeOfArrival, 'HH:mm') : '--:--'}">--:--</h5>
                                    </div>
                                    <div class="vr mx-3"></div>
                                    <div>
                                        <div class="text-muted small">Khoảng cách</div>
                                        <h5 class="fw-bold mb-0" th:text="${order.distance != null ? #numbers.formatDecimal(order.distance, 1, 2) + ' km' : '--'}">0 km</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts bản đồ -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <script th:src="@{/js/map-tracking.js?v=2}"></script>
        <script th:src="@{/js/websocket-manager.js?v=2}"></script>
        <script th:src="@{/js/tracking-service.js?v=2}"></script>

        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function() {
                // Chỉ lấy các giá trị số đơn giản, không lấy cả đối tượng Order phức tạp
                const orderId = /*[[${order.id}]]*/ 0;
                let rLat = parseFloat(/*[[${order.restaurantLat}]]*/);
                let rLng = parseFloat(/*[[${order.restaurantLng}]]*/);
                let cLat = parseFloat(/*[[${order.deliveryLat}]]*/);
                let cLng = parseFloat(/*[[${order.deliveryLng}]]*/);
                
                const mapId = 'tracking-map';
                const container = document.getElementById(mapId);

                // Fallback nếu thiếu tọa độ
                if (isNaN(rLat)) {
                    console.warn("⚠️ Thiếu tọa độ nhà hàng. Dùng tọa độ dự phòng.");
                    rLat = 10.772500; rLng = 106.669500; // The Coffee House Sư Vạn Hạnh
                }
                if (isNaN(cLat)) {
                    console.warn("⚠️ Thiếu tọa độ khách hàng. Dùng tọa độ dự phòng.");
                    // Default fallback near the restaurant
                    cLat = rLat - 0.01; cLng = rLng + 0.01;
                }

                try {
                    if (typeof MapTracker === 'undefined') throw new Error("MapTracker not found");

                    // Khởi tạo Map
                    MapTracker.init(mapId, (rLat + cLat)/2, (rLng + cLng)/2);
                    MapTracker.initCustomerMap(rLat, rLng, cLat, cLng);

                    window.ORDER_COORDS = { rLat, rLng, cLat, cLng };
                    window.ORDER_ID = orderId;

                    const token = localStorage.getItem('jwt_token');
                    if (window.ORDER_ID && token) {
                        TrackingService.init(window.ORDER_ID, token);
                    }
                } catch (e) {
                    console.error("Map error:", e);
                    container.innerHTML = '<div class="p-4 text-center text-danger">Lỗi nạp bản đồ. Vui lòng F5.</div>';
                }
            });
        </script>
    </main>

</body>
</html>
