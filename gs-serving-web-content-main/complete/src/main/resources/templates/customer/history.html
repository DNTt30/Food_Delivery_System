<!DOCTYPE html>
<html th:replace="~{layouts/customer_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Lịch sử đơn hàng - Food Delivery</title>
</head>
<body>
<main>

<div class="container mb-5" style="max-width: 800px;">

    <div class="row align-items-center mb-4 gap-3 gap-md-0">
        <div class="col-md-6 d-flex align-items-center">
            <h4 class="fw-bold mb-0"><i class="bi bi-clock-history text-danger me-2"></i>Lịch sử đơn hàng</h4>
        </div>
        <div class="col-md-6">
            <div class="input-group rounded-pill overflow-hidden border">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="searchOrderInput" class="form-control border-0 shadow-none" placeholder="Tìm tên nhà hàng, món ăn..." oninput="onSearchInput()">
            </div>
        </div>
    </div>

    <!-- Filter tabs -->
    <div class="d-flex gap-2 mb-4 overflow-auto">
        <button class="btn btn-dark btn-sm rounded-pill px-3 tab-btn active" data-status="ALL" onclick="switchTab('orders','ALL', this)">Tất cả</button>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="PROCESSING" onclick="switchTab('orders','PROCESSING', this)">Đang xử lý</button>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="COMPLETED" onclick="switchTab('orders','COMPLETED', this)">Hoàn thành</button>
        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="CANCELLED" onclick="switchTab('orders','CANCELLED', this)">Đã hủy</button>
        <button class="btn btn-outline-warning btn-sm rounded-pill px-3 tab-btn flex-shrink-0" data-status="MY_REVIEWS" onclick="switchTab('myreviews','MY_REVIEWS', this)">
            <i class="bi bi-star-fill me-1 text-warning"></i>Đánh giá của tôi
        </button>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-danger"></div>
        <p class="text-muted mt-2">Đang tải đơn hàng...</p>
    </div>

    <!-- Orders List -->
    <div id="orderList" class="d-none"></div>

    <!-- Empty -->
    <div id="emptyState" class="text-center py-5 d-none">
        <div style="font-size:4rem">📦</div>
        <h5 class="fw-bold mt-2">Chưa có đơn hàng nào</h5>
        <p class="text-muted">Hãy đặt món ngay hôm nay!</p>
        <a href="/customer/home" class="btn btn-danger rounded-pill px-4 mt-2">Đặt món ngay</a>
    </div>

    <!-- ④ My Reviews Panel -->
    <div id="myReviewsPanel" class="d-none">
        <div id="myReviewsLoading" class="text-center py-5">
            <div class="spinner-border text-warning"></div>
            <p class="text-muted mt-2">Đang tải đánh giá...</p>
        </div>
        <div id="myReviewsList"></div>
        <div id="myReviewsEmpty" class="text-center py-5 d-none">
            <div style="font-size:3.5rem">⭐</div>
            <h5 class="fw-bold mt-2">Bạn chưa có đánh giá nào</h5>
            <p class="text-muted">Hãy đặt món và chia sẻ trải nghiệm của bạn!</p>
        </div>
    </div>
</div>

<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold"><i class="bi bi-star-fill text-warning me-2"></i>Đánh giá đơn hàng</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="reviewOrderId">
                <p class="text-muted small mb-3" id="reviewRestaurantName"></p>
                <div class="mb-3">
                    <label class="fw-semibold mb-2 d-block">Chất lượng món ăn & dịch vụ</label>
                    <div class="d-flex gap-2" id="starRating">
                        <i class="bi bi-star fs-2 text-warning star" data-val="1" onclick="selectStar(1)" style="cursor:pointer;"></i>
                        <i class="bi bi-star fs-2 text-warning star" data-val="2" onclick="selectStar(2)" style="cursor:pointer;"></i>
                        <i class="bi bi-star fs-2 text-warning star" data-val="3" onclick="selectStar(3)" style="cursor:pointer;"></i>
                        <i class="bi bi-star fs-2 text-warning star" data-val="4" onclick="selectStar(4)" style="cursor:pointer;"></i>
                        <i class="bi bi-star fs-2 text-warning star" data-val="5" onclick="selectStar(5)" style="cursor:pointer;"></i>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="fw-semibold mb-2">Nhận xét của bạn</label>
                    <textarea id="reviewComment" class="form-control" rows="3" placeholder="Chia sẻ trải nghiệm của bạn..."></textarea>
                </div>
                <hr id="foodReviewsDivider">
                <div class="mb-3" id="foodReviewsSection">
                    <label class="fw-semibold mb-2 d-block">Đánh giá món ăn trong đơn</label>
                    <div id="foodReviewsList" class="d-flex flex-column gap-3">
                        <!-- Dynamic list of items -->
                    </div>
                </div>
                <div class="mb-3">
                    <label class="fw-semibold mb-2">Hình ảnh đính kèm (Tùy chọn)</label>
                    <input type="file" id="reviewImageFile" accept="image/*" class="form-control">
                    <div id="imageUploadProgress" class="text-muted mt-1" style="font-size: 0.85rem"></div>
                    <div id="imagePreviewContainer" class="mt-2 text-center d-none">
                        <img id="imagePreview" src="" alt="Thumbnail preview" class="img-thumbnail" style="max-height: 120px; width: auto;">
                        <input type="hidden" id="reviewImageUrlVal" value="">
                    </div>
                </div>
                <div id="reviewAlert" class="alert d-none"></div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button class="btn btn-warning fw-bold w-100 py-2 rounded-pill" onclick="submitReview()" id="btnSubmitReview">
                    <i class="bi bi-send me-2"></i>Gửi đánh giá
                </button>
            </div>
        </div>
    </div>
</div>


<style>
.tab-btn.active { background: #212529 !important; color: white !important; border-color: #212529 !important; }
.order-card { transition: box-shadow 0.2s; }
.order-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1) !important; }
.status-PENDING { background: #fff8e1; color: #d97706; border-left: 4px solid #f59e0b; }
.status-PREPARING { background: #eff6ff; color: #1d4ed8; border-left: 4px solid #3b82f6; }
.status-DELIVERING { background: #f0fdf4; color: #15803d; border-left: 4px solid #22c55e; }
.status-COMPLETED { background: #f0fdf4; color: #15803d; border-left: 4px solid #16a34a; }
.status-CANCELLED { background: #fef2f2; color: #dc2626; border-left: 4px solid #ef4444; }
</style>

<script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/common/auth';

    let allOrders = [];
    let selectedRating = 0;
    let reviewModalInstance = null;

    const STATUS_LABELS = {
        PENDING: '⏳ Chờ xác nhận',
        PREPARING: '🍳 Đang chuẩn bị',
        DELIVERING: '🛵 Đang giao hàng',
        COMPLETED: '✅ Hoàn thành',
        CANCELLED: '❌ Đã hủy'
    };

    function formatVND(n) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n || 0); }
    function formatDate(dt) {
        if (!dt) return '';
        const d = new Date(dt);
        return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        reviewModalInstance = new bootstrap.Modal(document.getElementById('reviewModal'));
        loadOrders();
    });

    let currentStatusFilter = 'ALL';
    let searchQuery = '';

    async function loadOrders() {
        try {
            const res = await fetch('/api/customer/orders', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.status === 401) { window.location.href = '/common/auth'; return; }
            allOrders = await res.json();
            document.getElementById('loading').classList.add('d-none');
            applyFilters();
        } catch {
            document.getElementById('loading').innerHTML = '<div class="text-center text-danger"><i class="bi bi-wifi-off fs-1 d-block mb-2"></i>Lỗi kết nối</div>';
        }
    }

    // ── Tab routing (orders vs my-reviews) ──
    let currentTab = 'orders';

    function switchTab(tab, status, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        currentTab = tab;

        const ordersLoading = document.getElementById('loading');
        const ordersPanel = document.getElementById('orderList');
        const emptyState = document.getElementById('emptyState');
        const reviewsPanel = document.getElementById('myReviewsPanel');

        if (tab === 'myreviews') {
            ordersLoading.classList.add('d-none');
            ordersPanel.classList.add('d-none');
            emptyState.classList.add('d-none');
            reviewsPanel.classList.remove('d-none');
            loadMyReviews();
        } else {
            reviewsPanel.classList.add('d-none');
            filterOrders(status, null);
        }
    }

    function filterOrders(status, btn) {
        if (btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        currentStatusFilter = status;
        applyFilters();
    }

    function onSearchInput() {
        searchQuery = document.getElementById('searchOrderInput').value.toLowerCase().trim();
        applyFilters();
    }

    function applyFilters() {
        let filtered = allOrders;
        if (currentStatusFilter === 'PROCESSING') {
            filtered = allOrders.filter(o => ['PENDING', 'PREPARING', 'DELIVERING'].includes(o.status));
        } else if (currentStatusFilter !== 'ALL') {
            filtered = allOrders.filter(o => o.status === currentStatusFilter);
        }
        
        if (searchQuery) {
            filtered = filtered.filter(o => {
                const restaurantName = o.restaurantName ? o.restaurantName.toLowerCase() : '';
                const itemsText = o.items ? o.items.map(i => i.itemName.toLowerCase()).join(' ') : '';
                return restaurantName.includes(searchQuery) || itemsText.includes(searchQuery);
            });
        }
        
        renderOrders(filtered);
    }

    function renderOrders(orders) {
        const el = document.getElementById('orderList');
        const empty = document.getElementById('emptyState');
        if (!orders.length) {
            el.classList.add('d-none');
            empty.classList.remove('d-none');
            return;
        }
        empty.classList.add('d-none');
        el.classList.remove('d-none');
        el.innerHTML = '';

        orders.forEach(o => {
            const itemSummary = (o.items || []).map(i => `${i.itemName} ×${i.quantity}`).join(', ');
            const isActive = ['PENDING', 'PREPARING', 'DELIVERING'].includes(o.status);
            const isCompleted = o.status === 'COMPLETED';
            const isPending = o.status === 'PENDING';
            const img = o.restaurantImage || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=80&h=80&fit=crop';

            el.insertAdjacentHTML('beforeend', `
            <div class="card border-0 shadow-sm rounded-4 mb-3 order-card overflow-hidden">
                <div class="card-body p-4">
                    <div class="d-flex gap-3 align-items-start">
                        <img src="${img}" class="rounded-3 flex-shrink-0" style="width:64px;height:64px;object-fit:cover;"
                             onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=80&h=80&fit=crop'">
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                <div>
                                    <h6 class="fw-bold mb-0">${o.restaurantName}</h6>
                                    <small class="text-muted">Đơn #${o.id} • ${formatDate(o.orderTime)}</small>
                                </div>
                                <span class="badge rounded-pill px-3 py-2 status-${o.status} fw-semibold"
                                      style="font-size:0.78rem;">${STATUS_LABELS[o.status] || o.status}</span>
                            </div>
                            <p class="text-muted small mt-2 mb-2" style="display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;">${itemSummary || 'Không có món'}</p>
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

    <div>
        <div class="fw-bold text-danger">${formatVND(o.totalAmount)}</div>

        <small class="text-muted d-block mt-1">
            ${(o.paymentMethod === 'COD' || o.paymentMethod === 'CASH' || o.paymentMethod === 'CASH_ON_DELIVERY')
                ? '💵 Tiền mặt (COD) - Thanh toán khi nhận hàng'
                : o.paymentMethod === 'VNPAY'
                    ? '🏦 VNPAY QR - Thanh toán online'
                    : (o.paymentMethod === 'MOMO' || o.paymentMethod === 'MOMO_E_WALLET')
                        ? '🟣 MoMo QR - Thanh toán online'
                        : o.paymentMethod
                            ? '📱 Ví điện tử - ' + o.paymentMethod
                            : '❓ Chưa xác định'}
        </small>
    </div>

    <div class="d-flex gap-2">
                                    ${isActive ? `<a href="/customer/tracking?orderId=${o.id}" class="btn btn-sm btn-primary rounded-pill px-3 fw-semibold">Theo dõi</a>` : ''}
                                    ${isPending ? `<button class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-semibold" onclick="cancelOrder(${o.id})">Hủy đơn</button>` : ''}
                                    ${isCompleted ? (o.isReviewed ? 
                                        `<div class="text-end">
                                            <span class="badge bg-light text-dark border rounded-pill px-3 py-2 fw-bold" 
                                                  style="font-size: 0.8rem; cursor: pointer;" 
                                                  onclick="viewReview(${o.id})"
                                                  title="Bấm để xem lại nhận xét">
                                                <i class="bi bi-star-fill text-warning me-1"></i>${o.reviewRating}.0
                                            </span>
                                         </div>` : 
                                        `<button class="btn btn-sm btn-warning rounded-pill px-3 fw-semibold" onclick="openReview(${o.id}, '${o.restaurantName.replace(/'/g,"&#39;")}')">
                                            <i class="bi bi-star me-1"></i>Đánh giá
                                         </button>`
                                    ) : ''}
                                    ${!isActive ? `<button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-semibold" onclick="reorder(${o.id})"><i class="bi bi-arrow-repeat me-1"></i>Đặt lại</button>` : ''}
                                    <button class="btn btn-sm btn-outline-primary rounded-pill px-2 fw-semibold"
                                            title="Chat với nhà hàng"
                                            onclick="openChatHistory(${o.id},'RESTAURANT','Nhà hàng')">
                                        <i class="bi bi-chat-dots"></i> NH
                                    </button>
                                    ${(o.status==='DELIVERING'||o.status==='COMPLETED') ? `
                                    <button class="btn btn-sm btn-outline-success rounded-pill px-2 fw-semibold"
                                            title="Chat với tài xế"
                                            onclick="openChatHistory(${o.id},'DRIVER','Tài xế')">
                                        <i class="bi bi-chat-dots"></i> TX
                                    </button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`);
        });
    }

    async function cancelOrder(orderId) {
        if (!confirm('Hủy đơn hàng này?')) return;
        try {
            const res = await fetch(`/api/customer/orders/${orderId}/cancel`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            if (res.ok) { alert('Đã hủy đơn!'); loadOrders(); }
            else alert(data.error || 'Không thể hủy');
        } catch { alert('Lỗi kết nối!'); }
    }

    function openReview(orderId, restaurantName) {
        const order = allOrders.find(o => o.id === orderId);
        if (!order) return;

        document.getElementById('reviewOrderId').value = orderId;
        document.getElementById('reviewRestaurantName').textContent = restaurantName;
        document.querySelector('#reviewModal .modal-title').innerHTML = '<i class="bi bi-star-fill text-warning me-2"></i>Đánh giá đơn hàng';
        document.getElementById('reviewComment').value = '';
        document.getElementById('reviewComment').readOnly = false;
        document.getElementById('btnSubmitReview').classList.remove('d-none');
        document.getElementById('reviewAlert').className = 'alert d-none';
        
        // Reset image
        document.getElementById('reviewImageFile').value = '';
        document.getElementById('imageUploadProgress').innerHTML = '';
        document.getElementById('imagePreviewContainer').classList.add('d-none');
        document.getElementById('reviewImageUrlVal').value = '';
        
        selectedRating = 0;
        selectStar(0);
        
        // Kích hoạt lại sự kiện click cho sao
        document.querySelectorAll('.star').forEach(s => s.style.pointerEvents = 'auto');
        
        // Render food reviews section
        const foodSection = document.getElementById('foodReviewsSection');
        const foodList = document.getElementById('foodReviewsList');
        foodSection.classList.remove('d-none');
        foodList.innerHTML = '';

        if (order.items && order.items.length > 0) {
            order.items.forEach(item => {
                if (!item.menuItemId) return; // Skip if no ID
                const row = `
                <div class="food-item-review-row border rounded-3 p-3 bg-light" data-item-id="${item.menuItemId}">
                    <div class="fw-bold mb-1" style="font-size: 0.95rem;"><i class="bi bi-egg-fried me-1 text-danger"></i>${item.itemName}</div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <div class="d-flex gap-2 item-star-rating" data-item-id="${item.menuItemId}" data-val="0">
                            <i class="bi bi-star fs-3 text-warning item-star" data-val="1" onclick="selectItemStar(${item.menuItemId}, 1)" style="cursor:pointer;"></i>
                            <i class="bi bi-star fs-3 text-warning item-star" data-val="2" onclick="selectItemStar(${item.menuItemId}, 2)" style="cursor:pointer;"></i>
                            <i class="bi bi-star fs-3 text-warning item-star" data-val="3" onclick="selectItemStar(${item.menuItemId}, 3)" style="cursor:pointer;"></i>
                            <i class="bi bi-star fs-3 text-warning item-star" data-val="4" onclick="selectItemStar(${item.menuItemId}, 4)" style="cursor:pointer;"></i>
                            <i class="bi bi-star fs-3 text-warning item-star" data-val="5" onclick="selectItemStar(${item.menuItemId}, 5)" style="cursor:pointer;"></i>
                        </div>
                        <span class="badge bg-light text-dark border item-rating-level d-none" id="level-label-${item.menuItemId}" style="font-size: 0.75rem;"></span>
                    </div>
                    <input type="text" class="form-control form-control-sm item-comment" placeholder="Nhận xét món ăn này... (Tùy chọn)">
                </div>`;
                foodList.insertAdjacentHTML('beforeend', row);
            });
        } else {
            foodSection.classList.add('d-none');
        }

        reviewModalInstance.show();
    }

    async function viewReview(orderId) {
        const order = allOrders.find(o => o.id === orderId);
        if (!order || !order.isReviewed) return;

        document.getElementById('reviewRestaurantName').textContent = order.restaurantName;
        document.querySelector('#reviewModal .modal-title').innerHTML = '<i class="bi bi-eye-fill text-primary me-2"></i>Xem lại đánh giá';
        document.getElementById('reviewComment').value = order.reviewComment || 'Không có nhận xét';
        document.getElementById('reviewComment').readOnly = true;
        document.getElementById('btnSubmitReview').classList.add('d-none');
        document.getElementById('reviewAlert').className = 'alert d-none';
        
        selectStar(order.reviewRating);
        
        // Vô hiệu hóa sự kiện click cho sao khi ở chế độ xem
        document.querySelectorAll('.star').forEach(s => s.style.pointerEvents = 'none');
        
        // Reset image preview in view mode
        document.getElementById('reviewImageFile').value = '';
        document.getElementById('imageUploadProgress').innerHTML = '';
        document.getElementById('imagePreviewContainer').classList.add('d-none');
        
        // Render food reviews section in read-only mode
        const foodSection = document.getElementById('foodReviewsSection');
        const foodList = document.getElementById('foodReviewsList');
        foodSection.classList.remove('d-none');
        foodList.innerHTML = '<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-warning" role="status"></div> Đang tải đánh giá món ăn...</div>';

        reviewModalInstance.show();

        if (order.items && order.items.length > 0) {
            let html = '';
            for (const item of order.items) {
                if (!item.menuItemId) continue;
                let rating = 0;
                let comment = '';
                try {
                    const res = await fetch(`/api/customer/menu-items/${item.menuItemId}/reviews`, {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const reviews = await res.json();
                        // Find the review by current user (username)
                        const myUser = localStorage.getItem('username');
                        const myReview = reviews.find(r => r.customerName === myUser);
                        if (myReview) {
                            rating = myReview.rating;
                            comment = myReview.comment || '';
                        }
                    }
                } catch (e) {
                    console.error("Lỗi khi tải đánh giá món ăn:", e);
                }

                const starsHtml = Array(5).fill(0).map((_, i) => {
                    const val = i + 1;
                    return val <= rating
                        ? `<i class="bi bi-star-fill fs-3 text-warning item-star" data-val="${val}"></i>`
                        : `<i class="bi bi-star fs-3 text-warning item-star" data-val="${val}"></i>`;
                }).join(' ');

                // Ánh xạ số sao sang nhãn mức độ đánh giá tĩnh
                let ratingLevelText = '';
                if (rating === 5) ratingLevelText = 'Rất ngon';
                else if (rating === 4) ratingLevelText = 'Ngon';
                else if (rating === 3) ratingLevelText = 'Tạm được';
                else if (rating === 2) ratingLevelText = 'Tệ';
                else if (rating === 1) ratingLevelText = 'Rất tệ';

                html += `
                <div class="food-item-review-row border rounded-3 p-3 bg-light" data-item-id="${item.menuItemId}">
                    <div class="fw-bold mb-1" style="font-size: 0.95rem;"><i class="bi bi-egg-fried me-1 text-danger"></i>${item.itemName}</div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <div class="d-flex gap-2 item-star-rating" data-item-id="${item.menuItemId}" data-val="${rating}" style="pointer-events: none;">
                            ${starsHtml}
                        </div>
                        ${ratingLevelText ? `<span class="badge bg-light text-dark border" style="font-size: 0.75rem;">${ratingLevelText}</span>` : ''}
                    </div>
                    <input type="text" class="form-control form-control-sm item-comment" value="${comment || 'Không có nhận xét'}" disabled readonly>
                </div>`;
            }
            foodList.innerHTML = html;
        } else {
            foodSection.classList.add('d-none');
        }
    }

    function selectStar(val) {
        selectedRating = val;
        document.querySelectorAll('.star').forEach(s => {
            const v = parseInt(s.dataset.val);
            s.className = v <= val ? 'bi bi-star-fill fs-2 text-warning star' : 'bi bi-star fs-2 text-warning star';
        });
    }

    function selectItemStar(itemId, val) {
        const container = document.querySelector(`.item-star-rating[data-item-id="${itemId}"]`);
        if (!container || container.style.pointerEvents === 'none') return;
        container.dataset.val = val;
        container.querySelectorAll('.item-star').forEach(s => {
            const v = parseInt(s.dataset.val);
            s.className = v <= val ? 'bi bi-star-fill fs-3 text-warning item-star' : 'bi bi-star fs-3 text-warning item-star';
        });

        // Cập nhật nhãn mức độ đánh giá động
        const levels = {
            1: 'Rất tệ',
            2: 'Tệ',
            3: 'Tạm được',
            4: 'Ngon',
            5: 'Rất ngon'
        };
        const labelEl = document.getElementById(`level-label-${itemId}`);
        if (labelEl) {
            if (val > 0) {
                labelEl.textContent = levels[val];
                labelEl.classList.remove('d-none');
            } else {
                labelEl.classList.add('d-none');
            }
        }
    }

    document.getElementById('reviewImageFile').addEventListener('change', async function() {
        const fileInput = this;
        if (fileInput.files.length === 0) return;

        const progressDiv = document.getElementById('imageUploadProgress');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('imagePreview');
        const hiddenUrlInput = document.getElementById('reviewImageUrlVal');

        progressDiv.innerHTML = "⏳ Đang tải ảnh của bạn lên máy chủ...";
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const res = await fetch('/api/upload/image', { 
                method: 'POST', 
                headers: { 'Authorization': 'Bearer ' + token }, 
                body: formData 
            });

            if (res.ok) {
                const data = await res.json();
                hiddenUrlInput.value = data.url;
                previewImg.src = data.url;
                previewContainer.classList.remove('d-none');
                progressDiv.innerHTML = "<span class='text-success'>✅ Tải ảnh thành công!</span>";
            } else {
                progressDiv.innerHTML = "<span class='text-danger'>❌ Lỗi khi tải lên. Vui lòng chọn ảnh khác!</span>";
            }
        } catch (err) {
            progressDiv.innerHTML = "<span class='text-danger'>❌ Không thể kết nối máy chủ.</span>";
        }
    });

    async function submitReview() {
        if (!selectedRating) { alert('Vui lòng chọn số sao!'); return; }
        const orderId = document.getElementById('reviewOrderId').value;
        const imageUrl = document.getElementById('reviewImageUrlVal').value;
        const btn = document.getElementById('btnSubmitReview');
        btn.disabled = true;
        try {
            const res = await fetch(`/api/customer/orders/${orderId}/review`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ rating: selectedRating, comment: document.getElementById('reviewComment').value, imageUrl: imageUrl })
            });
            const data = await res.json();
            const alertEl = document.getElementById('reviewAlert');
            if (res.ok) {
                // Submit food reviews
                const rows = document.querySelectorAll('.food-item-review-row');
                const foodPromises = [];
                rows.forEach(row => {
                    const itemId = row.dataset.itemId;
                    const ratingContainer = row.querySelector('.item-star-rating');
                    const ratingVal = parseInt(ratingContainer.dataset.val || '0');
                    const commentVal = row.querySelector('.item-comment').value.trim();
                    
                    if (ratingVal > 0) {
                        foodPromises.push(
                            fetch(`/api/customer/menu-items/${itemId}/reviews`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                body: JSON.stringify({ rating: ratingVal, comment: commentVal })
                            })
                        );
                    }
                });

                if (foodPromises.length > 0) {
                    await Promise.all(foodPromises);
                }

                alertEl.className = 'alert alert-success';
                alertEl.textContent = '✅ Cảm ơn bạn đã đánh giá!';
                setTimeout(() => { reviewModalInstance.hide(); loadOrders(); }, 1500);
            } else {
                alertEl.className = 'alert alert-danger';
                alertEl.textContent = data.error || 'Gửi đánh giá thất bại';
            }
        } catch (e) {
            console.error("Lỗi khi gửi đánh giá:", e);
            alert('Lỗi kết nối!');
        }
        finally { btn.disabled = false; }
    }

    function reorder(orderId) {
        const order = allOrders.find(o => o.id === orderId);
        if (order) alert('Tính năng đặt lại sẽ sớm được ra mắt!');
    }

    // ④ Load My Reviews
    async function loadMyReviews() {
        const loading = document.getElementById('myReviewsLoading');
        const list = document.getElementById('myReviewsList');
        const empty = document.getElementById('myReviewsEmpty');
        loading.classList.remove('d-none');
        list.innerHTML = '';
        empty.classList.add('d-none');
        try {
            const res = await fetch('/api/customer/my-reviews', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) throw new Error();
            const reviews = await res.json();
            loading.classList.add('d-none');
            if (!reviews.length) {
                empty.classList.remove('d-none');
                return;
            }
            const stars = n => '⭐'.repeat(Math.max(0, Math.min(5, n)));
            list.innerHTML = reviews.map(r => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 overflow-hidden">
                <div class="card-body p-4">
                    <div class="d-flex gap-3 align-items-start">
                        <img src="${r.restaurantImage || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=80&h=80&fit=crop'}"
                             class="rounded-3 flex-shrink-0" style="width:60px;height:60px;object-fit:cover;"
                             onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=80&h=80&fit=crop'">
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                <div>
                                    <h6 class="fw-bold mb-0">${r.restaurantName}</h6>
                                    <small class="text-muted">Đơn #${r.orderId} • ${r.createdAt ? new Date(r.createdAt).toLocaleDateString('vi-VN') : ''}</small>
                                </div>
                                <span class="text-warning fw-semibold">${stars(r.rating)} <span class="text-muted small">(${r.rating} sao)</span></span>
                            </div>
                            <p class="mt-2 mb-1 text-dark">${r.comment || '<em class="text-muted">Không có nhận xét</em>'}</p>
                            ${r.restaurantReply ? `
                            <div class="bg-light rounded-3 px-3 py-2 mt-2 border-start border-3 border-success">
                                <small class="text-success fw-semibold">💬 Phản hồi từ nhà hàng:</small>
                                <p class="mb-0 small mt-1">${r.restaurantReply}</p>
                            </div>` : ''}
                            <div class="d-flex align-items-center justify-content-between mt-2">
                                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" id="btnHelpful-${r.id}" onclick="voteHelpful(${r.id})">
                                    <i class="bi bi-hand-thumbs-up me-1"></i>Hữu ích
                                    <span class="badge bg-secondary ms-1" id="helpfulCount-${r.id}">${r.helpfulCount || 0}</span>
                                </button>
                                ${r.imageUrl ? `<img src="${r.imageUrl}" class="rounded-3" style="height:50px;width:70px;object-fit:cover;">` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            </div>`).join('');
        } catch {
            loading.innerHTML = '<div class="text-center text-danger py-4"><i class="bi bi-wifi-off fs-1 d-block mb-2"></i>Lỗi tải đánh giá</div>';
        }
    }

    // ① Vote hữu ích
    async function voteHelpful(reviewId) {
        const btn = document.getElementById('btnHelpful-' + reviewId);
        if (btn) btn.disabled = true;
        try {
            const res = await fetch(`/api/customer/reviews/${reviewId}/helpful`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                const data = await res.json();
                const countEl = document.getElementById('helpfulCount-' + reviewId);
                if (countEl) countEl.textContent = data.helpfulCount;
                if (btn) {
                    btn.classList.remove('btn-outline-secondary');
                    btn.classList.add('btn-secondary');
                    btn.innerHTML = '<i class="bi bi-hand-thumbs-up-fill me-1"></i>Đã đánh dấu <span class="badge bg-light text-dark ms-1">' + data.helpfulCount + '</span>';
                }
            }
        } catch { if (btn) btn.disabled = false; }
    }

    // ── Chat: Polling Chat System ──────────────────────────────
    // Delegate to ShopeeChat widget (fragments/chat_widget.html)
    window.MY_ROLE = 'CUSTOMER';

    window.openChatHistory = function(orderId, targetRole, label) {
        if (typeof window.ShopeeChat !== 'undefined') {
            window.ShopeeChat.open(orderId, targetRole, label);
        } else {
            // Fallback: widget not yet loaded
            console.warn('[Chat] ShopeeChat widget not ready');
        }
    };
</script>

<div th:replace="~{fragments/chat_widget :: chatWidget}"></div>
</main>
</body>
</html>
