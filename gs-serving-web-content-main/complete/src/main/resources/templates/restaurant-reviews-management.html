<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⭐ Quản Lý Đánh Giá - Nhà Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/review-management.css">
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-md-12">
            <h1 class="display-5 fw-bold">⭐ Quản Lý Đánh Giá Khách Hàng</h1>
            <p class="text-muted">Theo dõi & phản hồi ý kiến từ khách hàng</p>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row mb-4">
        <div class="col-md-3 mb-3">
            <div class="card stat-card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Tổng Đánh Giá</h6>
                            <h2 class="fw-bold" id="totalReviews">0</h2>
                        </div>
                        <div class="stat-icon bg-info">
                            <i class="fas fa-comments"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card stat-card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Chưa Phản Hồi</h6>
                            <h2 class="fw-bold text-warning" id="unrepliedReviews">0</h2>
                        </div>
                        <div class="stat-icon bg-warning">
                            <i class="fas fa-hourglass-half"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card stat-card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Đánh Giá Trung Bình</h6>
                            <h2 class="fw-bold text-success" id="averageRating">0.0</h2>
                        </div>
                        <div class="stat-icon bg-success">
                            <i class="fas fa-star"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card stat-card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Có Ảnh</h6>
                            <h2 class="fw-bold text-primary" id="reviewsWithImages">0</h2>
                        </div>
                        <div class="stat-icon bg-primary">
                            <i class="fas fa-image"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters & Sort -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label">Sắp Xếp Theo</label>
                            <select class="form-select" id="sortSelect" onchange="loadReviews()">
                                <option value="newest">Mới Nhất</option>
                                <option value="rating">Rating Cao Nhất</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Số Lượng/Trang</label>
                            <select class="form-select" id="pageSizeSelect" onchange="loadReviews()">
                                <option value="10">10 đánh giá</option>
                                <option value="20">20 đánh giá</option>
                                <option value="50">50 đánh giá</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">&nbsp;</label>
                            <button class="btn btn-primary w-100" onclick="loadReviews()">
                                <i class="fas fa-sync-alt"></i> Làm Mới
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reviews List -->
    <div id="reviewsList" class="reviews-container"></div>

    <!-- Pagination -->
    <nav id="paginationNav" class="mt-4"></nav>
</div>

<!-- Reply Modal -->
<div class="modal fade" id="replyModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title">Phản Hồi Đánh Giá</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="reviewPreview" class="mb-4 pb-3 border-bottom"></div>
                <div>
                    <label class="form-label fw-bold">Nội Dung Phản Hồi</label>
                    <textarea id="replyText" class="form-control" rows="5" placeholder="Cảm ơn bạn đã đánh giá. Ý kiến của bạn rất quý báu..."></textarea>
                    <small class="text-muted d-block mt-2">Các từ ngữ không lành mạnh sẽ tự động được lọc</small>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ Bỏ</button>
                <button type="button" class="btn btn-primary" id="submitReplyBtn" onclick="submitReply()">
                    <i class="fas fa-paper-plane"></i> Gửi Phản Hồi
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Image Lightbox Modal -->
<div class="modal fade" id="imageLightbox" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark">
            <div class="modal-header border-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="lightboxImage" src="" alt="" class="img-fluid" style="max-height: 600px;">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/review-management.js"></script>

</body>
</html>
