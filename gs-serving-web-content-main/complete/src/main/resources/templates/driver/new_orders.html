<!DOCTYPE html>
<html th:replace="~{layouts/driver_mobile_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Đơn hàng mới - Driver</title>
</head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">🛒 Đơn hàng sẵn sàng</h5>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-success rounded-pill d-none" id="acceptedCountBadge">0 đơn đã nhận</span>
            <button class="btn btn-sm btn-light border rounded-pill" onclick="loadAvailableOrders()">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <!-- Banner hiển thị số lượng đơn đã nhận -->
    <div id="acceptedBanner" class="alert alert-success py-2 px-3 mb-3 rounded-3 border-0 d-none">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <i class="bi bi-check-circle-fill me-1"></i>
                <strong>Đã nhận <span id="acceptedCount">0</span> đơn</strong>
            </div>
            <button class="btn btn-sm btn-primary rounded-pill px-3" onclick="goToDelivering()">
                Bắt đầu giao <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </div>
    </div>

    <!-- Empty State -->
    <div id="emptyOrders" class="text-center py-5 d-none">
        <div style="font-size: 3.5rem">📭</div>
        <h6 class="fw-bold mt-2">Hiện chưa có đơn mới</h6>
        <p class="text-muted small">Hãy đợi trong giây lát hoặc kiểm tra kết nối mạng.</p>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
        <div class="small text-muted mt-2">Đang tìm đơn gần bạn...</div>
    </div>

    <!-- Order List -->
    <div id="orderList"></div>

    <script th:inline="javascript">
        const token = localStorage.getItem('jwt_token');
        let acceptedOrdersCount = 0;

        async function loadAvailableOrders() {
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('emptyOrders').classList.add('d-none');
            document.getElementById('orderList').innerHTML = '';

            try {
                const res = await fetch('/api/driver/available-orders', { 
                    headers: { 'Authorization': 'Bearer ' + token } 
                });
                const orders = await res.json();
                document.getElementById('loading').classList.add('d-none');

                if (!orders || orders.length === 0) {
                    document.getElementById('emptyOrders').classList.remove('d-none');
                    return;
                }

                renderOrders(orders);
            } catch {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('orderList').innerHTML = '<div class="alert alert-danger">Lỗi tải dữ liệu</div>';
            }
        }

        function formatVND(n) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n || 0);
        }

        function paymentBadge(o) {
            if (o.needsCollectCash) {
                return `<div class="alert alert-danger py-2 px-3 mb-2 small mb-0 rounded-3 border-0">
                    <i class="bi bi-cash-coin me-1"></i><strong>COD</strong> — Thu ${formatVND(o.amountToCollect || o.totalAmount)} khi giao
                </div>`;
            }
            if (o.isPaidOnline) {
                return `<div class="alert alert-success py-2 px-3 mb-2 small mb-0 rounded-3 border-0">
                    <i class="bi bi-check-circle-fill me-1"></i>Đã thanh toán online
                </div>`;
            }
            return `<div class="alert alert-warning py-2 px-3 mb-2 small mb-0 rounded-3 border-0">
                <i class="bi bi-hourglass-split me-1"></i>Chưa thanh toán online
            </div>`;
        }

        function renderOrders(orders) {
            const list = document.getElementById('orderList');
            list.innerHTML = orders.map(o => {
                // Mock distance for UI
                const dist = (Math.random() * 3 + 0.5).toFixed(1);
                const income = (o.totalAmount * 0.1);
                
                return `
                <div class="mobile-card shadow-sm mb-3">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <span class="badge bg-primary bg-opacity-10 text-primary mb-2">Đơn #${o.id}</span>
                            <div class="fw-bold fs-6">${o.restaurantName}</div>
                        </div>
                        <div class="text-end">
                            <div class="text-success fw-bold fs-5">+${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(income)}</div>
                            <div class="small text-muted">${dist} km</div>
                        </div>
                    </div>

                    <div class="position-relative ps-4 mb-3">
                        <div class="position-absolute start-0 top-0 h-100 border-start border-2 border-dashed" style="left: 7px !important;"></div>
                        
                        <div class="mb-3 position-relative">
                            <i class="bi bi-circle-fill text-warning position-absolute" style="left: -32px; font-size: 0.8rem; top: 4px;"></i>
                            <div class="small text-muted mb-0">Lấy hàng tại</div>
                            <div class="small fw-semibold text-dark text-truncate">${o.restaurantAddress}</div>
                        </div>
                        
                        <div class="position-relative">
                            <i class="bi bi-geo-alt-fill text-danger position-absolute" style="left: -32px; font-size: 0.9rem; top: 2px;"></i>
                            <div class="small text-muted mb-0">Giao đến</div>
                            <div class="small fw-semibold text-dark text-truncate">${o.deliveryAddress}</div>
                        </div>
                    </div>

                    <div class="bg-light rounded-3 p-2 mb-3">
                        <div class="small text-muted"><i class="bi bi-box-seam me-1"></i>Chi tiết: ${o.items ? o.items.join(', ') : '—'}</div>
                    </div>

                    ${paymentBadge(o)}

                    <button class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm" onclick="acceptOrder(${o.id})">
                        <i class="bi bi-check2-circle me-1"></i> NHẬN ĐƠN NGAY
                    </button>
                </div>
                `;
            }).join('');
        }

                const d = await res.json();
                if (res.ok) {

                }

        function updateAcceptedBanner() {
            const banner = document.getElementById('acceptedBanner');
            const countBadge = document.getElementById('acceptedCountBadge');
            const countSpan = document.getElementById('acceptedCount');

            if (acceptedOrdersCount > 0) {
                banner.classList.remove('d-none');
                countBadge.classList.remove('d-none');
                countBadge.textContent = `${acceptedOrdersCount} đơn đã nhận`;
                countSpan.textContent = acceptedOrdersCount;
            } else {
                banner.classList.add('d-none');
                countBadge.classList.add('d-none');
            }
        }

        }

        window.onDriverStatusChange = function(isOnline) {
            if (isOnline) loadAvailableOrders();
            else {
                document.getElementById('orderList').innerHTML = '';
                document.getElementById('emptyOrders').classList.remove('d-none');
            }
        };

        loadAvailableOrders();
        setInterval(loadAvailableOrders, 15000); // 15s check
    </script>

    <style>
        .border-dashed { border-style: dashed !important; border-color: #cbd5e1 !important; }
        .mobile-card:active { transform: scale(0.98); transition: transform 0.1s; }
    </style>
</main>
</body>
</html>
