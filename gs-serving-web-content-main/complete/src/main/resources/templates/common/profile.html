<html th:replace="~{layouts/customer_layout :: layout(~{::profileHead}, ~{::main})}">
<head th:fragment="profileHead">
    <title>Hồ Sơ Cá Nhân | Food Delivery</title>
    <!-- Leaflet Map Picker - Đã đưa ra ngoài thẻ title để trình duyệt nạp được -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
    <style>
        :root {
            --profile-accent: #FF4B2B;
        }

        .profile-cover {
            height: 180px;
            background: linear-gradient(135deg, #FF4B2B 0%, #FF416C 100%);
            border-radius: 24px;
            position: relative;
            margin-bottom: 70px;
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.15);
        }

        .profile-avatar-wrapper {
            position: absolute;
            bottom: -60px;
            left: 40px;
            padding: 5px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: var(--profile-accent);
        }

        .profile-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 6px 16px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .info-card {
            border: 1px solid #f1f5f9;
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
        }

        .form-label-premium {
            font-weight: 600;
            color: #475569;
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: block;
        }

        .input-premium {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .input-premium:focus {
            background: white;
            border-color: var(--profile-accent);
            box-shadow: 0 0 0 4px rgba(255, 75, 43, 0.1);
        }

        .btn-save {
            background: linear-gradient(135deg, #FF4B2B 0%, #FF416C 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 16px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(255, 75, 43, 0.3);
            transition: all 0.3s;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 75, 43, 0.4);
            color: white;
        }
        
        .section-icon {
            width: 42px;
            height: 42px;
            background: #fff5f5;
            color: var(--profile-accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .banner-preview-box {
            width: 100%;
            height: 200px;
            background: #f8fafc;
            border: 2px dashed #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>
<body>
<main>
    <div class="container py-5" style="max-width: 800px;">
        <!-- Alert Message -->
        <div id="alertMessage" class="alert d-none animate__animated animate__fadeInDown" role="alert" 
             style="border-radius: 16px; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);"></div>

        <!-- Profile Header: Centered -->
        <div class="info-card text-center mb-4">
            <div class="position-relative mb-4 d-inline-block">
                <div style="width: 120px; height: 120px; padding: 5px; background: linear-gradient(135deg, #FF4B2B, #FF416C); border-radius: 30px; box-shadow: 0 10px 20px rgba(255, 75, 43, 0.2);">
                    <div id="navAvatarCircle" class="w-100 h-100 bg-white d-flex align-items-center justify-content-center fw-bold text-danger fs-1" style="border-radius: 25px;">U</div>
                </div>
                <span id="roleBadge" class="position-absolute bottom-0 start-100 translate-middle badge rounded-pill bg-dark px-3 py-2 shadow-sm border border-2 border-white" style="font-size: 0.65rem; letter-spacing: 1px;">GUEST</span>
            </div>
            
            <h3 class="fw-bold mb-1" id="profileNameDisplay">Tên người dùng</h3>
            <p class="text-muted small" id="profileEmailDisplay">email@example.com</p>
        </div>

        <!-- Section: Personal Info -->
        <div class="info-card mb-4">
            <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                <div class="section-icon"><i class="bi bi-person-vcard"></i></div>
                <h5 class="fw-bold mb-0">Thông tin cá nhân</h5>
            </div>

            <form id="profileForm">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label-premium">HỌ VÀ TÊN</label>
                        <input type="text" id="fullName" class="form-control input-premium" placeholder="Nhập họ tên đầy đủ" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-premium">ĐỊA CHỈ EMAIL</label>
                        <input type="email" id="email" class="form-control input-premium bg-light" disabled>
                        <small class="text-muted" style="font-size: 0.7rem;">Email không thể thay đổi</small>
                    </div>

                    <!-- Dynamic Fields -->
                    <div class="col-12 dynamic-field" id="fieldCustomer" style="display:none;">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label-premium">SỐ ĐIỆN THOẠI</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-end-0 rounded-start-4"><i class="bi bi-telephone text-muted"></i></span>
                                    <input type="text" id="phoneNumber" class="form-control input-premium rounded-start-0" placeholder="09xxxxxxxx">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-premium">ĐỊA CHỈ GIAO HÀNG</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-end-0 rounded-start-4"><i class="bi bi-geo-alt text-muted"></i></span>
                                    <input type="text" id="deliveryAddress" class="form-control input-premium border-end-0 rounded-0" placeholder="Địa chỉ mặc định">
                                    <button class="btn btn-outline-primary rounded-end-4 px-3" type="button" onclick="openMapPicker()">
                                        <i class="bi bi-map-fill"></i>
                                    </button>
                                </div>
                                <small class="text-muted mt-1 d-block" style="font-size: 0.75rem;">
                                    <i class="bi bi-info-circle me-1"></i> Bấm biểu tượng bản đồ để chọn vị trí chính xác.
                                </small>
                            </div>
                        </div>
                    </div>

                    <!-- Map Picker Modal -->
                    <div class="modal fade" id="mapPickerModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dialog-centered">
                            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                                <div class="modal-header border-0 pb-0">
                                    <h5 class="fw-bold mb-0">📍 Chọn vị trí giao hàng</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body p-0 position-relative">
                                    <!-- Search Bar Overlay -->
                                    <div class="position-absolute top-0 start-50 translate-middle-x mt-3 w-75" style="z-index: 1000;">
                                        <div class="input-group shadow-sm">
                                            <input type="text" id="mapSearchInput" class="form-control border-0 rounded-start-4 py-2" placeholder="Tìm kiếm địa chỉ..." onkeydown="if(event.key==='Enter') { event.preventDefault(); searchAddress(); }">
                                            <button type="button" class="btn btn-white border-0 rounded-end-4 px-3" onclick="searchAddress()">
                                                <i class="bi bi-search text-primary"></i>
                                            </button>
                                        </div>
                                        <div id="searchResults" class="list-group shadow-sm mt-1 d-none" style="max-height: 200px; overflow-y: auto; border-radius: 12px;"></div>
                                    </div>

                                    <!-- Map Container -->
                                    <div id="picker-map" style="height: 450px; width: 100%;"></div>

                                    <!-- My Location Button -->
                                    <button type="button" class="btn btn-white rounded-circle shadow position-absolute bottom-0 end-0 m-3" 
                                            style="z-index: 1000; width: 45px; height: 45px; border: 1px solid #ddd;" 
                                            onclick="getCurrentLocation()" title="Vị trí của tôi">
                                        <i class="bi bi-crosshair2 text-danger fs-5"></i>
                                    </button>
                                </div>
                                <div class="p-3 bg-light">
                                    <div class="fw-bold small text-primary mb-1"><i class="bi bi-geo-fill me-1"></i>ĐỊA CHỈ ĐÃ CHỌN:</div>
                                    <div id="pickedAddress" class="small fw-semibold text-dark">Vui lòng chọn một điểm trên bản đồ...</div>
                                </div>
                                <div class="modal-footer border-0 pt-0">
                                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                                    <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm" onclick="confirmAddress()">Xác nhận vị trí</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 dynamic-field" id="fieldDriver" style="display:none;">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label-premium">SỐ ĐIỆN THOẠI</label>
                                <input type="text" id="driverPhone" class="form-control input-premium">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-premium">BIỂN SỐ XE</label>
                                <input type="text" id="licensePlate" class="form-control input-premium" placeholder="29X-XXXX">
                            </div>
                        </div>
                    </div>

                    <div class="col-12 dynamic-field" id="fieldRestaurant" style="display:none;">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label-premium">TÊN NHÀ HÀNG</label>
                                <input type="text" id="restaurantName" class="form-control input-premium">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-premium">ĐỊA CHỈ KINH DOANH</label>
                                <input type="text" id="address" class="form-control input-premium">
                            </div>
                            <div class="col-12">
                                <label class="form-label-premium">BANNER NHÀ HÀNG</label>
                                <div class="mb-3">
                                    <input type="file" id="bannerFile" class="form-control rounded-4" accept="image/*" onchange="uploadBanner(this)">
                                    <input type="hidden" id="bannerUrl">
                                </div>
                                <div class="banner-preview-box">
                                    <img id="bannerPreview" src="" class="img-fluid d-none" style="width: 100%; height: 100%; object-fit: cover;">
                                    <div id="bannerPlaceholder" class="text-center text-muted">
                                        <i class="bi bi-image fs-1 opacity-25"></i>
                                        <p class="small mb-0">Chưa có banner</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-save w-100 py-3">
                        Lưu thông tin thay đổi
                    </button>
                </div>
            </form>
        </div>

        <!-- Section: Security -->
        <div class="info-card mb-4">
            <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                <div class="section-icon" style="background: #f0f9ff; color: #0ea5e9;"><i class="bi bi-shield-lock"></i></div>
                <h5 class="fw-bold mb-0">Bảo mật tài khoản</h5>
            </div>

            <form id="passwordForm">
                <div class="mb-4">
                    <label class="form-label-premium">MẬT KHẨU HIỆN TẠI</label>
                    <input type="password" id="oldPassword" class="form-control input-premium" placeholder="Nhập mật khẩu hiện tại" required>
                </div>
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label-premium">MẬT KHẨU MỚI</label>
                        <input type="password" id="newPassword" class="form-control input-premium" placeholder="Tối thiểu 8 ký tự" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-premium">XÁC NHẬN MẬT KHẨU</label>
                        <input type="password" id="confirmPassword" class="form-control input-premium" placeholder="Nhập lại mật khẩu mới" required>
                    </div>
                </div>
                <div>
                    <button type="submit" class="btn btn-dark w-100 py-3 rounded-4 fw-bold">
                        Đổi mật khẩu bảo mật
                    </button>
                </div>
            </form>
        </div>

        <!-- Logout Area -->
        <div class="text-center py-3">
            <button class="btn btn-link text-danger text-decoration-none fw-bold" onclick="localStorage.clear(); window.location.href='/';">
                <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất tài khoản
            </button>
        </div>
    </div>

    <style>
        .input-group-text {
            border: 1px solid #e2e8f0;
            border-right: none;
            padding-left: 1rem;
        }
        .input-premium {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
        }
        input:not(.input-premium) {
            border-radius: 14px !important;
        }
    </style>

    <script th:inline="javascript">
        // Helper to switch sections
        function showSection(section) {
            document.querySelectorAll('.profile-section').forEach(el => el.classList.add('d-none'));
            document.querySelectorAll('.btn-light').forEach(el => el.classList.remove('active-tab'));
            
            if (section === 'personal') {
                document.getElementById('sectionPersonal').classList.remove('d-none');
                event.currentTarget.classList.add('active-tab');
            } else {
                document.getElementById('sectionSecurity').classList.remove('d-none');
                event.currentTarget.classList.add('active-tab');
            }
        }

        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = '/common/auth';

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertMessage');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} d-block shadow-sm mb-4`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { alertBox.classList.add('d-none'); }, 3000);
        }

        function previewBanner(url) {
            const img = document.getElementById('bannerPreview');
            const placeholder = document.getElementById('bannerPlaceholder');
            if (url) {
                img.src = url;
                img.classList.remove('d-none');
                placeholder.classList.add('d-none');
            } else {
                img.classList.add('d-none');
                placeholder.classList.remove('d-none');
            }
        }

        async function uploadBanner(input) {
            if (!input.files?.[0]) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);
            try {
                const res = await fetch('/api/upload/image', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('bannerUrl').value = data.url;
                    previewBanner(data.url);
                    showAlert('Tải banner thành công!', 'success');
                }
            } catch (err) { showAlert('Lỗi khi tải ảnh', 'danger'); }
        }

        async function loadProfile() {
            try {
                const res = await fetch('/api/profile/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) { window.location.href = '/'; return; }
                const data = await res.json();
                if (res.ok) {
                    const role = data.role;
                    document.getElementById('roleBadge').textContent = role;
                    document.getElementById('fullName').value = data.fullName || '';
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('profileNameDisplay').textContent = data.fullName || data.username;
                    document.getElementById('profileEmailDisplay').textContent = data.email;
                    document.getElementById('navAvatarCircle').textContent = (data.fullName || data.username).charAt(0).toUpperCase();

                    document.querySelectorAll('.dynamic-field').forEach(el => el.style.display = 'none');
                    if (role === 'CUSTOMER') {
                        document.getElementById('fieldCustomer').style.display = 'block';
                        document.getElementById('phoneNumber').value = data.phoneNumber || '';
                        document.getElementById('deliveryAddress').value = data.deliveryAddress || '';
                        // Lưu lại toạ độ để dùng khi mở map
                        if (data.latitude && data.longitude) {
                            window.customerLat = data.latitude;
                            window.customerLng = data.longitude;
                        }
                    } else if (role === 'DRIVER') {
                        // Redirect driver to their app UI instead of this customer-styled page
                        window.location.href = '/driver/dashboard';
                    } else if (role === 'RESTAURANT') {
                        // Redirect restaurant to their dashboard profile page
                        window.location.href = '/restaurant/profile';
                    }
                }
            } catch (err) { showAlert('Lỗi kết nối', 'danger'); }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('roleBadge').textContent;
            const payload = { fullName: document.getElementById('fullName').value };
            if (role === 'CUSTOMER') {
                payload.phoneNumber = document.getElementById('phoneNumber').value;
                payload.deliveryAddress = document.getElementById('deliveryAddress').value;
                if (window.customerLat && window.customerLng) {
                    payload.latitude = window.customerLat;
                    payload.longitude = window.customerLng;
                }
            } else if (role === 'DRIVER') {
                payload.phoneNumber = document.getElementById('driverPhone').value;
                payload.licensePlate = document.getElementById('licensePlate').value;
            } else if (role === 'RESTAURANT') {
                payload.restaurantName = document.getElementById('restaurantName').value;
                payload.address = document.getElementById('address').value;
                payload.bannerUrl = document.getElementById('bannerUrl').value;
            }
            try {
                const res = await fetch('/api/profile/me', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(payload)
                });
                if (res.ok) { showAlert('Cập nhật thành công!', 'success'); loadProfile(); }
            } catch (err) { showAlert('Cập nhật thất bại', 'danger'); }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            if (newPassword !== document.getElementById('confirmPassword').value) {
                showAlert('Mật khẩu xác nhận không khớp', 'danger'); return;
            }
            try {
                const res = await fetch('/api/profile/password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                if (res.ok) { showAlert('Đổi mật khẩu thành công!', 'success'); e.target.reset(); }
                else { const d = await res.json(); showAlert(d.error || 'Lỗi đổi mật khẩu', 'danger'); }
            } catch (err) { showAlert('Lỗi kết nối', 'danger'); }
        });

        loadProfile();

        // --- MAP PICKER LOGIC ---
        let pickerMap;
        let pickerMarker;
        let selectedLat, selectedLng;

        function openMapPicker() {
            const modalElement = document.getElementById('mapPickerModal');
            const modal = new bootstrap.Modal(modalElement);
            modal.show();
            
            modalElement.addEventListener('shown.bs.modal', function () {
                if (!pickerMap) {
                    const lat = window.customerLat || 10.762622;
                    const lng = window.customerLng || 106.660172;
                    
                    pickerMap = L.map('picker-map', { zoomControl: false }).setView([lat, lng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(pickerMap);
                    L.control.zoom({ position: 'bottomleft' }).addTo(pickerMap);

                    pickerMap.on('click', function(e) {
                        updateMarker(e.latlng.lat, e.latlng.lng);
                    });
                    
                    if (window.customerLat && window.customerLng) {
                        updateMarker(window.customerLat, window.customerLng, document.getElementById('deliveryAddress').value);
                    }
                } else {
                    pickerMap.invalidateSize();
                    if (window.customerLat && window.customerLng) {
                        pickerMap.setView([window.customerLat, window.customerLng], 15);
                        updateMarker(window.customerLat, window.customerLng, document.getElementById('deliveryAddress').value);
                    }
                }
            }, { once: true });
        }

        async function updateMarker(lat, lng, address = null) {
            selectedLat = lat;
            selectedLng = lng;

            if (pickerMarker) {
                pickerMarker.setLatLng([lat, lng]);
            } else {
                pickerMarker = L.marker([lat, lng], { draggable: true }).addTo(pickerMap);
                pickerMarker.on('dragend', function(e) {
                    const pos = e.target.getLatLng();
                    updateMarker(pos.lat, pos.lng);
                });
            }
            pickerMap.setView([lat, lng], 16);

            if (address) {
                document.getElementById('pickedAddress').textContent = address;
            } else {
                // Reverse Geocoding
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=vi`);
                    const data = await res.json();
                    document.getElementById('pickedAddress').textContent = data.display_name || `Tọa độ: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                } catch (err) {
                    document.getElementById('pickedAddress').textContent = `Tọa độ: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                }
            }
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    updateMarker(position.coords.latitude, position.coords.longitude);
                }, () => showAlert('Không thể lấy vị trí hiện tại. Hãy kiểm tra quyền truy cập GPS.', 'warning'));
            }
        }

        async function searchAddress() {
            const query = document.getElementById('mapSearchInput').value;
            if (!query) return;

            const btn = document.querySelector('#mapSearchInput').nextElementSibling;
            const originalIcon = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm text-primary"></span>';
            btn.disabled = true;

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1&accept-language=vi`);
                const results = await res.json();
                const container = document.getElementById('searchResults');
                container.innerHTML = '';
                
                if (results.length > 0) {
                    container.classList.remove('d-none');
                    results.forEach(item => {
                        const btn = document.createElement('button');
                        btn.className = 'list-group-item list-group-item-action small py-2';
                        btn.textContent = item.display_name;
                        btn.onclick = () => {
                            updateMarker(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
                            container.classList.add('d-none');
                        };
                        container.appendChild(btn);
                    });
                } else {
                    showAlert('Không tìm thấy địa chỉ nào phù hợp!', 'warning');
                }
            } catch (err) { 
                console.error("Search error:", err); 
                showAlert('Lỗi tìm kiếm!', 'danger');
            } finally {
                btn.innerHTML = originalIcon;
                btn.disabled = false;
            }
        }

        // Đóng danh sách tìm kiếm khi click ra ngoài
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchResults') && !e.target.closest('#mapSearchInput')) {
                document.getElementById('searchResults').classList.add('d-none');
            }
        });

        function confirmAddress() {
            const address = document.getElementById('pickedAddress').textContent;
            if (address && address !== "Vui lòng chọn một điểm trên bản đồ...") {
                document.getElementById('deliveryAddress').value = address;
                window.customerLat = selectedLat;
                window.customerLng = selectedLng;
                bootstrap.Modal.getInstance(document.getElementById('mapPickerModal')).hide();
                // Tự động lưu để tránh người dùng quên bấm nút
                document.getElementById('profileForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                showAlert('Đã cập nhật vị trí bản đồ thành công!', 'success');
            } else {
                showAlert('Vui lòng chọn 1 điểm trên bản đồ!', 'warning');
            }
        }
    </script>
</main>
</body>
</html>
