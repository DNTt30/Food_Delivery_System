<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, role, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="${title}"></th:block>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        /* Dashboard specific */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background-color: var(--dark);
        }
        .main-content {
            margin-left: 250px;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Mobile adjustments */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar_dashboard :: sidebar(${role})}"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top bar for mobile toggle and breadcrumbs if needed -->
        <div class="d-flex justify-content-between align-items-center mb-4 d-md-none">
            <button class="btn btn-outline-dark" onclick="document.querySelector('.sidebar').classList.toggle('show')">
                <i class="bi bi-list"></i> Menu
            </button>
        </div>
        
        <th:block th:replace="${content}"></th:block>

        <!-- Dashboard Footer -->
        <div th:replace="~{fragments/footer :: footer}" class="mt-auto"></div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
