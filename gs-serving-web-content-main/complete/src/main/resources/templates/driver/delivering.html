<!DOCTYPE html>
<html th:replace="~{layouts/driver_mobile_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Đơn hàng hiện tại - Driver</title>
</head>
<body>
<main>

<!-- ═══════════════════════════════════════════
     LEAFLET — phải load trong <main> vì layout
     chỉ inject <title>, không inject toàn bộ <head>
════════════════════════════════════════════════ -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<style>
/* ─── Layout ─────────────────────────────── */
.page-header {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.page-header h5 { font-size: 1.05rem; font-weight: 700; margin: 0; }

/* ─── GPS Bar ─────────────────────────────── */
.gps-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 10px;
    background: #f8fafc; border: 1px solid #e2e8f0;
    font-size: 0.75rem; color: #64748b;
    margin-bottom: 12px;
}
.gps-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #94a3b8; flex-shrink: 0;
}
.gps-dot.active {
    background: #22c55e;
    animation: gps-pulse 1.5s infinite;
}
.gps-dot.error { background: #ef4444; }
@keyframes gps-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
    50%      { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
}

/* ─── Phase Banner ────────────────────────── */
.phase-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 12px;
    font-weight: 700; font-size: 0.88rem;
    margin-bottom: 12px;
}
.phase-going   { background:#fef9c3; color:#92400e; border:1px solid #fde68a; }
.phase-deliver { background:#dbeafe; color:#1e40af; border:1px solid #93c5fd; }

/* ─── Map ─────────────────────────────────── */
#map-wrapper {
    margin: 0 -12px 12px;
    border-radius: 0; overflow: hidden;
    position: relative;
}
#driver-map {
    height: 240px; width: 100%;
    background: #e2e8f0;
}
.leaflet-routing-container { display: none !important; }
.map-btn-focus {
    position: absolute; top: 10px; right: 10px; z-index: 999;
    background: white; border: 1px solid #e2e8f0;
    border-radius: 8px; padding: 6px 10px;
    font-size: 0.75rem; font-weight: 600;
    color: #334155; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ─── Step Cards ──────────────────────────── */
.step-card {
    background: #fff; border-radius: 14px;
    border: 1px solid #e2e8f0; padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.step-label {
    font-size: 0.68rem; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: .04em;
}
.step-label.s1 { background:#fef3c7; color:#92400e; }
.step-label.s2 { background:#dbeafe; color:#1e40af; }
.step-card h6 { font-size: 0.9rem; font-weight: 700; margin: 6px 0 2px; }
.step-card .addr {
    font-size: 0.78rem; color: #64748b; margin-bottom: 10px;
    display: flex; align-items: flex-start; gap: 4px;
}
.step-card .items-line {
    font-size: 0.78rem; color: #475569;
    background: #f8fafc; border-radius: 8px;
    padding: 7px 10px; margin-bottom: 10px;
}
.action-row { display: flex; gap: 8px; }
.btn-call {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 5px; padding: 7px; border-radius: 9px; font-size: 0.78rem;
    font-weight: 600; text-decoration: none; border: 1px solid #e2e8f0;
    background: #f8fafc; color: #334155; cursor: pointer;
}
.btn-call:hover { background:#e2e8f0; color:#334155; }
.btn-nav {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 5px; padding: 7px; border-radius: 9px; font-size: 0.78rem;
    font-weight: 600; border: 1px solid #bfdbfe;
    background: #eff6ff; color: #1e40af; cursor: pointer;
}
.btn-nav:hover { background:#dbeafe; }
.btn-chat {
    width: 36px; display: flex; align-items: center; justify-content: center;
    border-radius: 9px; border: 1px solid #e2e8f0;
    background: #f8fafc; color: #64748b; cursor: pointer; font-size: 1rem;
}
.btn-chat:hover { background:#e2e8f0; }

/* ─── Action Buttons ──────────────────────── */
#btn-picked-up, #btn-complete {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    font-weight: 700; font-size: 1rem; cursor: pointer;
    transition: transform .1s, opacity .2s;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
    margin-top: 4px;
}
#btn-picked-up { background: linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
#btn-complete  { background: linear-gradient(135deg,#22c55e,#16a34a); color:#fff; }
#btn-picked-up:active, #btn-complete:active { transform: scale(.97); }
#btn-picked-up:disabled, #btn-complete:disabled { opacity:.6; }
.action-hint { text-align:center; font-size:.75rem; color:#94a3b8; margin-top:6px; }

/* ─── Empty / Loading ─────────────────────── */
#loading { text-align:center; padding: 60px 0; }
.empty-box { text-align:center; padding: 60px 0; }
.empty-box .icon { font-size: 3.5rem; }
</style>

<!-- Header -->
<div class="page-header">
    <h5>🛵 Chuyến giao hiện tại</h5>
    <button class="btn btn-sm btn-light border rounded-pill px-3"
            onclick="loadActiveDeliveries()" style="font-size:.8rem;">
        <i class="bi bi-arrow-clockwise"></i>
    </button>
</div>

<!-- GPS Status -->
<div class="gps-bar" id="gpsBar">
    <div class="gps-dot" id="gpsDot"></div>
    <span id="gpsText">GPS chưa kết nối</span>
</div>

<!-- Loading -->
<div id="loading">
    <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
    <p class="text-muted small mt-2">Đang tải dữ liệu...</p>
</div>

<!-- Empty -->
<div id="emptyState" class="empty-box d-none">
    <div class="icon">📦</div>
    <h6 class="fw-bold mt-2">Không có đơn đang giao</h6>
    <p class="text-muted small">Hãy qua tab "Nhận đơn" để tìm chuyến mới.</p>
    <a href="/driver/new_orders" class="btn btn-primary rounded-pill px-4 mt-1" style="font-size:.85rem;">
        Nhận đơn mới
    </a>
</div>

<!-- Phase Banner -->
<div id="phaseBanner" class="phase-banner d-none">
    <span id="phaseIcon"></span>
    <div>
        <div id="phaseText" style="font-size:.88rem;"></div>
        <div id="phaseHint" style="font-size:.72rem;font-weight:500;opacity:.75;margin-top:2px;"></div>
    </div>
</div>

<!-- MAP -->
<div id="map-wrapper" class="d-none">
    <div id="driver-map"></div>
    <button class="map-btn-focus" onclick="focusDriver()">
        <i class="bi bi-crosshair"></i> Vị trí tôi
    </button>
</div>

<!-- Order Cards -->
<div id="activeOrders"></div>

<!-- Action -->
<div id="actionArea" class="d-none">
    <button id="btn-picked-up" class="d-none" onclick="confirmPickedUp()">
        🍱 ĐÃ LẤY HÀNG — BẮT ĐẦU GIAO
    </button>
    <button id="btn-complete" class="d-none" onclick="confirmComplete()">
        <i class="bi bi-check-circle-fill me-1"></i> XÁC NHẬN GIAO THÀNH CÔNG
    </button>
    <div class="action-hint" id="actionHint"></div>
</div>

<script>
const token = localStorage.getItem('jwt_token');
let currentOrder = null;
let driverMap = null;
let driverMarker = null;
let routingCtrl = null;
let gpsWatchId = null;

// ── Icons ──────────────────────────────────────────────────────────
function makeIcon(url) {
    return L.icon({ iconUrl: url, iconSize: [38,38], iconAnchor: [19,38],
                    popupAnchor: [0,-38] });
}

// ── Load data ──────────────────────────────────────────────────────
async function loadActiveDeliveries() {
    show('loading'); hide('emptyState'); hide('phaseBanner');
    hide('map-wrapper'); hide('actionArea');
    document.getElementById('activeOrders').innerHTML = '';

    try {
        const res = await fetch('/api/driver/my-deliveries', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        hide('loading');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const orders = await res.json();

        if (!orders || orders.length === 0) {
            stopGPS(); show('emptyState'); return;
        }
        currentOrder = orders[0];
        renderCards(orders);
        initMap(currentOrder);
        renderPhase(currentOrder.status);
        startGPS(currentOrder.id);
        show('actionArea');

    } catch(e) {
        hide('loading');
        document.getElementById('activeOrders').innerHTML =
            `<div class="alert alert-danger rounded-3 text-center small">
                <i class="bi bi-wifi-off me-1"></i>Lỗi kết nối: ${e.message}
             </div>`;
    }
}

// ── Render cards ───────────────────────────────────────────────────
function renderCards(orders) {
    document.getElementById('activeOrders').innerHTML = orders.map(o => `
    <div class="step-card">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="step-label s1">① LẤY HÀNG</span>
            <span style="font-size:.72rem;color:#94a3b8;">Đơn #${o.id}</span>
        </div>
        <h6>${esc(o.restaurantName)}</h6>
        <div class="addr"><i class="bi bi-shop text-warning"></i>${esc(o.restaurantAddress)}</div>
        <div class="action-row">
            ${o.restaurantPhone
                ? `<a href="tel:${o.restaurantPhone}" class="btn-call"><i class="bi bi-telephone"></i>Gọi quán</a>`
                : `<span class="btn-call" style="opacity:.4;cursor:default"><i class="bi bi-telephone"></i>Gọi quán</span>`}
            <button class="btn-nav" onclick="navTo(${rLat},${rLng})">
                <i class="bi bi-map"></i>Chỉ đường
            </button>
            <button class="btn-chat" onclick="chat(${o.id},'RESTAURANT','Nhà hàng')" title="Chat quán">
                <i class="bi bi-chat-dots"></i>
            </button>
        </div>
    </div>

    <div class="step-card">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="step-label s2">② GIAO ĐẾN KHÁCH</span>
        </div>
        <h6>${esc(o.customerName)}</h6>
        <div class="addr"><i class="bi bi-geo-alt-fill text-danger"></i>${esc(o.deliveryAddress)}</div>
        <div class="items-line"><i class="bi bi-box-seam text-muted me-1"></i>${(o.items||[]).join(', ')||'—'}</div>
        <div class="action-row">
            ${o.customerPhone
                ? `<a href="tel:${o.customerPhone}" class="btn-call"><i class="bi bi-telephone"></i>Gọi khách</a>`
                : `<span class="btn-call" style="opacity:.4;cursor:default"><i class="bi bi-telephone"></i>Gọi khách</span>`}
            <button class="btn-nav" onclick="navTo(${cLat},${cLng})">
                <i class="bi bi-map"></i>Chỉ đường
            </button>
            <button class="btn-chat" onclick="chat(${o.id},'CUSTOMER','Khách hàng')" title="Chat khách">
                <i class="bi bi-chat-dots"></i>
            </button>
        </div>
    </div>`).join('<div style="border-top:1px dashed #e2e8f0;margin:4px 0 12px;"></div>');

    // Subscriptions chat
    const ids = orders.map(o => o.id);
    if (typeof window._refreshDriverChatSubs === 'function') window._refreshDriverChatSubs(ids);
}

// ── Leaflet Map ────────────────────────────────────────────────────
let currentRoutePhase = null;

function initMap(o) {
    const rLat = o.restaurantLat || 20.9626;
    const rLng = o.restaurantLng || 105.7402;
    const cLat = o.deliveryLat  || 20.9685;
    const cLng = o.deliveryLng  || 105.7451;

    show('map-wrapper');

    // Destroy old map
    if (driverMap) { driverMap.remove(); driverMap = null; driverMarker = null; routingCtrl = null; }
    document.getElementById('driver-map').innerHTML = '';
    currentRoutePhase = null;

    // Khởi tạo sau 1 tick để DOM sẵn sàng kích thước
    setTimeout(() => {
        const centerLat = (rLat + cLat) / 2;
        const centerLng = (rLng + cLng) / 2;
        driverMap = L.map('driver-map', { zoomControl: false })
            .setView([centerLat, centerLng], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap', maxZoom: 19
        }).addTo(driverMap);

        L.marker([rLat, rLng], { icon: makeIcon('https://cdn-icons-png.flaticon.com/512/3170/3170733.png') })
            .addTo(driverMap).bindPopup(`<b>🍽️ ${esc(o.restaurantName)}</b>`);
        L.marker([cLat, cLng], { icon: makeIcon('https://cdn-icons-png.flaticon.com/512/2944/2944364.png') })
            .addTo(driverMap).bindPopup(`<b>📍 ${esc(o.deliveryAddress)}</b>`);

        const p1 = [rLat, rLng];
        const p2 = [cLat, cLng];
        driverMap.fitBounds([p1, p2], { padding:[30,30] });

        // Fix map size sau khi hiện
        driverMap.invalidateSize();
    }, 100);
}

function drawRoute(fromLat, fromLng, toLat, toLng, color) {
    if (!driverMap) return;
    if (routingCtrl) { driverMap.removeControl(routingCtrl); routingCtrl = null; }
    routingCtrl = L.Routing.control({
        waypoints: [L.latLng(fromLat, fromLng), L.latLng(toLat, toLng)],
        lineOptions: { styles: [{ color, weight: 5, opacity: 0.85 }] },
        createMarker: () => null,
        fitSelectedRoutes: true, show: false, addWaypoints: false
    }).addTo(driverMap);
}

function focusDriver() {
    if (driverMarker && driverMap) driverMap.flyTo(driverMarker.getLatLng(), 16, { animate: true });
}

// ── GPS ────────────────────────────────────────────────────────────
function updateDriverPosition(lat, lng, accuracy, orderId) {
    if (accuracy) setGPS('active', `GPS hoạt động ±${Math.round(accuracy)}m`);
    
    // Lưu tọa độ vào cache để lúc F5 trang hiện ra liền
    localStorage.setItem('driver_last_lat', lat);
    localStorage.setItem('driver_last_lng', lng);

    if (driverMap) {
        if (!driverMarker) {
            driverMarker = L.marker([lat,lng], {
                icon: makeIcon('https://cdn-icons-png.flaticon.com/512/3209/3209800.png'),
                zIndexOffset: 1000
            }).addTo(driverMap).bindPopup('🛵 Vị trí của bạn');
        } else {
            driverMarker.setLatLng([lat,lng]);
        }
        if (currentOrder) {
            if (currentOrder.status === 'PREPARING' && currentRoutePhase !== 'PREPARING') {
                drawRoute(lat, lng, currentOrder.restaurantLat||20.9626, currentOrder.restaurantLng||105.7402, '#f59e0b');
                currentRoutePhase = 'PREPARING';
            } else if (currentOrder.status === 'DELIVERING' && currentRoutePhase !== 'DELIVERING') {
                drawRoute(lat, lng, currentOrder.deliveryLat||20.9685, currentOrder.deliveryLng||105.7451, '#3b82f6');
                currentRoutePhase = 'DELIVERING';
            }
        }
    }

    if (orderId) {
        fetch('/api/driver/location', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ orderId, latitude: lat, longitude: lng })
        }).catch(() => {});
    }
}

function startGPS(orderId) {
    if (!navigator.geolocation) {
        setGPS('error', 'GPS không được hỗ trợ'); return;
    }
    stopGPS();
    setGPS('loading', 'Đang kết nối GPS...');

    // 1. Vẽ ngay tọa độ cũ từ lần trước (nếu có) để tránh màn hình trắng khi F5
    const cachedLat = localStorage.getItem('driver_last_lat');
    const cachedLng = localStorage.getItem('driver_last_lng');
    if (cachedLat && cachedLng) {
        updateDriverPosition(parseFloat(cachedLat), parseFloat(cachedLng), null, null); // Không gọi API
    }

    // 2. Yêu cầu tọa độ hiện tại ngay lập tức (thường trả về nhanh hơn watch)
    navigator.geolocation.getCurrentPosition(pos => {
        updateDriverPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, orderId);
    }, () => {}, { enableHighAccuracy: false, maximumAge: 10000, timeout: 10000 });

    // 3. Bắt đầu lắng nghe sự di chuyển
    gpsWatchId = navigator.geolocation.watchPosition(pos => {
        updateDriverPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, orderId);
    }, err => {
        setGPS('error', `GPS lỗi: ${err.message}`);
    }, { enableHighAccuracy: false, maximumAge: 10000, timeout: 30000 });
}

function stopGPS() {
    if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
}

function setGPS(state, text) {
    const dot = document.getElementById('gpsDot');
    dot.className = 'gps-dot' + (state === 'active' ? ' active' : state === 'error' ? ' error' : '');
    document.getElementById('gpsText').textContent = text;
}

// ── Phase UI ───────────────────────────────────────────────────────
function renderPhase(status) {
    const banner = document.getElementById('phaseBanner');
    const btnPick = document.getElementById('btn-picked-up');
    const btnDone = document.getElementById('btn-complete');
    const hint    = document.getElementById('actionHint');

    banner.classList.remove('d-none','phase-going','phase-deliver');

    if (status === 'PREPARING') {
        banner.classList.add('phase-going');
        document.getElementById('phaseIcon').textContent = '🏍️';
        document.getElementById('phaseText').textContent = 'Đang di chuyển đến nhà hàng';
        document.getElementById('phaseHint').textContent = 'Lấy hàng xong → bấm nút bên dưới';
        btnPick.classList.remove('d-none'); btnDone.classList.add('d-none');
        hint.textContent = 'Bấm sau khi đã nhận đủ đồ ăn từ nhà hàng';
    } else if (status === 'DELIVERING') {
        banner.classList.add('phase-deliver');
        document.getElementById('phaseIcon').textContent = '📦';
        document.getElementById('phaseText').textContent = 'Đang giao hàng đến khách';
        document.getElementById('phaseHint').textContent = 'Giao xong → xác nhận hoàn thành';
        btnPick.classList.add('d-none'); btnDone.classList.remove('d-none');
        hint.textContent = 'Xác nhận sau khi đã giao tận tay khách hàng';
    }
}

// ── Buttons ────────────────────────────────────────────────────────
async function confirmPickedUp() {
    if (!currentOrder) return;
    if (!confirm(`Xác nhận đã lấy xong hàng tại ${currentOrder.restaurantName}?`)) return;
    const btn = document.getElementById('btn-picked-up');
    btn.disabled = true; btn.textContent = '⏳ Đang cập nhật...';
    try {
        const res = await fetch(`/api/driver/orders/${currentOrder.id}/picked-up`, {
            method: 'PUT', headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
            currentOrder.status = 'DELIVERING';
            renderPhase('DELIVERING');
            if (driverMap && driverMarker && currentOrder.deliveryLat) {
                const ll = driverMarker.getLatLng();
                drawRoute(ll.lat, ll.lng, currentOrder.deliveryLat, currentOrder.deliveryLng, '#3b82f6');
            }
            toast('✅ Đã lấy hàng! Bắt đầu giao đến khách', 'success');
        } else {
            const d = await res.json().catch(() => ({}));
            toast(d.error || 'Lỗi cập nhật', 'danger');
            btn.disabled = false; btn.textContent = '🍱 ĐÃ LẤY HÀNG — BẮT ĐẦU GIAO';
        }
    } catch { toast('Lỗi kết nối', 'danger'); btn.disabled = false; btn.textContent = '🍱 ĐÃ LẤY HÀNG — BẮT ĐẦU GIAO'; }
}

async function confirmComplete() {
    if (!currentOrder) return;
    if (!confirm(`Xác nhận đã giao xong đơn hàng #${currentOrder.id}?`)) return;
    const btn = document.getElementById('btn-complete');
    btn.disabled = true; btn.textContent = '⏳ Đang xác nhận...';
    try {
        const res = await fetch(`/api/driver/orders/${currentOrder.id}/complete`, {
            method: 'PUT', headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
            stopGPS();
            toast('🎉 Giao thành công! Đã cộng thu nhập vào ví.', 'success');
            setTimeout(loadActiveDeliveries, 1500);
        } else {
            const d = await res.json().catch(() => ({}));
            toast(d.error || 'Lỗi cập nhật', 'danger');
            btn.disabled = false; btn.textContent = '✅ XÁC NHẬN GIAO THÀNH CÔNG';
        }
    } catch { toast('Lỗi kết nối', 'danger'); btn.disabled = false; btn.textContent = '✅ XÁC NHẬN GIAO THÀNH CÔNG'; }
}

// ── Helpers ────────────────────────────────────────────────────────
function navTo(lat, lng) {
    if (!lat || !lng) { toast('Không có tọa độ', 'warning'); return; }
    if (!driverMap) return;
    
    // Cuộn mượt mà lên bản đồ ở trên cùng
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    if (driverMarker) {
        // Lấy vị trí hiện tại của tài xế
        const myLat = driverMarker.getLatLng().lat;
        const myLng = driverMarker.getLatLng().lng;
        
        // Vẽ đường đi
        drawRoute(myLat, myLng, lat, lng, '#3b82f6');
        
        // Zoom bản đồ vừa vặn với tuyến đường
        const p1 = [myLat, myLng];
        const p2 = [lat, lng];
        driverMap.fitBounds([p1, p2], { padding: [30, 30] });
    } else {
        // Nếu chưa có định vị tài xế, chỉ trỏ camera về điểm đó
        driverMap.flyTo([lat, lng], 16, { animate: true });
    }
}
function chat(orderId, role, label) {
    if (typeof window.openShopeeChat === 'function') window.openShopeeChat(orderId, role, label);
    else toast('Chat chưa sẵn sàng', 'warning');
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function show(id) { document.getElementById(id)?.classList.remove('d-none'); }
function hide(id) { document.getElementById(id)?.classList.add('d-none'); }
function toast(msg, type) {
    const t = document.createElement('div');
    t.className = `position-fixed bottom-0 end-0 m-3 toast align-items-center text-bg-${type} border-0 show`;
    t.style.cssText = 'z-index:9999;border-radius:12px;min-width:220px;';
    t.innerHTML = `<div class="d-flex"><div class="toast-body fw-semibold">${msg}</div></div>`;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

// ── Init ───────────────────────────────────────────────────────────
window.MY_ROLE = 'DRIVER';
loadActiveDeliveries();
</script>
