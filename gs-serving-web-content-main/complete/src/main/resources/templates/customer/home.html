<!DOCTYPE html>
<html th:replace="~{layouts/customer_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Customer - Trang chủ</title>
</head>
<body>
<main>
    <div class="container mb-5">
        <!-- Hero Banner -->
        <div class="row align-items-center bg-white rounded-4 shadow-sm p-4 mb-5 border-start border-5 border-danger mx-0">
            <div class="col-md-7">
                <h2 class="fw-bold mb-3">Đói bụng? Đặt món ngay!</h2>
                <p class="text-muted fs-5 mb-4">Giao hàng siêu tốc tận nơi với hàng ngàn món ngon đang chờ bạn.</p>
                <div class="d-flex gap-2">
                    <button class="btn btn-danger px-4 py-2">Khám phá ngay</button>
                    <button class="btn btn-outline-danger px-4 py-2">Xem khuyến mãi</button>
                </div>
            </div>
            <div class="col-md-5 text-center d-none d-md-block">
                <img src="https://via.placeholder.com/400x250?text=Food+Banner" alt="Banner" class="img-fluid rounded-3">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0"><i class="bi bi-star-fill text-warning me-2"></i>Nhà hàng nổi bật</h4>
            <div class="btn-group">
                <button class="btn btn-sm btn-outline-secondary">Gần tôi</button>
                <button class="btn btn-sm btn-outline-secondary">Đánh giá cao</button>
            </div>
        </div>

        <div id="loading" class="text-center my-5">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
        </div>
        
        <div class="row g-4 d-none" id="restaurantList">
            <!-- Render từ JS -->
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            window.location.href = '/index.html';
        }

        async function loadRestaurants() {
            try {
                const res = await fetch('/api/customer/restaurants', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.status === 401) {
                    window.location.href = '/index.html';
                    return;
                }

                const data = await res.json();
                document.getElementById('loading').classList.add('d-none');
                
                const listEl = document.getElementById('restaurantList');
                listEl.classList.remove('d-none');

                if (data.length === 0) {
                    listEl.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1 d-block mb-3"></i>Chưa có nhà hàng nào trên hệ thống.</div>';
                    return;
                }

                data.forEach(r => {
                    const card = `
                    <div class="col-md-4 col-sm-6">
                        <div class="card h-100 restaurant-card" style="cursor:pointer;" onclick="location.href='/customer/detail?id=${r.id}'">
                            <img src="${r.imageUrl || 'https://via.placeholder.com/400x200'}" class="card-img-top" alt="${r.name}" style="height: 180px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title fw-bold text-truncate" title="${r.name}">${r.name}</h5>
                                <p class="card-text text-muted small mb-2"><i class="bi bi-geo-alt-fill me-1 text-danger"></i>${r.address}</p>
                                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                                    <span class="badge bg-warning text-dark"><i class="bi bi-star-fill me-1"></i>${r.rating ? r.rating : 'Mới'}</span>
                                    <span class="text-success small fw-bold"><i class="bi bi-clock me-1"></i>15-20 phút</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                    listEl.insertAdjacentHTML('beforeend', card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = '<span class="text-danger">Lỗi kết nối máy chủ!</span>';
            }
        }

        loadRestaurants();
    </script>
</main>
</body>
</html>
