<script>
(function () {
    window.updateGlobalCartBadge = function() {
        try {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('fd_cart_')) {
                    try { 
                        const cartData = JSON.parse(localStorage.getItem(k));
                        if (cartData) {
                            const cartItems = Array.isArray(cartData) ? cartData : Object.values(cartData);
                            cartItems.forEach(it => {
                                if (it && typeof it === 'object') {
                                    total += parseInt(it.qty || it.quantity || 0, 10) || 0;
                                }
                            });
                        }
                    } catch (e) {
                        console.error("Cart badge error:", e);
                    }
                }
            }
            const badge = document.getElementById('cartBadge');
            if (badge) {
                if (total > 0) { 
                    badge.textContent = total > 99 ? '99+' : total; 
                    badge.classList.remove('d-none'); 
                    badge.style.display = 'block';
                    // Trigger animation
                    badge.classList.remove('badge-bounce');
                    void badge.offsetWidth; // trigger reflow
                    badge.classList.add('badge-bounce');
                } else {
                    badge.classList.add('d-none');
                }
            }
        } catch(e) { console.error('Global badge error', e); }
    }

    function applyUserInfo(username) {
        if (!username) return;
        const initial = username.charAt(0).toUpperCase();
        const avatar = document.getElementById('navAvatarCircle');
        const nameLabel = document.getElementById('navUserName');
        const dropName = document.getElementById('navDropdownName');
        if (avatar) avatar.textContent = initial;
        if (nameLabel) nameLabel.textContent = username;
        if (dropName) dropName.textContent = username;
    }

    function updateNavUser() {
        const token = localStorage.getItem('jwt_token');
        const username = localStorage.getItem('username');
        if (username) {
            applyUserInfo(username);
        } else if (token) {
            fetch('/api/profile/me', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    if (d) {
                        const name = d.fullName || d.username;
                        localStorage.setItem('username', name);
                        applyUserInfo(name);
                    }
                }).catch(() => {});
        }
    }

    window.navSearch = function () {
        const q = document.getElementById('navSearchInput')?.value.trim();
        if (q) window.location.href = '/customer/home?search=' + encodeURIComponent(q);
    };



    document.addEventListener('DOMContentLoaded', () => {
        window.updateGlobalCartBadge();
        updateNavUser();
        
        // Change navbar on scroll
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('customerNavbar');
            if (window.scrollY > 20) {
                nav.style.padding = '8px 0';
                nav.style.boxShadow = '0 10px 30px rgba(0,0,0,0.05)';
            } else {
                nav.style.padding = '12px 0';
                nav.style.boxShadow = 'none';
            }
        });

        // Set active state for navbar icons
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-action-btn').forEach(btn => {
            const href = btn.getAttribute('href');
            // Check if current URL matches the href
            if (href && href !== '#' && currentPath.startsWith(href)) {
                btn.classList.add('active');
                if (btn.style.color === 'rgb(255, 51, 102)' || btn.style.color === '#ff3366') {
                    btn.style.color = ''; // let CSS handle color when active
                }
                btn.style.animation = 'none'; // stop pulse if active
            }
        });
    });
    window.addEventListener('storage', window.updateGlobalCartBadge);
})();
</script>
