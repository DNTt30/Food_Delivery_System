<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar(role)" class="bg-dark text-white p-3 vh-100 position-fixed" style="width: 250px; left: 0; top: 0; z-index: 1000; overflow-y: auto;">
    <div class="text-center mb-3 mt-2">
        <h4 class="text-warning fw-bold"><i class="bi bi-bicycle"></i> Food Portal</h4>
        <p class="text-muted small mb-0 text-uppercase" th:text="${role}">Role</p>
    </div>

    <!-- Notification Bell (Restaurant / Driver / Admin) -->
    <div class="d-flex align-items-center justify-content-between px-1 mb-2"
         style="background:rgba(255,255,255,.07);border-radius:10px;padding:6px 10px!important;">
        <span class="small text-muted">Thông báo</span>
        <!-- Bell widget sẽ render inline, dropdown mở sang phải -->
        <div th:replace="~{fragments/notification_bell :: bell}"
             style="--notif-dropdown-right:auto;--notif-dropdown-left:0;"></div>
    </div>

    <hr class="border-secondary mt-1">

    <!-- Restaurant Navigation -->
    <ul class="nav nav-pills flex-column mb-auto" th:if="${role == 'restaurant'}">
        <li class="nav-item mb-1">
            <a href="/restaurant/dashboard" class="nav-link text-white sidebar-link">
                <i class="bi bi-speedometer2 me-2"></i>Tổng quan
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/restaurant/orders" class="nav-link text-white sidebar-link">
                <i class="bi bi-receipt me-2"></i>Đơn hàng
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/restaurant/menu" class="nav-link text-white sidebar-link">
                <i class="bi bi-card-list me-2"></i>Thực đơn
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/restaurant/vouchers" class="nav-link text-white sidebar-link">
                <i class="bi bi-tag-fill me-2"></i>Khuyến mãi
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/restaurant/reviews" class="nav-link text-white sidebar-link">
                <i class="bi bi-star-fill me-2"></i>Đánh giá
            </a>
        </li>
    </ul>

    <!-- Driver Navigation -->
    <ul class="nav nav-pills flex-column mb-auto" th:if="${role == 'driver'}">
        <li class="nav-item mb-1">
            <a href="/driver/dashboard" class="nav-link text-white sidebar-link">
                <i class="bi bi-speedometer2 me-2"></i>Bảng điều khiển
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/driver/new_orders" class="nav-link text-white sidebar-link">
                <i class="bi bi-inbox me-2"></i>Nhận đơn mới
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/driver/delivering" class="nav-link text-white sidebar-link">
                <i class="bi bi-geo-alt me-2"></i>Đơn đang giao
            </a>
        </li>
    </ul>

    <!-- Admin Navigation -->
    <ul class="nav nav-pills flex-column mb-auto" th:if="${role == 'admin'}">
        <li class="nav-item mb-1">
            <a href="/admin/dashboard" class="nav-link text-white sidebar-link">
                <i class="bi bi-bar-chart me-2"></i>Tổng quan
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/admin/partners" class="nav-link text-white sidebar-link">
                <i class="bi bi-people me-2"></i>Người dùng & NR
            </a>
        </li>
        <li class="nav-item mb-1">
            <a href="/admin/promotions" class="nav-link text-white sidebar-link">
                <i class="bi bi-tag me-2"></i>Khuyến mãi
            </a>
        </li>
    </ul>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            document.querySelectorAll('.sidebar-link').forEach(function(link) {
                const href = link.getAttribute('href');
                const isActive = href === path || (href !== '/admin/dashboard' && href !== '/driver/dashboard' && href !== '/restaurant/dashboard' && path.startsWith(href));
                if (isActive || href === path) {
                    link.classList.add('active');
                    if (path.startsWith('/restaurant')) {
                        link.classList.add('bg-warning', 'text-dark');
                        link.classList.remove('text-white');
                    } else if (path.startsWith('/admin')) {
                        link.classList.add('bg-danger');
                    } else {
                        link.classList.add('bg-primary');
                    }
                }
            });
        });
    </script>

    <hr class="border-secondary mt-auto">
    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
           id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <strong id="sidebarUsername">Tài khoản</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
            <li><a class="dropdown-item" href="/common/profile"><i class="bi bi-person me-2"></i>Hồ sơ cá nhân</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger"
                        onclick="localStorage.removeItem('jwt_token');localStorage.removeItem('role');localStorage.removeItem('username');window.location.href='/';">
                <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button></li>
        </ul>
    </div>

    <script>
        const _u = localStorage.getItem('username');
        if (_u) document.getElementById('sidebarUsername').textContent = _u;
    </script>
</div>
</html>
