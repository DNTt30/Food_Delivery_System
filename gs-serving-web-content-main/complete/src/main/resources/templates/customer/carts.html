<!DOCTYPE html>
<html th:replace="~{layouts/customer_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Danh sách Giỏ hàng - FoodDelivery</title>
</head>
<body>
<main>
<div class="container py-4" style="max-width: 800px;">
    <h3 class="fw-bold mb-4"><i class="bi bi-bag-check-fill text-danger me-2"></i>Giỏ hàng của bạn</h3>
    
    <div id="cartsList" class="row g-3">
        <!-- Carts will be rendered here -->
    </div>

    <div id="emptyCarts" class="text-center py-5 d-none">
        <div class="mb-4">
            <img src="https://cdn-icons-png.flaticon.com/512/2748/2748614.png" style="width: 120px; opacity: 0.5;" alt="Empty cart">
        </div>
        <h4 class="fw-bold text-secondary">Bạn chưa có đơn hàng nào trong giỏ</h4>
        <p class="text-muted mb-4">Hãy khám phá các nhà hàng và chọn món ăn yêu thích nhé!</p>
        <a href="/customer/home" class="btn btn-danger rounded-pill px-5 fw-bold">Khám phá ngay</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadCarts();
    });

    function loadCarts() {
        const listEl = document.getElementById('cartsList');
        const emptyEl = document.getElementById('emptyCarts');
        let hasItems = false;
        let html = '';

        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('fd_cart_')) {
                const restId = k.replace('fd_cart_', '');
                try {
                    const cartData = JSON.parse(localStorage.getItem(k));
                    if (!cartData) continue;
                    
                    const c = Array.isArray(cartData) ? cartData : Object.values(cartData);
                    const restInfo = JSON.parse(localStorage.getItem('fd_restaurant_' + restId)) || { name: 'Nhà hàng' };
                    
                    // Hỗ trợ cả hai key "qty" và "quantity" phòng trường hợp dữ liệu cũ
                    const qty = c.reduce((s, it) => s + (it.qty || it.quantity || 0), 0);
                    const total = c.reduce((s, it) => s + ((it.price || 0) * (it.qty || it.quantity || 0)), 0);
                    
                    if (qty > 0) {
                        hasItems = true;
                        html += `
                            <div class="col-12">
                                <div class="card border-0 shadow-sm rounded-4 mb-2" style="cursor: pointer; transition: transform 0.2s;" onclick="location.href='/customer/cart?restaurantId=${restId}'">
                                    <div class="card-body p-4 d-flex justify-content-between align-items-center">
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-flex justify-content-center align-items-center" style="width: 50px; height: 50px;">
                                                <i class="bi bi-shop fs-4"></i>
                                            </div>
                                            <div>
                                                <h5 class="fw-bold mb-1">${restInfo.name}</h5>
                                                <p class="text-muted small mb-0">${qty} món đã chọn</p>
                                            </div>
                                        </div>
                                        <div class="text-end">
                                            <h5 class="text-danger fw-bold mb-1">${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(total)}</h5>
                                            <span class="text-primary small fw-semibold">Thanh toán <i class="bi bi-arrow-right"></i></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } catch (e) {}
            }
        }

        if (!hasItems) {
            emptyEl.classList.remove('d-none');
            listEl.innerHTML = '';
        } else {
            emptyEl.classList.add('d-none');
            listEl.innerHTML = html;
        }
    }
</script>

<style>
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
</style>
</main>
</body>
</html>
