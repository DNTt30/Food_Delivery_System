<!DOCTYPE html>
<html th:replace="~{layouts/dashboard_layout :: layout(~{::title}, 'restaurant', ~{::main})}">
<head>
    <title>Restaurant - Quản lý Thực đơn</title>
</head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Quản lý Thực đơn</h3>
        <button class="btn btn-warning fw-bold" onclick="openAddModal()">
            <i class="bi bi-plus-lg me-1"></i> Thêm Món
        </button>
    </div>
    
    <div id="loading" class="text-center my-4">
        <div class="spinner-border text-warning" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>

    <div class="card shadow-sm border-0 d-none" id="menuCard">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 80px;" class="ps-4">Ảnh</th>
                        <th>Tên món</th>
                        <th>Mô tả</th>
                        <th>Giá</th>
                        <th>Tình trạng</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="menuTableBody">
                    <!-- Menu items render here -->
                </tbody>
            </table>
        </div>
    </div>

<!-- Modal Thêm/Sửa Món -->
<div class="modal fade" id="menuModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold" id="modalTitle">Cập nhật món ăn</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="menuForm">
            <input type="hidden" id="itemId">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên món <span class="text-danger">*</span></label>
                <input type="text" id="itemName" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mô tả</label>
                <textarea id="itemDesc" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Giá tiền (VNĐ) <span class="text-danger">*</span></label>
                <input type="number" id="itemPrice" class="form-control" required min="0">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Ảnh món ăn</label>
                <div class="d-flex align-items-center gap-3 mb-2">
                    <img id="imagePreview" src="https://via.placeholder.com/80" class="rounded-3 border" style="width: 80px; height: 80px; object-fit: cover;">
                    <div class="flex-grow-1">
                        <input type="file" id="fileInput" class="form-control form-control-sm mb-1" accept="image/*" onchange="handleFileUpload(this)">
                        <small class="text-muted" style="font-size: 0.75rem;">Dung lượng tối đa 5MB (.jpg, .png)</small>
                    </div>
                </div>
                <input type="text" id="itemImage" class="form-control form-control-sm" placeholder="Hoặc nhập URL ảnh: https://...">
                <div id="uploadStatus" class="small mt-1 d-none"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Trạng thái</label>
                <select id="itemStatus" class="form-select">
                    <option value="true">Còn hàng</option>
                    <option value="false">Hết hàng / Ẩn</option>
                </select>
            </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-warning fw-bold px-4" onclick="saveMenuItem()">Lưu lại</button>
      </div>
    </div>
  </div>
</div>

<script>
    let menuModal = null;
    document.addEventListener("DOMContentLoaded", () => {
        menuModal = new bootstrap.Modal(document.getElementById('menuModal'));
        loadMenu();
    });

    async function loadMenu() {
        try {
            const res = await fetch('/api/restaurant/menu', {
                headers: { 'Authorization': 'Bearer ' + globalToken }
            });
            if (res.status === 401) return globalLogout();
            
            const items = await res.json();
            const tbody = document.getElementById('menuTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Chưa có món ăn nào trong thực đơn.</td></tr>';
            } else {
                items.forEach(item => {
                    const statusBadge = item.isAvailable 
                        ? '<span class="badge bg-success bg-opacity-10 text-success px-3">Còn hàng</span>' 
                        : '<span class="badge bg-secondary bg-opacity-10 text-secondary px-3">Hết hàng</span>';
                    
                    const tr = `
                    <tr>
                        <td class="ps-4"><img src="${item.imageUrl || 'https://via.placeholder.com/80'}" class="rounded-3" style="width: 60px; height: 60px; object-fit: cover;"></td>
                        <td class="fw-bold text-dark">${item.name}</td>
                        <td class="text-muted small text-truncate" style="max-width: 200px;" title="${item.description || ''}">${item.description || ''}</td>
                        <td class="fw-bold">${formatGlobalCurrency(item.price)}</td>
                        <td>${statusBadge}</td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-light" onclick='openEditModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'><i class="bi bi-pencil"></i> Sửa</button>
                            <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteMenuItem(${item.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', tr);
                });
            }

            document.getElementById('loading').classList.add('d-none');
            document.getElementById('menuCard').classList.remove('d-none');
        } catch (err) {
            console.error(err);
            alert("Lỗi khi tải thực đơn!");
        }
    }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = "Thêm Món Mới";
        document.getElementById('menuForm').reset();
        document.getElementById('itemId').value = '';
        document.getElementById('itemStatus').value = "true";
        document.getElementById('imagePreview').src = "https://via.placeholder.com/80";
        document.getElementById('uploadStatus').classList.add('d-none');
        menuModal.show();
    }

    function openEditModal(item) {
        document.getElementById('modalTitle').textContent = "Sửa Món Ăn";
        document.getElementById('itemId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemDesc').value = item.description || '';
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemImage').value = item.imageUrl || '';
        document.getElementById('imagePreview').src = item.imageUrl || 'https://via.placeholder.com/80';
        document.getElementById('itemStatus').value = item.isAvailable ? "true" : "false";
        document.getElementById('uploadStatus').classList.add('d-none');
        menuModal.show();
    }

    async function handleFileUpload(input) {
        const file = input.files[0];
        if (!file) return;

        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.classList.remove('d-none');
        statusDiv.className = 'small mt-1 text-primary';
        statusDiv.textContent = '⏳ Đang tải lên...';

        const formData = new FormData();
        formData.append('file', file);

        try {
            const res = await fetch('/api/upload/image', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + globalToken },
                body: formData
            });

            const result = await res.json();
            if (res.ok) {
                document.getElementById('itemImage').value = result.url;
                document.getElementById('imagePreview').src = result.url;
                statusDiv.className = 'small mt-1 text-success';
                statusDiv.textContent = '✅ Tải lên thành công!';
            } else {
                statusDiv.className = 'small mt-1 text-danger';
                statusDiv.textContent = '❌ Lỗi: ' + (result.error || 'Không rõ lỗi');
            }
        } catch (err) {
            console.error(err);
            statusDiv.className = 'small mt-1 text-danger';
            statusDiv.textContent = '❌ Lỗi kết nối server!';
        }
    }

    async function saveMenuItem() {
        const id = document.getElementById('itemId').value;
        const name = document.getElementById('itemName').value.trim();
        const price = document.getElementById('itemPrice').value;

        if (!name || !price) {
            return alert("Vui lòng nhập Tên món và Giá tiền!");
        }

        const data = {
            name: name,
            description: document.getElementById('itemDesc').value.trim(),
            price: parseFloat(price),
            imageUrl: document.getElementById('itemImage').value.trim(),
            isAvailable: document.getElementById('itemStatus').value === "true"
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/restaurant/menu/${id}` : '/api/restaurant/menu';

        try {
            const res = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': 'Bearer ' + globalToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                menuModal.hide();
                loadMenu(); // Reload danh sách
            } else {
                alert("Lưu thất bại!");
            }
        } catch (err) {
            console.error(err);
            alert("Lỗi kết nối!");
        }
    }

    async function deleteMenuItem(id) {
        if (!confirm("Bạn có chắc chắn muốn xóa món này?")) return;

        try {
            const res = await fetch(`/api/restaurant/menu/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + globalToken }
            });

            if (res.ok) {
                loadMenu();
            } else {
                alert("Xóa thất bại!");
            }
        } catch (err) {
            console.error(err);
        }
    }
</script>
</main>
</body>
</html>
