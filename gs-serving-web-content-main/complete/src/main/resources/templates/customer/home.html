<!DOCTYPE html>
<html th:replace="~{layouts/customer_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Khám phá Ẩm thực - FoodDelivery</title>
</head>
<body>
<main>

<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #FF4B2B 0%, #FF416C 100%);
        --glass-bg: rgba(255, 255, 255, 0.9);
        --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        --hover-shadow: 0 20px 40px rgba(255, 75, 43, 0.15);
    }

    body {
        background-color: #fcfcfd;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Hero Section Enhancement */
    .hero-section {
        background: var(--primary-gradient);
        border-radius: 32px;
        padding: 60px 40px;
        position: relative;
        overflow: hidden;
        margin-bottom: 50px;
        box-shadow: 0 20px 50px rgba(255, 75, 43, 0.2);
    }

    .hero-section::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 600px;
        height: 600px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        z-index: 0;
    }

    .hero-content {
        position: relative;
        z-index: 1;
    }

    .search-box-wrapper {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 10px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        margin-top: 30px;
        transition: transform 0.3s;
    }

    .search-box-wrapper:focus-within {
        transform: translateY(-5px);
    }

    .search-input {
        border: none !important;
        background: transparent !important;
        font-weight: 500;
        padding-left: 20px !important;
    }

    .search-input:focus {
        box-shadow: none !important;
    }

    .btn-search {
        background: var(--primary-gradient);
        border: none;
        border-radius: 14px !important;
        padding: 12px 30px !important;
        font-weight: 700;
        letter-spacing: 0.5px;
        transition: all 0.3s;
    }

    .btn-search:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(255, 75, 43, 0.3);
    }

    /* Category Icon Pills */
    .cat-pill {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        color: #4b5563;
        min-width: 80px;
    }

    .cat-icon-wrapper {
        width: 64px;
        height: 64px;
        background: white;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        box-shadow: var(--card-shadow);
        transition: all 0.3s;
    }

    .cat-pill:hover .cat-icon-wrapper {
        background: var(--primary-gradient);
        color: white;
        transform: translateY(-8px);
        box-shadow: var(--hover-shadow);
    }

    .cat-pill span {
        font-size: 0.85rem;
        font-weight: 600;
    }

    /* Restaurant Card Enhancement */
    .res-card {
        background: white;
        border-radius: 24px;
        border: none;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: var(--card-shadow);
        height: 100%;
    }

    .res-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
    }

    .res-img-wrapper {
        height: 200px;
        overflow: hidden;
        position: relative;
    }

    .res-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s;
    }

    .res-card:hover .res-img {
        transform: scale(1.1);
    }

    .res-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        backdrop-filter: blur(8px);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 0.75rem;
        font-weight: 700;
        z-index: 2;
    }

    .res-rating {
        background: rgba(255, 193, 7, 0.15);
        color: #d97706;
        padding: 4px 10px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.85rem;
    }

    .res-info-tag {
        font-size: 0.8rem;
        color: #6b7280;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    /* Animations */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-up {
        animation: fadeInUp 0.6s ease forwards;
    }

    /* Custom Scrollbar for Categories */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</style>

<div class="container py-4">

    <!-- Hero Section -->
    <div class="hero-section animate-up">
        <div class="row align-items-center">
            <div class="col-lg-7 hero-content">
                <h1 class="display-4 fw-bold text-white mb-3">Đánh thức vị giác <br> của bạn ngay! 🍕</h1>
                <p class="text-white opacity-90 fs-5 mb-0">Hàng ngàn món ăn ngon từ những nhà hàng tốt nhất đang chờ bạn khám phá.</p>
                
                <div class="search-box-wrapper d-flex align-items-center">
                    <div class="flex-grow-1 d-flex align-items-center px-2">
                        <i class="bi bi-geo-alt-fill text-danger fs-5 ms-2"></i>
                        <input type="text" id="searchInput" class="form-control search-input fs-6" 
                               placeholder="Tìm món ăn, tên nhà hàng..."
                               autocomplete="off">
                    </div>
                    <button class="btn btn-primary btn-search text-white" onclick="doSearch()">
                        <i class="bi bi-search me-2"></i>Tìm kiếm
                    </button>
                </div>
            </div>
            <div class="col-lg-5 d-none d-lg-block text-center position-relative">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500&h=500&fit=crop" 
                     class="img-fluid rounded-circle shadow-lg floating-anim" 
                     style="width: 350px; height: 350px; border: 10px solid rgba(255,255,255,0.2);" alt="Hero Food">
            </div>
        </div>
    </div>

    <!-- Top Selling Items -->
    <div class="mb-5">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <h4 class="fw-bold mb-0">🔥 Top các món bán chạy</h4>
            <a href="/customer/feed" class="text-danger fw-bold text-decoration-none small">Khám phá ngay <i class="bi bi-arrow-right"></i></a>
        </div>
        <div class="d-flex gap-3 overflow-auto pb-3 no-scrollbar" id="topItemsList">
            <!-- Loading Skeleton for Top Items -->
            <div class="skeleton" style="min-width: 160px; height: 180px; border-radius: 16px;"></div>
            <div class="skeleton" style="min-width: 160px; height: 180px; border-radius: 16px;"></div>
            <div class="skeleton" style="min-width: 160px; height: 180px; border-radius: 16px;"></div>
            <div class="skeleton" style="min-width: 160px; height: 180px; border-radius: 16px;"></div>
            <div class="skeleton" style="min-width: 160px; height: 180px; border-radius: 16px;"></div>
        </div>
    </div>

    <!-- Section Header & Filters -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0" id="resultTitle">Nhà hàng tiêu biểu</h4>
        <div class="d-flex gap-3 align-items-center">
            <small class="text-muted fw-semibold" id="resultCount"></small>
            <select class="form-select border-0 bg-white shadow-sm rounded-pill px-4" 
                    style="width: auto; min-width: 180px;" 
                    onchange="sortRestaurants(this.value)">
                <option value="default">Sắp xếp: Mặc định</option>
                <option value="rating">Sắp xếp: Đánh giá cao</option>
                <option value="name">Sắp xếp: Tên A-Z</option>
                <option value="open">Sắp xếp: Đang mở cửa</option>
            </select>
        </div>
    </div>

    <!-- Loading Skeleton -->
    <div id="loading" class="row g-4">
        <div class="col-md-4" th:each="i : ${#numbers.sequence(1,6)}">
            <div class="card h-100 border-0 rounded-4 shadow-sm overflow-hidden">
                <div class="skeleton" style="height:200px;"></div>
                <div class="card-body p-4">
                    <div class="skeleton mb-3" style="height:24px; width:80%;"></div>
                    <div class="skeleton mb-2" style="height:16px; width:60%;"></div>
                    <div class="d-flex justify-content-between mt-3">
                        <div class="skeleton" style="height:20px; width:30%;"></div>
                        <div class="skeleton" style="height:20px; width:30%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Restaurant Grid -->
    <div class="row g-4 d-none" id="restaurantList"></div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-5 d-none">
        <div class="mb-4">
            <img src="https://cdn-icons-png.flaticon.com/512/7486/7486744.png" style="width: 120px; opacity: 0.5;" alt="No results">
        </div>
        <h4 class="fw-bold text-secondary">Rất tiếc, không tìm thấy nhà hàng nào</h4>
        <p class="text-muted mb-4">Bạn thử thay đổi từ khóa hoặc bộ lọc xem sao nhé.</p>
        <button class="btn btn-danger rounded-pill px-5 fw-bold" onclick="clearSearch()">Xem tất cả nhà hàng</button>
    </div>

    <!-- Removed floating Food TikTok button to move to global navbar -->

</div>

<script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/common/auth';

    let allRestaurants = [];
    let currentFilter = 'all';

    async function loadRestaurants(searchQuery = '') {
        const loading = document.getElementById('loading');
        const listEl = document.getElementById('restaurantList');
        const empty = document.getElementById('emptyState');

        loading.classList.remove('d-none');
        listEl.classList.add('d-none');
        empty.classList.add('d-none');

        try {
            const url = searchQuery
                ? `/api/customer/restaurants?search=${encodeURIComponent(searchQuery)}`
                : '/api/customer/restaurants';

            const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.status === 401) { window.location.href = '/common/auth'; return; }

            allRestaurants = await res.json();
            loading.classList.add('d-none');
            renderRestaurants(allRestaurants);

            const titleEl = document.getElementById('resultTitle');
            if (searchQuery) {
                titleEl.innerHTML = `Kết quả cho "<span class="text-danger">${searchQuery}</span>"`;
            } else {
                titleEl.textContent = 'Nhà hàng tiêu biểu';
            }
        } catch (err) {
            loading.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-cloud-slash display-1 text-muted d-block mb-3"></i>
                    <h5 class="text-muted">Không thể kết nối với máy chủ</h5>
                </div>`;
        }
    }

    function renderRestaurants(restaurants) {
        const listEl = document.getElementById('restaurantList');
        const empty = document.getElementById('emptyState');
        const countEl = document.getElementById('resultCount');
        
        listEl.innerHTML = '';

        if (!restaurants.length) {
            listEl.classList.add('d-none');
            empty.classList.remove('d-none');
            countEl.textContent = '';
            return;
        }

        empty.classList.add('d-none');
        countEl.textContent = `(${restaurants.length} địa điểm)`;
        listEl.classList.remove('d-none');

        restaurants.forEach((r, idx) => {
            const reviewCount = r.reviewCount || 0;
            const ratingHtml = r.rating 
                ? `<span class="res-rating"><i class="bi bi-star-fill me-1"></i>${r.rating.toFixed(1)}</span>`
                : `<span class="res-rating"><i class="bi bi-star me-1"></i>Mới</span>`;
            
            const statusHtml = r.isOpen
                ? `<span class="res-badge bg-success"><i class="bi bi-lightning-fill me-1"></i>Đang mở</span>`
                : `<span class="res-badge bg-secondary">Đã đóng cửa</span>`;

            const imgSrc = r.imageUrl || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&h=300&fit=crop';

            const card = `
            <div class="col-lg-4 col-md-6" style="animation-delay: ${idx * 0.05}s">
                <div class="card res-card border-0" onclick="location.href='/customer/detail?id=${r.id}'">
                    <div class="res-img-wrapper">
                        <img src="${imgSrc}" class="res-img" alt="${r.name}" 
                             onerror="this.src='https://images.unsplash.com/photo-1552566626-52f8b828add9?w=500&h=300&fit=crop'">
                        ${statusHtml}
                    </div>
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold mb-0 text-truncate" style="max-width: 70%;">${r.name}</h5>
                            ${ratingHtml}
                        </div>
                        <div class="res-info-tag mb-3">
                            <i class="bi bi-geo-alt-fill text-danger"></i> 
                            <span class="text-truncate">${r.address}</span>
                        </div>
                        <hr class="opacity-10 my-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="res-info-tag fw-semibold text-dark">
                                <i class="bi bi-bicycle text-success fs-5"></i> 15-25 phút
                            </div>
                            <div class="small text-muted fw-medium">${reviewCount} đánh giá</div>
                        </div>
                    </div>
                </div>
            </div>`;
            listEl.insertAdjacentHTML('beforeend', card);
        });
    }

    function doSearch() {
        const q = document.getElementById('searchInput').value.trim();
        loadRestaurants(q);
        // Reset category pills visually
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        loadRestaurants();
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    }

    function doCategorySearch(keyword, el) {
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        if (el) el.classList.add('active');
        
        document.getElementById('searchInput').value = keyword;
        loadRestaurants(keyword);
    }

    function filterRestaurants(filter, el) {
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        if (el) el.classList.add('active');

        let filtered = [...allRestaurants];
        if (filter === 'open') filtered = filtered.filter(r => r.isOpen);
        renderRestaurants(filtered);
    }

    async function loadTopItems() {
        const topItemsContainer = document.getElementById('topItemsList');
        if(!topItemsContainer) return;
        try {
            const res = await fetch('/api/customer/top-items', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) {
                const items = await res.json();
                topItemsContainer.innerHTML = '';
                items.forEach(item => {
                    const priceFmt = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.price);
                    const img = item.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&h=300&fit=crop';
                    const card = `
                        <div class="card border-0 shadow-sm position-relative" style="min-width: 160px; max-width: 160px; cursor: pointer; border-radius: 16px; overflow: hidden; flex-shrink: 0;" onclick="location.href='/customer/detail?id=${item.restaurantId}'">
                            <span class="badge bg-danger rounded-pill position-absolute" style="top: 8px; right: 8px; font-size: 0.65rem; font-weight: 600;">Đã bán ${item.soldCount || 0}</span>
                            <img src="${img}" class="card-img-top" style="height: 120px; object-fit: cover;" alt="${item.name}">
                            <div class="card-body p-2">
                                <h6 class="text-truncate fw-bold mb-1" style="font-size: 0.9rem;">${item.name}</h6>
                                <p class="text-danger fw-bold mb-0" style="font-size: 0.85rem;">${priceFmt}</p>
                                <small class="text-muted text-truncate d-block" style="font-size: 0.75rem;"><i class="bi bi-shop me-1"></i>${item.restaurantName}</small>
                            </div>
                        </div>
                    `;
                    topItemsContainer.insertAdjacentHTML('beforeend', card);
                });
            }
        } catch(e) {
            console.log("Error loading top items:", e);
        }
    }

    // Init
    loadRestaurants();
    loadTopItems();

    function sortRestaurants(sortBy) {
        let sorted = [...allRestaurants];
        if (sortBy === 'rating') sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        else if (sortBy === 'name') sorted.sort((a, b) => a.name.localeCompare(b.name));
        else if (sortBy === 'open') sorted.sort((a, b) => (b.isOpen ? 1 : 0) - (a.isOpen ? 1 : 0));
        renderRestaurants(sorted);
    }

    document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
    });

    loadRestaurants();
</script>

<style>
    /* Skeleton Shimmer Effect */
    .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 12px;
    }
    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
    @keyframes floating {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }
    .floating-anim {
        animation: floating 4s ease-in-out infinite;
    }
</style>

</main>
</body>
</html>
