<!DOCTYPE html>
<html th:replace="~{layouts/customer_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Customer - Chi tiết Nhà hàng</title>
</head>
<body>
<main>
<div class="container" style="max-width: 900px;">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/customer/home" class="text-decoration-none text-danger">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page" id="breadcrumbName">Chi tiết</li>
        </ol>
    </nav>
    
    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <div id="restaurantInfo" class="d-none">
        <!-- Banner/Header Info -->
        <div class="card shadow-sm border-0 mb-4 bg-white overflow-hidden">
            <div style="height: 200px; background-color: #f8f9fa; background-image: url('https://via.placeholder.com/900x300'); background-size: cover; background-position: center;"></div>
            <div class="card-body p-4 position-relative">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h2 class="fw-bold mb-2" id="resName">Tên Nhà Hàng</h2>
                        <p class="text-muted mb-2"><i class="bi bi-geo-alt-fill text-danger me-1"></i><span id="resAddress">Địa chỉ</span></p>
                        <div class="d-flex gap-3 align-items-center mt-3">
                            <span class="badge bg-warning text-dark fs-6 rounded-pill px-3 py-2" id="resRating"><i class="bi bi-star-fill me-1"></i>0.0</span>
                            <span class="badge bg-success fs-6 rounded-pill px-3 py-2" id="resStatus">Mở cửa</span>
                            <span class="text-muted small"><i class="bi bi-clock me-1"></i>Giao trong 20 phút</span>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-outline-danger rounded-circle p-2" title="Yêu thích"><i class="bi bi-heart fs-5"></i></button>
                    </div>
                </div>
            </div>
        </div>
        
        <h4 class="mb-3 fw-bold">Thực đơn nổi bật</h4>
        <div class="row g-3" id="menuList">
            <!-- Menu items rendered here -->
        </div>
    </div>
</div>

<!-- Modal Thêm vào giỏ hàng -->
<div class="modal fade" id="addToCartModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="modalItemName">Tên Món Ăn</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-center mb-3">
            <h4 class="text-danger mb-0 fw-bold" id="modalItemPrice">0 đ</h4>
        </div>
        <p class="text-muted" id="modalItemDesc">Mô tả món ăn</p>
        
        <div class="bg-light p-3 rounded-3 mt-4">
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-semibold">Số lượng</span>
                <div class="input-group" style="width: 120px;">
                    <button class="btn btn-outline-secondary" type="button" onclick="changeQty(-1)">-</button>
                    <input type="text" class="form-control text-center" id="modalItemQuantity" value="1" readonly>
                    <button class="btn btn-outline-secondary" type="button" onclick="changeQty(1)">+</button>
                </div>
            </div>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-danger w-100 py-2 fs-5 fw-bold" onclick="addToCart()">Thêm vào giỏ</button>
      </div>
    </div>
  </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const restaurantId = urlParams.get('id');
    let currentSelectedItem = null;
    let addToCartModal = null;

    document.addEventListener("DOMContentLoaded", () => {
        addToCartModal = new bootstrap.Modal(document.getElementById('addToCartModal'));
        if (!restaurantId) {
            window.location.href = '/customer/home';
        } else {
            loadRestaurantDetail();
        }
    });

    function changeQty(delta) {
        let input = document.getElementById('modalItemQuantity');
        let val = parseInt(input.value) + delta;
        if (val >= 1) input.value = val;
    }

    async function loadRestaurantDetail() {
        try {
            const res = await fetch(`/api/customer/restaurants/${restaurantId}`, {
                headers: { 'Authorization': 'Bearer ' + globalToken }
            });

            if (res.status === 401) return window.location.href = '/index.html';
            if (res.status === 404) return window.location.href = '/customer/home';

            const data = await res.json();
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('restaurantInfo').classList.remove('d-none');

            document.getElementById('resName').textContent = data.name;
            document.getElementById('breadcrumbName').textContent = data.name;
            document.getElementById('resAddress').textContent = data.address;
            document.getElementById('resRating').innerHTML = `<i class="bi bi-star-fill me-1"></i>${data.rating ? data.rating : 'Mới'}`;
            
            const statusEl = document.getElementById('resStatus');
            if (data.isOpen) {
                statusEl.textContent = 'Đang mở cửa';
                statusEl.className = 'badge bg-success fs-6 rounded-pill px-3 py-2';
            } else {
                statusEl.textContent = 'Đóng cửa';
                statusEl.className = 'badge bg-secondary fs-6 rounded-pill px-3 py-2';
            }

            const listEl = document.getElementById('menuList');
            listEl.innerHTML = '';
            
            if (!data.menuItems || data.menuItems.length === 0) {
                listEl.innerHTML = '<div class="col-12 text-center text-muted py-5 border rounded bg-light">Nhà hàng chưa có món ăn nào.</div>';
                return;
            }

            data.menuItems.forEach(item => {
                const card = `
                <div class="col-md-6">
                    <div class="card h-100 shadow-sm border-0 d-flex flex-row overflow-hidden p-2">
                        <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" alt="${item.name}" class="rounded-3" style="width: 110px; height: 110px; object-fit: cover;">
                        <div class="card-body py-1 pe-1 ps-3 d-flex flex-column">
                            <h6 class="card-title mb-1 fw-bold">${item.name}</h6>
                            <p class="card-text text-muted small mb-2 text-truncate" style="max-width: 200px;" title="${item.description || ''}">${item.description || 'Chưa có mô tả'}</p>
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <span class="text-danger fw-bold">${formatGlobalCurrency(item.price)}</span>
                                <button class="btn btn-sm btn-outline-danger px-3 rounded-pill" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                                    <i class="bi bi-plus-lg"></i> Thêm
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                listEl.insertAdjacentHTML('beforeend', card);
            });

        } catch (err) {
            console.error(err);
        }
    }

    function openModal(item) {
        currentSelectedItem = item;
        document.getElementById('modalItemName').textContent = item.name;
        document.getElementById('modalItemPrice').textContent = formatGlobalCurrency(item.price);
        document.getElementById('modalItemDesc').textContent = item.description || 'Không có mô tả';
        document.getElementById('modalItemQuantity').value = 1;
        addToCartModal.show();
    }

    function addToCart() {
        const qty = parseInt(document.getElementById('modalItemQuantity').value);
        alert(`Đã thêm ${qty} phần ${currentSelectedItem.name} vào giỏ hàng!`);
        addToCartModal.hide();
    }
</script>
</main>
</body>
</html>
