<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/dashboard_layout :: layout(~{::title}, 'admin', ~{::main})}">
<head>
    <title>Hồ Sơ Quản Trị Viên | Food Portal</title>
</head>
<body>
    <main>
        <style>
            .prof-toast {
                position: fixed; bottom: 24px; right: 24px; z-index: 9999;
                padding: 12px 20px; border-radius: 12px;
                font-size: .85rem; font-weight: 600; color: #fff;
                box-shadow: 0 8px 24px rgba(0,0,0,.2);
                animation: su .3s ease;
            }
            .prof-toast.success { background: #16a34a; }
            .prof-toast.danger  { background: #dc2626; }
            .prof-toast.info    { background: #1e293b; }
            @keyframes su { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        </style>

        <div class="container-fluid px-4 py-4">
            <div class="mb-4">
                <h4 class="fw-bold"><i class="bi bi-person-badge me-2"></i>Hồ Sơ Quản Trị Viên</h4>
                <p class="text-muted small">Quản lý thông tin tài khoản quản trị hệ thống.</p>
            </div>

            <div class="row">
                <!-- ═══ LEFT ═══ -->
                <div class="col-lg-8">

                    <!-- Thông tin cơ bản -->
                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-header bg-white py-3 border-bottom">
                            <h6 class="mb-0 fw-bold"><i class="bi bi-info-circle me-2"></i>Thông tin cơ bản</h6>
                        </div>
                        <div class="card-body p-4">
                            <form id="profileForm">
                                <div class="row g-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">HỌ VÀ TÊN</label>
                                        <input type="text" id="fullName" class="form-control rounded-3 py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">ĐỊA CHỈ EMAIL</label>
                                        <input type="email" id="email" class="form-control bg-light rounded-3 py-2" disabled>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">SỐ ĐIỆN THOẠI</label>
                                        <input type="tel" id="phone" class="form-control rounded-3 py-2" placeholder="0912 345 678">
                                    </div>
                                </div>

                                <div class="mt-4 pt-3 border-top text-end">
                                    <button type="submit" class="btn btn-primary fw-bold px-4 rounded-3 text-white">
                                        <i class="bi bi-check-lg me-1"></i>Lưu thay đổi
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Bảo mật -->
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white py-3 border-bottom">
                            <h6 class="mb-0 fw-bold"><i class="bi bi-shield-lock me-2"></i>Bảo mật tài khoản</h6>
                        </div>
                        <div class="card-body p-4">
                            <form id="passwordForm">
                                <div class="row g-4">
                                    <div class="col-12">
                                        <label class="form-label fw-bold small text-muted">MẬT KHẨU HIỆN TẠI</label>
                                        <input type="password" id="oldPassword" class="form-control rounded-3" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">MẬT KHẨU MỚI</label>
                                        <input type="password" id="newPassword" class="form-control rounded-3" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">XÁC NHẬN MẬT KHẨU</label>
                                        <input type="password" id="confirmPassword" class="form-control rounded-3" required>
                                    </div>
                                </div>
                                <div class="mt-4 pt-3 border-top text-end">
                                    <button type="submit" class="btn btn-dark fw-bold px-4 rounded-3">Cập nhật mật khẩu</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- ═══ RIGHT sidebar ═══ -->
                <div class="col-lg-4">
                    <!-- Profile card -->
                    <div class="card border-0 shadow-sm rounded-4 text-center p-4 mb-3">
                        <div class="mx-auto mb-3" style="width:100px;height:100px;background:#e2e8f0;border-radius:50%;display:flex;align-items:center;justify-content:center;">
                            <i class="bi bi-shield-shaded fs-1 text-danger"></i>
                        </div>
                        <h5 class="fw-bold" id="sidebarName">Quản Trị Viên</h5>
                        <p class="text-muted small mb-2" id="sidebarEmail">admin@example.com</p>
                        <div class="badge bg-danger text-white rounded-pill px-3 py-2">SYSTEM ADMIN</div>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            const token = localStorage.getItem('jwt_token');
            if (!token) window.location.href = '/common/auth';

            // ── Toast ──────────────────────────────────────────────
            function toast(msg, type='info') {
                const el = document.createElement('div');
                el.className = `prof-toast ${type}`;
                el.textContent = msg;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }

            // ── Load Profile ───────────────────────────────────────
            async function loadProfile() {
                try {
                    const res  = await fetch('/api/profile/me', { headers:{'Authorization':'Bearer '+token} });
                    const data = await res.json();
                    if (!res.ok) return;

                    document.getElementById('fullName').value       = data.fullName       || '';
                    document.getElementById('email').value          = data.email          || '';
                    document.getElementById('phone').value          = data.phone          || '';
                    
                    document.getElementById('sidebarName').textContent  = data.fullName || 'Quản trị viên';
                    document.getElementById('sidebarEmail').textContent = data.email || '';
                } catch(e) { console.error(e); }
            }

            // ── Save Profile ───────────────────────────────────────
            document.getElementById('profileForm').addEventListener('submit', async e => {
                e.preventDefault();
                const payload = {
                    fullName:       document.getElementById('fullName').value,
                    phone:          document.getElementById('phone').value
                };
                try {
                    const res = await fetch('/api/profile/me', {
                        method:'PUT',
                        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        toast('✅ Cập nhật thành công!','success');
                        document.getElementById('sidebarName').textContent = payload.fullName;
                    } else {
                        const d = await res.json().catch(()=>({}));
                        toast(d.error || 'Cập nhật thất bại','danger');
                    }
                } catch { toast('Lỗi kết nối','danger'); }
            });

            // ── Password ───────────────────────────────────────────
            document.getElementById('passwordForm').addEventListener('submit', async e => {
                e.preventDefault();
                const oldPw = document.getElementById('oldPassword').value;
                const newPw = document.getElementById('newPassword').value;
                if (newPw !== document.getElementById('confirmPassword').value) { toast('Mật khẩu không khớp!','danger'); return; }
                try {
                    const res = await fetch('/api/profile/password', {
                        method:'PUT',
                        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                        body: JSON.stringify({ oldPassword:oldPw, newPassword:newPw })
                    });
                    if (res.ok) { toast('✅ Đổi mật khẩu thành công!','success'); e.target.reset(); }
                    else { const d = await res.json(); toast(d.error||'Lỗi đổi mật khẩu','danger'); }
                } catch { toast('Lỗi kết nối','danger'); }
            });

            loadProfile();
        </script>
    </main>
</body>
</html>
