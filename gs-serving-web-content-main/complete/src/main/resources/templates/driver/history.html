<!DOCTYPE html>
<html th:replace="~{layouts/driver_mobile_layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Lịch sử giao hàng - Driver</title>
</head>
<body>
<main>
<style>
.page-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
}
.page-header h5 { font-size: 1.15rem; font-weight: 700; margin: 0; }
.back-btn {
    background: none; border: none; font-size: 1.2rem;
    color: #334155; padding: 0; cursor: pointer;
}
.history-card {
    background: #fff; border-radius: 14px;
    border: 1px solid #e2e8f0; padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.history-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
}
.history-date { font-size: 0.8rem; color: #64748b; font-weight: 600; }
.status-badge {
    font-size: 0.7rem; font-weight: 700; padding: 4px 8px;
    border-radius: 6px; text-transform: uppercase;
}
.status-COMPLETED { background: #dcfce7; color: #166534; }
.status-CANCELLED { background: #fee2e2; color: #991b1b; }
.history-body {
    display: flex; justify-content: space-between; align-items: flex-end;
}
.history-info p { margin: 0; font-size: 0.85rem; color: #334155; }
.history-info .shop-name { font-weight: 700; margin-bottom: 2px; font-size: 0.95rem; }
.history-info .items { font-size: 0.8rem; color: #64748b; margin-top: 4px; display: block;}
.history-earnings {
    text-align: right;
}
.history-earnings .amount {
    font-size: 1.1rem; font-weight: 800; color: #22c55e;
}
.history-earnings .label {
    font-size: 0.7rem; color: #64748b;
}
.empty-history { text-align: center; padding: 40px 0; }
.empty-history i { font-size: 3rem; color: #cbd5e1; }
.empty-history h6 { margin-top: 15px; font-weight: 600; color: #64748b; }
</style>

<div class="page-header">
    <a href="/driver/settings" class="back-btn"><i class="bi bi-arrow-left"></i></a>
    <h5>Lịch sử giao hàng</h5>
</div>

<div id="loading" class="text-center py-4">
    <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
</div>

<div id="historyList"></div>

<script>
    const token = localStorage.getItem('jwt_token');
    if (!token) window.location.href = '/common/auth';

    function formatVND(n) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n || 0); }

    function formatDate(dateString) {
        if (!dateString) return '';
        const d = new Date(dateString);
        return d.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function loadHistory() {
        try {
            const res = await fetch('/api/driver/history', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            document.getElementById('loading').style.display = 'none';
            if (res.ok) {
                const orders = await res.json();
                // Filter only completed or cancelled
                const historyOrders = orders.filter(o => o.status === 'COMPLETED' || o.status === 'CANCELLED');
                // Sort by ID descending (newest first)
                historyOrders.sort((a, b) => b.id - a.id);

                const listEl = document.getElementById('historyList');
                if (historyOrders.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-history">
                            <i class="bi bi-receipt"></i>
                            <h6>Chưa có chuyến giao nào</h6>
                        </div>`;
                    return;
                }

                listEl.innerHTML = historyOrders.map(o => {
                    const commission = o.shippingFee || 15000;
                    const isCompleted = o.status === 'COMPLETED';
                    const itemsStr = o.items && o.items.length > 0 ? o.items.join('<br>• ') : 'Không có thông tin món';
                    
                    const isCod = o.paymentMethod === 'CASH' || o.paymentMethod === 'COD' || o.paymentMethod === 'CASH_ON_DELIVERY' || o.needsCollectCash;
                    
                    let payNote = '';
                    if (o.paymentStatus === 'COMPLETED' || o.isPaidOnline) {
                        payNote = '<span class="badge bg-success bg-opacity-10 text-success ms-1">Đã TT</span>';
                    } else if (isCod) {
                        payNote = '<span class="badge bg-danger bg-opacity-10 text-danger ms-1">COD</span>';
                    } else {
                        payNote = '<span class="badge bg-warning bg-opacity-10 text-warning ms-1">Chưa TT</span>';
                    }
                    
                    return `
                        <div class="history-card" onclick="toggleDetails(${o.id})" style="cursor: pointer;">
                            <div class="history-header">
                                <div class="history-date">#${o.id} • ${formatDate(o.orderTime)}${payNote}</div>
                                <div class="status-badge status-${o.status}">
                                    ${isCompleted ? 'Hoàn thành' : 'Đã hủy'}
                                </div>
                            </div>
                            <div class="history-body">
                                <div class="history-info" style="flex: 1; padding-right: 10px;">
                                    <div class="shop-name"><i class="bi bi-shop text-warning me-1"></i>${o.restaurantName}</div>
                                    <p><i class="bi bi-person-check text-primary me-1"></i>${o.customerName}</p>
                                </div>
                                <div class="history-earnings">
                                    <div class="label">Thu nhập</div>
                                    <div class="amount ${!isCompleted ? 'text-muted text-decoration-line-through' : ''}">
                                        +${formatVND(commission)}
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Phần chi tiết ẩn (Accordion) -->
                            <div id="details-${o.id}" class="d-none mt-3 pt-3 border-top">
                                <div class="small mb-2">
                                    <div class="text-muted mb-1"><i class="bi bi-geo-alt text-danger me-1"></i>Lấy hàng tại:</div>
                                    <div class="fw-semibold ps-3">${o.restaurantAddress || 'Không có địa chỉ quán'}</div>
                                </div>
                                <div class="small mb-2">
                                    <div class="text-muted mb-1"><i class="bi bi-geo-alt-fill text-primary me-1"></i>Giao đến:</div>
                                    <div class="fw-semibold ps-3">${o.deliveryAddress || 'Không có địa chỉ khách'}</div>
                                </div>
                                <div class="small mb-2">
                                    <div class="text-muted mb-1"><i class="bi bi-box-seam text-secondary me-1"></i>Chi tiết món:</div>
                                    <div class="ps-3 text-secondary">• ${itemsStr}</div>
                                </div>
                                <div class="small mt-2 p-2 bg-light rounded d-flex justify-content-between">
                                    <span class="text-muted">Tổng giá trị đơn:</span>
                                    <span class="fw-bold text-dark">
                                        ${formatVND(o.totalAmount)} 
                                        <span class="small fw-normal text-muted ms-1">(${isCod ? 'Tiền mặt' : 'Online'})</span>
                                    </span>
                                </div>
                            </div>
                            
                            <div class="text-center mt-2">
                                <i id="icon-${o.id}" class="bi bi-chevron-down text-muted" style="font-size: 0.8rem;"></i>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                throw new Error('Lỗi load data');
            }
        } catch (e) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('historyList').innerHTML = `<div class="alert alert-danger">Lỗi kết nối. Vui lòng thử lại sau.</div>`;
        }
    }

    function toggleDetails(id) {
        const detailsDiv = document.getElementById('details-' + id);
        const icon = document.getElementById('icon-' + id);
        if (detailsDiv.classList.contains('d-none')) {
            detailsDiv.classList.remove('d-none');
            icon.classList.replace('bi-chevron-down', 'bi-chevron-up');
        } else {
            detailsDiv.classList.add('d-none');
            icon.classList.replace('bi-chevron-up', 'bi-chevron-down');
        }
    }

    loadHistory();
</script>

</main>
</body>
</html>
