<!DOCTYPE html>
<html th:replace="~{layouts/dashboard_layout :: layout(~{::title}, 'restaurant', ~{::main})}">
<head>
    <title>Quản lý Thực đơn</title>
</head>
<body>
<main>
<div th:replace="~{fragments/header :: dashboard_header('restaurant')}"></div>


<!-- Search + Filter -->
<div class="card border-0 shadow-sm mb-4" style="border-radius:16px;">
    <div class="card-body p-3">
        <div class="row g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px;"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="menuSearch" class="form-control border-start-0" placeholder="Tìm tên món hoặc mô tả..." oninput="filterMenu(this.value)" style="border-radius:0 10px 10px 0;">
                </div>
            </div>
            <div class="col-md-3">
                <select class="form-select" onchange="filterAvailability(this.value)" style="border-radius:10px;">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="available">Đang có sẵn</option>
                    <option value="unavailable">Tạm hết</option>
                </select>
            </div>
            <div class="col-md-3 text-end">
                <button class="btn btn-warning fw-bold rounded-pill px-4 w-100" data-bs-toggle="modal" data-bs-target="#menuModal" onclick="openAddModal()">
                    <i class="bi bi-plus-lg me-1"></i>Thêm món
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Auth error -->
<div id="authError" class="alert alert-warning rounded-4 d-none text-center">
    <i class="bi bi-shield-exclamation fs-2 d-block mb-2"></i>
    <p>Bạn cần đăng nhập để quản lý thực đơn</p>
    <a href="/common/auth" class="btn btn-warning rounded-pill px-4 fw-bold">Đăng nhập</a>
</div>

<!-- Loading -->
<div id="loading" class="card border-0 shadow-sm p-4 text-center" style="border-radius:16px;">
    <div class="spinner-border text-warning" role="status"></div>
    <p class="text-muted mt-2 mb-0">Đang tải thực đơn...</p>
</div>

<!-- Menu Table -->
<div id="menuContainer" class="d-none">
    <div class="card border-0 shadow-sm overflow-hidden" style="border-radius:16px;">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4" style="width: 80px;">Ảnh</th>
                        <th>Tên món ăn</th>
                        <th>Giá bán</th>
                        <th class="text-center">Trạng thái</th>
                        <th class="text-end pe-4">Hành động</th>
                    </tr>
                </thead>
                <tbody id="menuTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="emptyMenu" class="text-center py-5 d-none">
    <div style="font-size:4rem">🍽️</div>
    <h5 class="fw-bold mt-2">Chưa có món ăn nào</h5>
    <p class="text-muted">Hãy thêm món đầu tiên vào thực đơn!</p>
    <button class="btn btn-warning rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#menuModal" onclick="openAddModal()">Thêm món ngay</button>
</div>


<!-- Add/Edit Modal -->
<div class="modal fade" id="menuModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="modalTitle">Thêm món mới</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Tên món ăn *</label>
                    <input type="text" id="itemName" class="form-control" placeholder="VD: Bún bò Huế" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Mô tả</label>
                    <textarea id="itemDesc" class="form-control" rows="2" placeholder="Mô tả ngắn về món ăn..."></textarea>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold small">Giá (VNĐ) *</label>
                        <input type="number" id="itemPrice" class="form-control" placeholder="50000" min="1000" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold small">Trạng thái</label>
                        <select id="itemAvailable" class="form-select">
                            <option value="true">Đang có sẵn</option>
                            <option value="false">Tạm hết</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Ảnh món ăn</label>
                    <input type="file" id="itemImageFile" class="form-control" accept="image/*" onchange="uploadImage(this)">
                    <input type="hidden" id="itemImage">
                    <div class="mt-2" id="imagePreviewContainer" style="display:none;">
                        <img id="imagePreview" src="" class="rounded-3" style="max-height:150px;max-width:100%;object-fit:cover;" alt="">
                    </div>
                    <div class="mt-2">
                        <small class="text-muted">Hoặc nhập URL: </small>
                        <input type="url" id="itemImageUrl" class="form-control form-control-sm mt-1" placeholder="https://..." oninput="previewImageUrl(this.value)">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">URL Video Ngắn (Food TikTok)</label>
                    <input type="url" id="itemVideoUrl" class="form-control" placeholder="https://.../video.mp4">
                    <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">Chỉ hỗ trợ video định dạng .mp4 hoặc link trực tiếp</small>
                </div>
                <div id="modalAlert" class="alert d-none"></div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                <button class="btn btn-warning fw-bold rounded-pill px-4" onclick="saveItem()" id="btnSave">Lưu món ăn</button>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.menu-item-card { transition: transform 0.15s, box-shadow 0.15s; }
.menu-item-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.1) !important; }
</style>

<script>
    const token = localStorage.getItem('jwt_token');
    let allItems = [], modalInstance = null, availFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
        modalInstance = new bootstrap.Modal(document.getElementById('menuModal'));
        loadMenu();
    });

    async function loadMenu() {
        try {
            const res = await fetch('/api/restaurant/menu', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.status === 401 || res.status === 403) {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('authError').classList.remove('d-none');
                return;
            }
            allItems = await res.json();
            document.getElementById('loading').classList.add('d-none');
            applyFilters();
        } catch {
            document.getElementById('loading').innerHTML = '<div class="col-12 text-center text-danger py-4"><i class="bi bi-wifi-off fs-2"></i><p>Lỗi kết nối</p></div>';
        }
    }

    function filterMenu(q) { applyFilters(q); }
    function filterAvailability(v) { availFilter = v; applyFilters(document.getElementById('menuSearch').value); }

    function applyFilters(q = '') {
        let items = allItems;
        if (q) items = items.filter(i => i.name.toLowerCase().includes(q.toLowerCase()) || (i.description && i.description.toLowerCase().includes(q.toLowerCase())));
        if (availFilter === 'available') items = items.filter(i => i.isAvailable);
        else if (availFilter === 'unavailable') items = items.filter(i => !i.isAvailable);
        renderMenu(items);
    }

    function renderMenu(items) {
        const container = document.getElementById('menuContainer');
        const tbody = document.getElementById('menuTableBody');
        const empty = document.getElementById('emptyMenu');
        
        if (!items.length) {
            container.classList.add('d-none');
            empty.classList.remove('d-none');
            return;
        }
        empty.classList.add('d-none');
        container.classList.remove('d-none');
        tbody.innerHTML = '';

        items.forEach(item => {
            const img = item.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&h=100&fit=crop';
            const statusLabel = item.isAvailable ? '<span class="text-success fw-bold small">Đang bán</span>' : '<span class="text-danger fw-bold small">Tạm hết</span>';
            
            tbody.insertAdjacentHTML('beforeend', `
            <tr>
                <td class="ps-4">
                    <img src="${img}" class="rounded-3 shadow-sm" style="width:50px;height:50px;object-fit:cover;"
                         onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&h=100&fit=crop'">
                </td>
                <td>
                    <div class="fw-bold mb-0">${item.name}</div>
                    <div class="text-muted small text-truncate" style="max-width:250px;">${item.description || 'Chưa có mô tả'}</div>
                </td>
                <td>
                    <span class="text-danger fw-bold">${formatVND(item.price)}</span>
                </td>
                <td class="text-center">
                    <div class="form-check form-switch d-inline-block">
                        <input class="form-check-input" type="checkbox" role="switch" 
                               ${item.isAvailable ? 'checked' : ''} 
                               onchange="toggleAvailability(${item.id}, this.checked)">
                    </div>
                    <div id="status-${item.id}">${statusLabel}</div>
                </td>
                <td class="text-end pe-4">
                    <div class="d-flex justify-content-end gap-2">
                        <button class="btn btn-sm btn-light border rounded-pill px-3" onclick='openEditModal(${JSON.stringify(item).replace(/'/g,"&#39;")})'>
                            <i class="bi bi-pencil me-1"></i>Sửa
                        </button>
                        <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="deleteItem(${item.id}, '${item.name.replace(/'/g,"&#39;")}')">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>
                </td>
            </tr>`);
        });
    }

    function formatVND(n) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n || 0); }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'Thêm món mới';
        document.getElementById('editId').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemDesc').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemAvailable').value = 'true';
        document.getElementById('itemImage').value = '';
        document.getElementById('itemImageUrl').value = '';
        document.getElementById('itemVideoUrl').value = '';
        document.getElementById('imagePreviewContainer').style.display = 'none';
        document.getElementById('modalAlert').className = 'alert d-none';
    }

    function openEditModal(item) {
        document.getElementById('modalTitle').textContent = 'Chỉnh sửa: ' + item.name;
        document.getElementById('editId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemDesc').value = item.description || '';
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemAvailable').value = item.isAvailable ? 'true' : 'false';
        document.getElementById('itemImage').value = item.imageUrl || '';
        document.getElementById('itemImageUrl').value = item.imageUrl || '';
        document.getElementById('itemVideoUrl').value = item.videoUrl || '';
        if (item.imageUrl) {
            document.getElementById('imagePreview').src = item.imageUrl;
            document.getElementById('imagePreviewContainer').style.display = 'block';
        } else {
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }
        document.getElementById('modalAlert').className = 'alert d-none';
        modalInstance.show();
    }

    function previewImageUrl(url) {
        if (url) {
            document.getElementById('itemImage').value = url;
            document.getElementById('imagePreview').src = url;
            document.getElementById('imagePreviewContainer').style.display = 'block';
        } else {
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }
    }

    async function uploadImage(input) {
        if (!input.files || !input.files[0]) return;
        const fd = new FormData();
        fd.append('file', input.files[0]);
        try {
            const res = await fetch('/api/upload/image', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
            const d = await res.json();
            if (res.ok) {
                document.getElementById('itemImage').value = d.url;
                document.getElementById('itemImageUrl').value = d.url;
                document.getElementById('imagePreview').src = d.url;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            }
        } catch {}
    }

    async function saveItem() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('itemName').value.trim();
        const price = parseFloat(document.getElementById('itemPrice').value);
        if (!name || !price) {
            showModalAlert('Vui lòng nhập đầy đủ tên và giá!', 'danger');
            return;
        }
        const payload = {
            name,
            description: document.getElementById('itemDesc').value.trim(),
            price,
            imageUrl: document.getElementById('itemImage').value || null,
            videoUrl: document.getElementById('itemVideoUrl').value || null,
            isAvailable: document.getElementById('itemAvailable').value === 'true'
        };
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/restaurant/menu/${id}` : '/api/restaurant/menu';
        document.getElementById('btnSave').disabled = true;
        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(payload)
            });
            const d = await res.json();
            if (res.ok) {
                modalInstance.hide();
                loadMenu();
            } else {
                showModalAlert(d.error || 'Lưu thất bại!', 'danger');
            }
        } catch { showModalAlert('Lỗi kết nối!', 'danger'); }
        finally { document.getElementById('btnSave').disabled = false; }
    }

    async function deleteItem(id, name) {
        if (!confirm(`Xóa món "${name}"?`)) return;
        try {
            const res = await fetch(`/api/restaurant/menu/${id}`, {
                method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) loadMenu();
            else alert('Không thể xóa món này!');
        } catch { alert('Lỗi kết nối!'); }
    }

    async function toggleAvailability(id, newAvailable) {
        const item = allItems.find(i => i.id === id);
        if (!item) return;
        
        try {
            const res = await fetch(`/api/restaurant/menu/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ 
                    name: item.name,
                    description: item.description,
                    price: item.price,
                    imageUrl: item.imageUrl,
                    videoUrl: item.videoUrl,
                    isAvailable: newAvailable 
                })
            });
            
            if (res.ok) {
                // Optimistically update the status text
                const statusDiv = document.getElementById(`status-${id}`);
                if (statusDiv) {
                    statusDiv.innerHTML = newAvailable 
                        ? '<span class="text-success fw-bold small">Đang bán</span>' 
                        : '<span class="text-danger fw-bold small">Tạm hết</span>';
                }
                // Update local data
                item.isAvailable = newAvailable;
            } else {
                alert('Không thể cập nhật trạng thái món ăn!');
                loadMenu(); // Refresh on error
            }
        } catch { 
            alert('Lỗi kết nối!'); 
            loadMenu();
        }
    }

    function showModalAlert(msg, type) {
        const el = document.getElementById('modalAlert');
        el.className = `alert alert-${type}`;
        el.textContent = msg;
    }
</script>
</main>
</body>
</html>
